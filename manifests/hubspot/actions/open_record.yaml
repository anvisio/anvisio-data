_meta:
  name: manifests/hubspot/actions/open_record.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    open_record atom — navigate to a HubSpot record detail page
    (/contacts/{portalId}/record/{objectTypeId}/{recordId}).
    Read-only navigation primitive that lands callers on the
    RecordView (the anchor for inline updates + activities).
  changelog:
    - "0.1.0 (2026-05-23): initial seed. Live-verified 2026-05-23
       against portal 245597800 deal 316988725990."

description: Open a HubSpot record detail page.
object: "{{inputs.object_type}}"
object_types: [Contact, Company, Deal, Ticket]
commits_changes: false
depends_on_view: any
inputs:
  portal_id:
    type: text
    required: true
    sample: "245597800"
  object_type_id:
    type: text
    required: true
    description: "Numeric type id — Contact 0-1, Company 0-2, Deal 0-3, Ticket 0-5."
    sample: "0-3"
  record_id:
    type: text
    required: true
    sample: "316988725990"
result:
  opened: boolean

flavors:
  browser:
    requires_auth: session_cookie
    label: Navigate to the record detail page
    recipe:
      - id: nav_record
        type: navigate
        args:
          url: "{instance.origin}/contacts/{{inputs.portal_id}}/record/{{inputs.object_type_id}}/{{inputs.record_id}}"
    outcomes:
      - action: opened
        signal:
          type: url_matches
          pattern: "/record/[0-9]+-[0-9]+/[0-9]+"
          timeout_ms: 10000
        extract:
          opened:
            literal: true
