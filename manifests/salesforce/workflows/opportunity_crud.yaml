_meta:
  name: manifests/salesforce/workflows/opportunity_crud.yaml
  version: 1.0.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    Full CRUD chain against the Opportunity object — the canonical
    smoke-test that proves create_record + update_record + open_record
    + search_record + delete_record + list_records (Opportunity) all
    work end-to-end. Self-fixturing: create_opp_committed produces the
    record_id every downstream step uses via input_from.

    Promoted from the legacy manifests/salesforce/test_catalog.json
    bare-array on 2026-05-16 (Phase 4 Slice 7 of the four-cleanup
    refactor). The Lead-related step (list_leads) moved to
    workflows/lead_crud.yaml.
  changelog:
    - "1.0.0 (2026-05-16): initial promote from test_catalog.json. Phase 4 Slice 7."

name: opportunity_crud
description: List Opportunities → create (preview + commit) → open → update → search → delete.
steps:
  - id: list_opportunities
    action: list_records
    flavor: dom
    commit: true
    inputs:
      object_type: Opportunity
    expected_outcome: listed
  - id: create_opp_dry
    action: create_record
    flavor: dom
    commit: false
    inputs:
      object_type: Opportunity
      fields:
        Name: Anvisio Onboarding Test Opp
        StageName: Prospecting
        CloseDate: 12/31/2026
    expected_outcome: ready_to_save
  - id: create_opp_committed
    action: create_record
    flavor: dom
    commit: true
    inputs:
      object_type: Opportunity
      fields:
        Name: Anvisio Onboarding Test Opp
        StageName: Prospecting
        CloseDate: 12/31/2026
    expected_outcome: created
  - id: open_created_opp
    action: open_record
    flavor: dom
    commit: true
    depends_on: create_opp_committed
    input_from:
      record_id: create_opp_committed.outcomes.record_id
    inputs:
      object_type: Opportunity
    expected_outcome: opened
  - id: update_created_opp
    action: update_record
    flavor: dom
    commit: true
    depends_on: open_created_opp
    input_from:
      record_id: create_opp_committed.outcomes.record_id
    inputs:
      object_type: Opportunity
      fields:
        NextStep: Updated by Anvisio test
    expected_outcome: updated
  - id: search_for_created_opp
    action: search_record
    flavor: dom
    commit: true
    depends_on: update_created_opp
    input_from:
      query: create_opp_committed.outcomes.record_name
    expected_outcome: searched
  - id: delete_created_opp
    action: delete_record
    flavor: dom
    commit: true
    depends_on: search_for_created_opp
    input_from:
      record_id: create_opp_committed.outcomes.record_id
    inputs:
      object_type: Opportunity
    expected_outcome: deleted
