document:
  dsl: '1.0.0'
  namespace: salesforce
  name: sales-call-notes
  version: '1.0.0'
  title: After a sales call — Opportunity + Contact + Email + Meeting
  summary: |
    The canonical "after a sales call" demo, re-implemented on the v70
    blueprints engine + the spec-72 HITL write atoms. Predecessor: the
    hardcoded /demo-wizard (removed Phase D 2026-05-18) — same narrative,
    now data not code.

    The demo walks through five HITL writes against a SINGLE story:
    Sarah at Global Industries confirmed a $200k flat rate; loop in CTO
    James Wong for technical sign-off; schedule the technical review;
    send Sarah the follow-up summary.

    Steps:
      1. SETUP — create a throwaway "Global Industries Pilot" Opportunity
         so the demo is portable across orgs (no pre-existing record
         needed). Click SAVE in the SF New modal.
      2. UPDATE the Opportunity — Amount / Stage / NextStep / Description
         reflecting the call result. Click SAVE in the SF edit modal.
      3. ADD CONTACT — create James Wong (CTO) as a Contact for follow-up.
         Click SAVE in the SF New modal.
      4. SEND EMAIL — compose the follow-up summary to Sarah via Gmail.
         Click SEND in the compose pane.
      5. SCHEDULE MEETING — 45-min technical review next Tuesday with
         both Sarah and James as attendees. Click SAVE in the calendar
         event editor.

    Every step is `commit: false` (spec 71 HITL): the recipe FILLS each
    form, you review the SaaS UI and click the destructive button. Each
    write atom's L4 outcome is a spec-72 toaster ladder, so a HITL
    discard (Cancel / Escape) resolves as `cancelled`, not a Trap-2 fake
    success.

    Pre-reqs (open these tabs first):
      - A signed-in Salesforce Lightning dev/test org
      - A signed-in Gmail tab (https://mail.google.com)
      - A signed-in Google Calendar tab (https://calendar.google.com)

    Drive: /run-blueprint salesforce sales_call_notes
    Cleanup: the demo intentionally does NOT delete its fixtures.
      The fixture Opportunity + Contact remain in your org so you can
      see the result after the demo. Delete them manually when done
      (or run /run-blueprint salesforce opportunity_crud which CRUDs
      its own throwaway data including a final delete).

do:
  - fixture_opp:
      label: 'Setup: create the "Global Industries Pilot" Opportunity (click SAVE in SF)'
      call: salesforce.atom.create_record
      commit: false
      with:
        object_type: Opportunity
        fields:
          Name: Global Industries Pilot
          StageName: Prospecting
          CloseDate: 12/31/2026
          Amount: 50000

  - open_fixture_opp:
      label: 'Opening the Opportunity (navigation only)'
      call: salesforce.atom.open_record
      with:
        object_type: Opportunity
        record_id: '${ .fixture_opp.record_id }'

  - update_opp_post_call:
      label: 'Update the Opportunity — $200k flat rate, Negotiation/Review, follow-up notes (click SAVE in SF)'
      call: salesforce.atom.update_record
      commit: false
      with:
        object_type: Opportunity
        record_id: '${ .fixture_opp.record_id }'
        fields:
          Amount: 200000
          StageName: Negotiation/Review
          NextStep: Technical review with CTO James Wong
          Description: |
            Sarah confirmed $200k flat rate. Pilot starts in 2 weeks.
            CTO James Wong needs to sign off — scheduling the technical
            review for next Tuesday.

  - add_contact:
      label: 'Add the follow-up Contact — James Wong (CTO) (click SAVE in SF)'
      call: salesforce.atom.create_record
      commit: false
      with:
        object_type: Contact
        fields:
          FirstName: James
          LastName: Wong
          Email: james.wong@example.com
          Title: CTO

  - send_summary_email:
      label: 'Compose the follow-up email to Sarah (click SEND in Gmail)'
      call: gmail.atom.send_email
      commit: false
      with:
        fields:
          To: ['sarah@example.com']
          Subject: 'Follow-up: Pricing & Pilot Timeline — Global Industries'
          Body: |
            Hi Sarah,

            Thanks for the call today. To confirm what we agreed: $200k
            flat rate, with the pilot starting in 2 weeks.

            I'm looping in our CTO James Wong for the technical sign-off
            and have scheduled a 45-minute technical review for next
            Tuesday at 2pm Pacific — calendar invite to follow.

            Best,

  - schedule_review_meeting:
      label: 'Schedule the 45-min technical review (Tue 2pm PT, both attendees) (click SAVE in Google Calendar)'
      call: google-calendar.atom.create_event
      commit: false
      with:
        fields:
          Title: 'Technical Review — Global Industries Pilot'
          StartTime: '2026-06-09T14:00:00-07:00'
          EndTime:   '2026-06-09T14:45:00-07:00'
          Attendees:
            - sarah@example.com
            - james.wong@example.com
          Description: |
            Technical review with Sarah (Global Industries) and James
            Wong (CTO, Global Industries) for the pilot.

            Confirmed on the discovery call: $200k flat rate; pilot
            start in 2 weeks pending James's technical sign-off.
