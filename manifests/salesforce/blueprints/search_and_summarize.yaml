_meta:
  name: manifests/salesforce/compositions/search_and_summarize.yaml
  version: 1.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    Smallest end-to-end demo of spec 70's session_api transport. Picks
    a search query from canned options, runs a SF global SOSL search
    via the Aura controller (no DOM drive), then synthesizes a
    3-sentence summary of the matches. Pairs with
    salesforce/actions/search_record.yaml's session_api flavor +
    call_platform_api recipe step.
  changelog:
    - "1.1.0 (2026-05-19): use ask: to pick a canned query (engine ask: is option-picker only — free-text inputs need an out-of-band mechanism)."
    - "1.0.0 (2026-05-19): initial author."

document:
  dsl: '1.0.0'
  namespace: salesforce
  name: search-and-summarize
  version: '1.1.0'
  title: Search SF and summarize the matches
  summary: |
    Pick a query → SOSL search via Aura → synthesize a short summary.
    Smallest end-to-end demo of spec 70's session_api transport: one
    atom call → one synthesize call → wizard renders the summary.

do:
  - pickQuery:
      label: Choosing the search query
      ask:
        prompt: "What do you want to search for in your SF org?"
        options:
          - renewal
          - Acme
          - pipeline
          - test
          - opportunity

  - matches:
      label: Searching Salesforce (Account)
      call: salesforce.atom.search_record
      with:
        query: '${ .pickQuery.choice }'
        object_type: Account
        list_view_api_name: AllAccounts

  - summary:
      label: Summarizing the matches
      synthesize: |
        Compose a 3-sentence summary of the SF records that matched
        the search "${ .pickQuery.choice }". Group by sObject type if
        multiple types are present. Mention the top match in each
        group by Name (and Stage when present for opportunities). Keep
        it conversational, like briefing a teammate.
      with:
        query: '${ .pickQuery.choice }'
        matches: '${ .matches.matches }'
