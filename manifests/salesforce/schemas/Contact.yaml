_meta:
  name: manifests/salesforce/schemas/Contact.yaml
  version: 0.2.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-24
  description: |
    Contact schema: standard SF Contact fields trimmed from the live
    org's RecordUiController.getObjectInfo describe (2026-05-24). Used
    by create_record / update_record when object_type=Contact.
  changelog:
    - "0.2.0 (2026-07-07): AccountId.label 'Account ID' → 'Account Name' (SF's on-page FORM label for the lookup), so the salesforce.lookup widget's records-record-layout-item[field-label='{{label}}'] anchor matches. See Opportunity 1.2.0."
    - "0.1.0 (2026-05-24): initial schema authored from live SF describe (orgfarm dev edition). Trimmed to ~15 user-facing fields out of the 68 standard fields. Mailing-address pair kept; Other-address pair dropped."

description: |
  A Salesforce Contact. Key prefix 003.
  Required: LastName.
  Person record, typically linked to an Account. Live-probed.
primary_key: [Id]
fields:
  Id:
    type: id
    label: Contact ID
    primary: true
    readonly: true
    required: true
  LastName:
    type: text
    label: Last Name
    required: true
  FirstName:
    type: text
    label: First Name
    required: false
  Salutation:
    type: picklist
    label: Salutation
    required: false
  AccountId:
    type: id
    # Label is the ON-PAGE FORM label — SF renders the lookup as "Account Name",
    # not "Account ID". The salesforce.lookup widget anchors on
    # records-record-layout-item[field-label='{{label}}'], so it must match the
    # form label (2026-07-07: fixed the lookup-fill open_lookup selector miss).
    label: Account Name
    required: false
    ref: Account.Id
  Email:
    type: text
    label: Email
    required: false
  Phone:
    type: text
    label: Business Phone
    required: false
  MobilePhone:
    type: text
    label: Mobile Phone
    required: false
  Title:
    type: text
    label: Title
    required: false
  Department:
    type: text
    label: Department
    required: false
  LeadSource:
    type: picklist
    label: Lead Source
    required: false
  ReportsToId:
    type: id
    label: Reports To
    required: false
    ref: Contact.Id
  MailingStreet:
    type: textarea
    label: Mailing Street
    required: false
  MailingCity:
    type: text
    label: Mailing City
    required: false
  MailingState:
    type: text
    label: Mailing State/Province
    required: false
  MailingPostalCode:
    type: text
    label: Mailing Zip/Postal Code
    required: false
  MailingCountry:
    type: text
    label: Mailing Country
    required: false
  Description:
    type: textarea
    label: Description
    required: false
  OwnerId:
    type: id
    label: Owner ID
    required: false
    ref: User.Id
