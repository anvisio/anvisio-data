_meta:
  name: manifests/salesforce/schemas/Lead.yaml
  version: 1.1.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    Lead schema: standard SF Lead object fields (FirstName, LastName, Company, Email, Phone, LeadSource, Status). Used by create_record / update_record when object_type=Lead.
  changelog:
    - "1.1.0 (2026-05-24): add primary_key:[Id] per v70 INTEGRATION_FORMAT signature parity rule."
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/. Live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

description: >
  A Salesforce Lead. Key prefix 00Q.

  Required: LastName, Company.

  Unqualified prospect, convertible to Account/Contact/Opportunity.
  Live-probed.
primary_key: [Id]
fields:
  Id:
    type: id
    label: Lead ID
    primary: true
    readonly: true
    required: true
  LastName:
    type: text
    label: Last Name
    required: true
  Company:
    type: text
    label: Company
    required: true
  Salutation:
    type: picklist
    label: Salutation
    required: false
  FirstName:
    type: text
    label: First Name
    required: false
  Email:
    type: text
    label: Email
    required: false
  Phone:
    type: text
    label: Phone
    required: false
  MobilePhone:
    type: text
    label: Mobile Phone
    required: false
  Title:
    type: text
    label: Title
    required: false
  Industry:
    type: picklist
    label: Industry
    required: false
  LeadSource:
    type: picklist
    label: Lead Source
    required: false
  Status:
    type: picklist
    label: Status
    required: false
  Rating:
    type: picklist
    label: Rating
    required: false
  Website:
    type: text
    label: Website
    required: false
  AnnualRevenue:
    type: number
    label: Annual Revenue
    required: false
  NumberOfEmployees:
    type: number
    label: Employees
    required: false
  Description:
    type: textarea
    label: Description
    required: false
