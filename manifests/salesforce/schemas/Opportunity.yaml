_meta:
  name: manifests/salesforce/schemas/Opportunity.yaml
  version: 1.2.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    Opportunity schema: standard SF Opportunity object fields (Name, AccountId, Amount, CloseDate, StageName, NextStep). Used by create_record / update_record when object_type=Opportunity.
  changelog:
    - "1.2.0 (2026-07-07): AccountId.label 'Account ID' → 'Account Name' (SF's on-page FORM label for the lookup). The salesforce.lookup widget anchors on records-record-layout-item[field-label='{{label}}'], so the schema label must be the form label — with 'Account ID' the lookup's open_lookup click found no selector (live 2026-07-07). Enables the AccountId lookup fill end-to-end."
    - "1.1.0 (2026-05-24): add primary_key:[Id] per v70 INTEGRATION_FORMAT signature parity rule."
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/. Live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

description: |
  A Salesforce Opportunity. Key prefix 006.
  Required: Name, StageName, CloseDate.
  Sales deal in the pipeline. References Account. Live-probed.
primary_key: [Id]
fields:
  Id:
    type: id
    label: Opportunity ID
    primary: true
    readonly: true
  Name:
    type: text
    label: Name
    required: true
  StageName:
    type: picklist
    label: Stage
    required: true
  CloseDate:
    type: date
    label: Close Date
    required: true
  Amount:
    type: number
    label: Amount
    optional: true
  Probability:
    type: number
    label: Probability (%)
    optional: true
  Type:
    type: picklist
    label: Opportunity Type
    optional: true
  LeadSource:
    type: picklist
    label: Lead Source
    optional: true
  AccountId:
    type: id
    # Label is the ON-PAGE FORM label — SF renders the lookup as "Account Name",
    # not "Account ID". The salesforce.lookup widget anchors on
    # records-record-layout-item[field-label='{{label}}'], so it must match the
    # form label (2026-07-07: fixed the lookup-fill open_lookup selector miss).
    label: Account Name
    optional: true
    ref: Account.Id
  OwnerId:
    type: id
    label: Owner ID
    optional: true
    ref: User.Id
  Description:
    type: textarea
    label: Description
    optional: true
  NextStep:
    type: text
    label: Next Step
    optional: true
