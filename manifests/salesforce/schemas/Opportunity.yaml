_meta:
  name: manifests/salesforce/schemas/Opportunity.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    Salesforce Opportunity schema — primary CRM entity for the
    pipeline_prep composition. Fields below match the standard
    Opportunity sObject; per-org customizations (extra picklists,
    record types) heal at first use.
  changelog:
    - "0.1.0 (2026-05-19): initial v70 seed (standard Opportunity fields)."

description: |
  Salesforce Opportunity — a potential deal in the pipeline. Standard
  sObject; every SF org has Opportunity unless explicitly removed.
fields:
  Id:
    type: id
    label: Opportunity ID
    primary: true
    readonly: true
  Name:
    type: text
    label: Opportunity Name
    required: true
    sample: Acme Q4 Renewal
  AccountId:
    type: id
    label: Account Name
    required: true
    ref: Account
    sample: 001000000000001AAA
  StageName:
    type: picklist
    label: Stage
    required: true
    default_values:
      - Prospecting
      - Qualification
      - Needs Analysis
      - Value Proposition
      - Id. Decision Makers
      - Perception Analysis
      - Proposal/Price Quote
      - Negotiation/Review
      - Closed Won
      - Closed Lost
    sample: Prospecting
  Amount:
    type: currency
    label: Amount
    sample: 50000
  CloseDate:
    type: date
    label: Close Date
    required: true
    sample: 2026-06-30
  OwnerId:
    type: id
    label: Opportunity Owner
    readonly: true
    ref: User
  Description:
    type: rich_text
    label: Description
  Probability:
    type: percent
    label: Probability (%)
    readonly: true
  ForecastCategoryName:
    type: picklist
    label: Forecast Category
    default_values: [Omitted, Pipeline, Best Case, Commit, Closed]
  Type:
    type: picklist
    label: Type
    default_values: [Existing Customer - Upgrade, Existing Customer - Replacement, Existing Customer - Downgrade, New Customer]
  LastModifiedDate:
    type: datetime
    label: Last Modified Date
    readonly: true
natural_keys:
  - Name
  - AccountId
