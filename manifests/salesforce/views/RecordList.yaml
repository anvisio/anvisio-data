_meta:
  name: manifests/salesforce/views/RecordList.yaml
  version: 1.0.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    RecordList view — per-object tab list view (/lightning/o/{object_type}/list). Reached via list_records; entry waits for the records table.
  changelog:
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/ — live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

name: RecordList

entry:
  url: "{instance.origin}/lightning/o/{object_type}/list"
landmark_probe:
  selector: lst-list-view-manager
  timeout_ms: 12000
verify:
  - type: url_matches
    pattern: /lightning/o/.+/list
  - type: selector_appears
    selector: lst-list-view-manager
    timeout_ms: 10000
placeholders:
  object_type:
    type: text
    sample: Opportunity
widgets:
  - salesforce.new_button
  - salesforce.global_search_input
