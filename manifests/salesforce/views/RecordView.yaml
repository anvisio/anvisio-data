_meta:
  name: manifests/salesforce/views/RecordView.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    Record detail view — /lightning/r/<Object>/<record_id>/view. The
    landing surface for read / update / delete on an individual record.
    URL-deeplink entry.
  changelog:
    - "0.1.0 (2026-05-19): initial v70 seed."

name: RecordView
description: Detail view for a single SF record.
entry:
  url: "{instance.origin}/lightning/r/{object_type}/{record_id}/view"
url_patterns:
  - "{instance.origin}/lightning/r/.*/.*/view.*"
identifying_selectors:
  - records-highlights2
  - records-record-layout2
landmark_probe:
  selector: records-highlights2
  timeout_ms: 10000
placeholders:
  object_type:
    type: text
    sample: Opportunity
  record_id:
    type: id
    sample: 0060000000000001AAA
widgets:
  - salesforce.edit_button
  - salesforce.delete_button
  - salesforce.show_more_actions_button
  - salesforce.field_value
