_meta:
  name: manifests/salesforce/views/RecordView.yaml
  version: 1.0.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    RecordView view — record detail / view page (/lightning/r/{object_type}/{record_id}/view). Reached via open_record; anchor for update + delete affordances.
  changelog:
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/ — live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

name: RecordView

entry:
  url: "{instance.origin}/lightning/r/{object_type}/{record_id}/view"
landmark_probe:
  selector: records-highlights2
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: /lightning/r/.+/view
  - type: selector_appears
    selector: records-highlights2
    timeout_ms: 12000
placeholders:
  object_type:
    type: text
    sample: Opportunity
  record_id:
    type: id
    sample: 006dM00000fJSAMPLE
widgets:
  - salesforce.record_overflow_caret
  - salesforce.edit_menu_item
  - salesforce.delete_menu_item
  - salesforce.global_search_input
