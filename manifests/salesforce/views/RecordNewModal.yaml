_meta:
  name: manifests/salesforce/views/RecordNewModal.yaml
  version: 1.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    RecordNewModal view — new-record modal opened from the object's list view + 'New' button. URL deeplink /lightning/o/{object_type}/new.
  changelog:
    - "1.1.0 (2026-05-30): verify anchors on `div[role='dialog'][aria-label^='New ']` + `button[name='SaveEdit']` instead of `records-record-layout-item`. Both are reliable landmarks once the tab is on the URL; the dialog selector is in the top DOM (no shadow walk) so verify resolves faster. SaveEdit confirms the form is interactive. cdn_schema_version 60.4.2 → 70.0.0."
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/ — live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

name: RecordNewModal

entry:
  url: "{instance.origin}/lightning/o/{object_type}/new"
landmark_probe:
  selector: div[role='dialog'][aria-label^='New '], records-record-layout-item
  timeout_ms: 15000
verify:
  - type: selector_appears
    selector: div[role='dialog'][aria-label^='New ']
    timeout_ms: 12000
  - type: selector_appears
    selector: button[name='SaveEdit']
    timeout_ms: 12000
placeholders:
  object_type:
    type: text
    sample: Opportunity
widgets:
  - salesforce.save_button
  - salesforce.cancel_button
exit:
  - id: exit_via_navigate
    type: navigate
    args:
      url: "{instance.origin}/lightning/page/home"
    verify:
      type: url_matches
      pattern: lightning/page/home
      timeout_ms: 10000
