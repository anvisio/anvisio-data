_meta:
  name: manifests/salesforce/views/RecordEditModal.yaml
  version: 1.0.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    RecordEditModal view — record edit modal opened from a record view. URL deeplink /lightning/r/{object_type}/{record_id}/edit (Shape A per propose v7.5).
  changelog:
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/ — live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

name: RecordEditModal

entry:
  url: "{instance.origin}/lightning/r/{object_type}/{record_id}/edit"
landmark_probe:
  selector: records-record-layout-item, div[role='dialog'][aria-label^='Edit ']
  timeout_ms: 15000
verify:
  - type: selector_appears
    selector: records-record-layout-item
    timeout_ms: 12000
  - type: selector_appears
    selector: button[name='SaveEdit']
    timeout_ms: 12000
placeholders:
  object_type:
    type: text
    sample: Opportunity
  record_id:
    type: id
    sample: 006dM00000fJSAMPLE
widgets:
  - salesforce.save_button
exit:
  - id: exit_via_navigate
    type: navigate
    args:
      url: "{instance.origin}/lightning/page/home"
    verify:
      type: url_matches
      pattern: lightning/page/home
      timeout_ms: 10000
