_meta:
  name: manifests/salesforce/views/Dashboard.yaml
  version: 1.0.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    Dashboard view — SF Lightning home dashboard landing page (/lightning/page/home). Anchor for global search affordances + top-nav.
  changelog:
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/ — live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

name: Dashboard

entry:
  url: "{instance.origin}/lightning/page/home"
landmark_probe:
  selector: header#oneHeader, .slds-global-header_container
  timeout_ms: 10000
verify:
  - type: selector_appears
    selector: .slds-global-header_container
    timeout_ms: 8000
widgets:
  - salesforce.global_search_input
