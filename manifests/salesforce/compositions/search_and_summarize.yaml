_meta:
  name: manifests/salesforce/compositions/search_and_summarize.yaml
  version: 1.0.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    Smallest end-to-end demo of spec 70's session_api transport. Runs
    a SF global SOSL search via the Aura controller (no DOM drive),
    then synthesizes a 3-sentence summary of the matches. Pairs with
    salesforce/actions/search_record.yaml's session_api flavor +
    call_platform_api recipe step.

document:
  dsl: '1.0.0'
  namespace: salesforce
  name: search-and-summarize
  version: '1.0.0'
  title: Search SF and summarize the matches
  summary: |
    Take a free-text query, run a global SOSL search via the SF Aura
    controller (session-cookie + CSRF auth — no separate OAuth, no
    fetch_url CORS), then synthesize a short summary of what matched.
    Smallest end-to-end demo of spec 70's session_api transport:
    one atom call → one synthesize call → wizard renders the summary.

do:
  - matches:
      call: salesforce.atom.search_record
      with:
        query: '${ $inputs.query }'

  - summary:
      synthesize: |
        Compose a 3-sentence summary of the SF records that matched the
        search. Group by sObject type if multiple types are present.
        Mention the top match in each group by Name (and Stage when
        present for opportunities). Keep it conversational, like
        briefing a teammate.
      with:
        query: '${ $inputs.query }'
        matches: '${ .matches.matches }'
