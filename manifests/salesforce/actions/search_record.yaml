_meta:
  name: manifests/salesforce/actions/search_record.yaml
  version: 2.2.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    search_record atom — list-backed record search. Spec 70: three
    flavors. `browser` navigates to /lightning/search/?q= (live-verified,
    real cross-sObject SOSL, fastest browser path). `session_api`
    dispatches Aura `ListUiController.postListRecordsByName` from
    MAIN-world via call_platform_api kind: aura (session cookie + CSRF
    auto-extracted). This is the ONLY SF read path proven to work
    statelessly: SF REST (/services/data/...) 401s on the Lightning
    cookie, and every Aura *search* descriptor (SearchController,
    RecordGlobalActionListController.globalSearch, ...) returns
    non-success. postListRecordsByName lists a listview's records;
    callers filter / summarize client-side. `mcp` calls
    salesforce.search_all. Reads prefer session_api > mcp > browser per
    spec 70 §7. The session_api flavor is the search_and_summarize
    demo's transport.
  changelog:
    - "2.2.0 (2026-05-19): session_api reverts to Aura — `ListUiController.postListRecordsByName` (the descriptor proven working since 2026-04-16, used live in platform-extractors.ts salesforceLiveSearch). v2.1.0's `rest_session` parameterizedSearch failed live: heal proved SF REST API 401s INVALID_SESSION_ID on the Lightning session cookie (it needs an OAuth bearer token). postListRecordsByName lists the AllAccounts listview; the query is not server-side (SF list controllers ignore it) — the composition's synthesize step focuses the summary on the picked query. Outcome signal: url_matches on the SF domain (the Aura call runs inside the recipe step, so there is no post-recipe network event for network_response to catch)."
    - "2.1.0 (2026-05-19): swap session_api flavor to REST `parameterizedSearch` via `kind: rest_session` — REVERTED in 2.2.0 (SF REST rejects the session cookie)."
    - "2.0.0 (2026-05-19): spec 70 shape — `dom` → `browser`, drop emits_when, add mcp_tool + session_api (Aura) + mcp flavors. Live-verified browser nav carries over from v1.0.0."
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/ — live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

description: Search SF records. browser flavor runs real cross-sObject SOSL; session_api lists the AllAccounts listview (callers filter client-side).
object: SearchResult
commits_changes: false
depends_on_view: any
mcp_tool: salesforce.search_all
inputs:
  query:
    type: text
    required: true
    sample: Anvisio
  object_type:
    type: text
    required: false
result:
  searched: boolean
  matches: list<object>
flavors:
  browser:
    requires_auth: session_cookie
    label: Navigate to global search results
    recipe:
      - id: nav_to_search
        type: navigate
        args:
          url: "{instance.origin}/lightning/search/?q={{inputs.query}}"
    outcomes:
      - action: searched
        signal:
          type: url_matches
          pattern: /lightning/search/
          timeout_ms: 15000
        extract:
          searched:
            literal: true
          query:
            from_input: query
  session_api:
    requires_auth: session_cookie
    label: SF list records via Aura postListRecordsByName (session cookie + CSRF)
    recipe:
      - id: aura_list
        type: call_platform_api
        args:
          api_def:
            kind: aura
            descriptor: "aura://ListUiController/ACTION$postListRecordsByName"
            extract_path: "actions[0].returnValue.records"
          args:
            objectApiName: "Account"
            listViewApiName: "AllAccounts"
            listRecordsQuery:
              fields:
                - "Account.Id"
                - "Account.Name"
                - "Account.Industry"
                - "Account.Type"
                - "Account.Phone"
              pageSize: 50
              sortBy:
                - "Account.Name"
    outcomes:
      - action: searched
        # The Aura call runs entirely inside the recipe's call_platform_api
        # step — there is no post-recipe DOM/URL transition, so a
        # network_response signal would start watching AFTER the fetch
        # already completed and time out. url_matches on the SF domain
        # resolves on the first poll; `extract` then reads the step result.
        signal:
          type: url_matches
          pattern: "lightning\\.force\\.com"
          timeout_ms: 10000
        extract:
          matches:
            from_step: aura_list
          searched:
            literal: true
  mcp:
    requires_auth: mcp_server
    label: SOSL search via SF MCP server
    server: salesforce
    tool: search_all
    outcomes:
      - action: searched
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          matches:
            from_api_response: ".matches"
          searched:
            literal: true
