_meta:
  name: manifests/salesforce/actions/delete_record.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    delete_record atom — destructive remove of a single SF record by
    object_type + record_id. Spec 70 transport priority: writes prefer
    browser > session_api > mcp. The browser flavor opens RecordView,
    clicks the overflow menu → Delete → confirmation modal; the
    confirmation click is the commit-marked step. session_api fires
    DELETE /services/data/v62.0/sobjects/<obj>/<id>. mcp calls
    dml_records with operation: delete.
  changelog:
    - "0.1.0 (2026-05-19): initial v70 seed."

description: >
  Delete a single SF record by object_type + record_id. ALWAYS destructive;
  browser flavor's commit-marked step is the final confirmation-modal
  Delete button (preview mode shows the modal without confirming so the
  user sees what's about to be deleted).
object: "{{inputs.object_type}}"
object_types: [Opportunity, Lead, Contact, Account, Task, Note]
commits_changes: true
depends_on_view: RecordView
mcp_tool: salesforce.dml_records
inputs:
  object_type:
    type: text
    required: true
  record_id:
    type: id
    required: true
result:
  record_id: id
  deleted: boolean
flavors:
  browser:
    requires_auth: session_cookie
    label: Open overflow menu; click Delete; confirm when commit:true
    recipe:
      - id: open_overflow
        type: use_widget
        args:
          widget: salesforce.show_more_actions_button
          op: invoke
      - id: click_delete
        type: use_widget
        args:
          widget: salesforce.delete_button
          op: invoke
      - id: wait_confirm_modal
        type: wait_for_element
        args:
          selector: section[role='alertdialog']
          timeout_ms: 8000
      - id: confirm_delete
        type: use_widget
        commit: true
        args:
          widget: salesforce.confirm_delete_button
          op: invoke
    outcomes:
      - action: ready_to_delete
        signal:
          type: selector_appears
          selector: section[role='alertdialog'] button[title='Delete']
      - action: deleted
        signal:
          any:
            - { type: url_matches, pattern: "/lightning/o/.*/list" }
            - { type: selector_appears, selector: "[role='alert']:has-text('was deleted')" }
        extract:
          record_id:
            from_input: record_id
          deleted:
            literal: true
  session_api:
    requires_auth: session_cookie
    label: DELETE /services/data/v62.0/sobjects/{object_type}/{record_id}
    api: salesforce.delete_record_session
    outcomes:
      - action: deleted
        signal:
          type: network_response
          url_pattern: "/services/data/v62.0/sobjects/.*/.*"
          status: 204
        extract:
          record_id:
            from_input: record_id
          deleted:
            literal: true
  mcp:
    requires_auth: mcp_server
    label: Delete via SF MCP server (dml_records delete)
    server: salesforce
    tool: dml_records
    inputs_map:
      operation: delete
      objectName: "{{inputs.object_type}}"
      records:
        - Id: "{{inputs.record_id}}"
    outcomes:
      - action: deleted
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          record_id:
            from_input: record_id
          deleted:
            from_api_response: ".results[0].success"
