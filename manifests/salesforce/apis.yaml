_meta:
  name: manifests/salesforce/apis.yaml
  version: 2.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    Salesforce APIs catalog — Aura describe + Aura list + REST
    SOQL/SOSL/DML endpoints. Used by atom action `session_api`
    flavors and propose-time backend verification.

    CAVEAT (verified live 2026-05-19): the REST entries below
    (query/create/update/delete `_session`) 401 INVALID_SESSION_ID on
    the Lightning session cookie — SF REST requires an OAuth bearer
    token. They are kept for the future OAuth/BYOK transport, NOT the
    session_cookie path. The Aura entries (`aura_*`) are the working
    cookie-auth path on Lightning.
  changelog:
    - "2.1.0 (2026-05-19): replace `aura_search_global` (RecordGlobalActionListController.globalSearch — unverified, returns aura non-success live; see search_record.yaml v2.2.0) with `aura_list_records` (ListUiController.postListRecordsByName — proven working since 2026-04-16, used by platform-extractors.ts salesforceLiveSearch). Add the REST-rejects-session-cookie caveat to the description."
    - "2.0.0 (2026-05-19): add REST endpoints (create/update/delete/query) referenced by session_api flavors per spec 70 §7. Aura controller stub added for non-describe Aura calls."
    - "1.0.0 (2026-05-16): initial promote from .tmp-sf-manifest-8of8-2026-05-15/ — live-verified end-to-end on 2026-05-15 (CRUD 8/8 at $0.09)."

apis:
  # ── Aura controller (live-verified at propose 2026-05-14) ─────────
  aura_get_object_info:
    transport: aura
    auth: session_cookie
    domain_condition: "*.lightning.force.com"
    endpoint_pattern: "{instance.origin}/aura?r=1"
    method: POST
    descriptor: aura://RecordUiController/ACTION$getObjectInfo
    extract_path: actions[0].returnValue
    inputs:
      objectApiName:
        type: text
        required: true
    captures: object schema (apiName, fields with
      label/type/picklistValues/referenceToInfos, defaultRecordTypeId,
      childRelationships)
    confidence: high
    verified_at_propose: 2026-05-14

  # ── REST SOQL / DML (session_cookie auth) ──────────────────────────
  query_records_session:
    transport: rest
    auth: session_cookie
    method: GET
    endpoint_pattern: "{instance.origin}/services/data/v62.0/query/?q={soql}"
    inputs:
      soql: { type: text, required: true }
    response_shape:
      type: object
      properties:
        records:   { type: array }
        totalSize: { type: integer }
        done:      { type: boolean }

  create_record_session:
    transport: rest
    auth: session_cookie
    method: POST
    endpoint_pattern: "{instance.origin}/services/data/v62.0/sobjects/{object_type}"
    inputs:
      object_type: { type: text, required: true }
      fields:      { type: object, required: true }
    response_shape:
      type: object
      properties:
        id:      { type: text }
        success: { type: boolean }

  update_record_session:
    transport: rest
    auth: session_cookie
    method: PATCH
    endpoint_pattern: "{instance.origin}/services/data/v62.0/sobjects/{object_type}/{record_id}"
    inputs:
      object_type: { type: text, required: true }
      record_id:   { type: text, required: true }
      fields:      { type: object, required: true }
    response_shape:
      type: "null"

  delete_record_session:
    transport: rest
    auth: session_cookie
    method: DELETE
    endpoint_pattern: "{instance.origin}/services/data/v62.0/sobjects/{object_type}/{record_id}"
    inputs:
      object_type: { type: text, required: true }
      record_id:   { type: text, required: true }
    response_shape:
      type: "null"

  # ── Aura list records (used by search_record.session_api) ─────────
  aura_list_records:
    transport: aura
    auth: session_cookie
    domain_condition: "*.lightning.force.com"
    endpoint_pattern: "{instance.origin}/aura?r=1"
    method: POST
    descriptor: aura://ListUiController/ACTION$postListRecordsByName
    extract_path: actions[0].returnValue.records
    inputs:
      objectApiName: { type: text, required: true }
      listViewApiName: { type: text, required: true }
      listRecordsQuery: { type: object, required: true }
    captures: |
      records[] for one listview of one sObject. Each record is
      { id, fields: { <ApiName>: { value, displayValue } } }.
    confidence: high
    notes: |
      Proven working since 2026-04-16 (reference_sf_browser_session_paths.md);
      used live by platform-extractors.ts salesforceLiveSearch. Stateless —
      `callingDescriptor: 'UNKNOWN'` is accepted. The list controller does
      NOT filter by a search term; callers list a listview (AllAccounts,
      AllOpportunities, ...) then filter / summarize client-side. The Aura
      *search* descriptors (SearchController.execute, globalSearch,
      RecordUiController.executeSearch) all return non-success statelessly —
      do not use them.
