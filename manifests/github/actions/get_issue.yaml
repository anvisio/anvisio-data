_meta:
  name: manifests/github/actions/get_issue.yaml
  version: 0.3.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    get_issue atom: fetch one issue by number. Read; mcp > oauth_api.

    No browser flavor: scraping the issue page DOM into a structured
    issue object is much less reliable than hitting REST, and the API
    is available without OAuth on public repos via the user's
    existing GitHub session.
  changelog:
    - "0.3.0 (2026-05-24): adopt schema-typed result.issue per v70 signature parity rule. The flat from_api_response extract populates the Issue whole; owner + repo are contextual identity that comes from input (not the REST response top-level)."
    - "0.2.0 (2026-05-23): drop browser flavor; it returned literal:{}
       which broke any caller that expected an issue object."
    - "0.1.0 (2026-05-23): initial seed."

description: Fetch a single GitHub issue.
object: "{{inputs.repo}}"
object_types: [Issue]
commits_changes: false
depends_on_view: any
mcp_tool: github.issue_read
inputs:
  owner:        { type: text, required: true, sample: anvisio-dev }
  repo:         { type: text, required: true, sample: sample-project }
  issue_number: { type: integer, required: true, sample: 1 }
result:
  issue:
    schema: Issue

flavors:
  mcp:
    requires_auth: mcp_server
    label: Official github-mcp-server issue_read (method=get_issue)
    server: github
    tool: issue_read
    outcomes:
      - action: fetched
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          issue:
            from_api_response: true
            path: ""

  oauth_api:
    requires_auth: oauth_token
    label: REST GET /repos/{owner}/{repo}/issues/{number}
    request:
      method: GET
      url: "https://api.github.com/repos/{{inputs.owner}}/{{inputs.repo}}/issues/{{inputs.issue_number}}"
    outcomes:
      - action: fetched
        signal:
          type: network_response
          url_pattern: "api.github.com/repos/*/issues/*"
          status: 200
        extract:
          issue:
            from_api_response: true
            path: ""
