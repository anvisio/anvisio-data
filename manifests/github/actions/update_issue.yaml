_meta:
  name: manifests/github/actions/update_issue.yaml
  version: 0.3.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    update_issue atom: change an existing issue's title / body /
    state / assignees / labels / milestone. commits_changes:true so
    spec 70 §7 prefers browser; MCP / REST cover headless.

    Browser flavor only wires the close gesture (the most common
    DOM-driven update). Reopen requires the issue to currently be
    closed and uses a different button; title / body / assignees /
    labels edits depend on sidebar-picker widgets that are deferred
    to heal-time authoring. All non-close updates route through
    mcp / oauth_api.
  changelog:
    - "0.3.0 (2026-05-24): adopt schema-typed result.issue per v70 signature parity rule. All three flavors populate the composite (owner, repo, number) PK from input context (the user supplied all three to identify the issue)."
    - "0.2.0 (2026-05-23): drop ternary widget selector + :has-text
       ternary signal (template engine doesn't render either);
       restrict browser flavor to the close path; use a network
       signal on PATCH /issues/{n} so we observe the real write
       instead of a state-badge selector that was already on-page."
    - "0.1.0 (2026-05-23): initial seed."

description: Update a GitHub issue's state, title, or metadata.
object: "{{inputs.repo}}"
object_types: [Issue]
commits_changes: true
depends_on_view: IssueView
mcp_tool: github.issue_write
inputs:
  owner:        { type: text, required: true, sample: anvisio-dev }
  repo:         { type: text, required: true, sample: sample-project }
  issue_number: { type: integer, required: true, sample: 1 }
  state:        { type: text,    required: false, description: "open | closed. Browser flavor only honors 'closed' (close gesture); reopen routes through mcp / oauth_api." }
  title:        { type: text,    required: false }
  body:         { type: text,    required: false }
  assignees:    { type: list<text>, required: false }
  labels:       { type: list<text>, required: false }
  milestone:    { type: integer,    required: false }
result:
  issue:
    schema: Issue

flavors:
  browser:
    requires_auth: session_cookie
    label: Open issue + click Close (user confirms on commit:true)
    recipe:
      - id: nav_issue
        type: navigate
        args:
          url: "https://github.com/{{inputs.owner}}/{{inputs.repo}}/issues/{{inputs.issue_number}}"
      - id: close
        type: use_widget
        args:
          widget: github.close_issue_button
          op: invoke
        commit: true
    outcomes:
      - action: updated
        signal:
          type: network_response
          url_pattern: "github.com/*/*/issues/*"
          status: 200
          timeout_ms: 10000
        extract:
          issue:
            owner:
              from_input: owner
            repo:
              from_input: repo
            number:
              from_input: issue_number

  mcp:
    requires_auth: mcp_server
    label: Official github-mcp-server issue_write (method=update)
    server: github
    tool: issue_write
    outcomes:
      - action: updated
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          issue:
            owner:
              from_input: owner
            repo:
              from_input: repo
            number:
              from_input: issue_number

  oauth_api:
    requires_auth: oauth_token
    label: REST PATCH /repos/{owner}/{repo}/issues/{number}
    request:
      method: PATCH
      url: "https://api.github.com/repos/{{inputs.owner}}/{{inputs.repo}}/issues/{{inputs.issue_number}}"
      body:
        title: "{{inputs.title}}"
        body: "{{inputs.body}}"
        state: "{{inputs.state}}"
        assignees: "{{inputs.assignees}}"
        labels: "{{inputs.labels}}"
        milestone: "{{inputs.milestone}}"
    outcomes:
      - action: updated
        signal:
          type: network_response
          url_pattern: "api.github.com/repos/*/issues/*"
          status: 200
        extract:
          issue:
            owner:
              from_input: owner
            repo:
              from_input: repo
            number:
              from_input: issue_number
