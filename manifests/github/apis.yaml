_meta:
  name: manifests/github/apis.yaml
  version: 0.2.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    GitHub APIs catalog. Three transports:

      - `oauth_api` on api.github.com: the REST v3 + GraphQL v4 surface.
        OAuth-bearer or PAT auth. The most-used path for read +
        structured-write atoms.
      - `mcp` via github/github-mcp-server (remote URL
        https://api.githubcopilot.com/mcp/ or local Docker stdio).
        See _mcp_tools.yaml.
      - `session_api` on github.com: limited to endpoints that
        accept the user's logged-in session cookie. GitHub's web app
        is MPA+Turbo, not SPA, so most writes go through standard
        HTML form posts (the `browser` flavor handles those).

    No `session_api` flavors are wired in atoms yet: the public REST
    is the cleaner default. If we add session_cookie writes later
    they'll target undocumented internal endpoints.
  changelog:
    - "0.2.0 (2026-05-23): add confidence + verified_at + notes on
       every entry (per INTEGRATION_FORMAT.md rev 2026-05-23);
       downgrade two confidence:high claims to low (neither endpoint
       has been live-verified yet)."
    - "0.1.0 (2026-05-23): initial seed. REST CRUD + GraphQL surface
       covering Issues / Pull Requests / Repositories / Actions /
       Users; the daily-driver subset the atom actions reference."

apis:

  # REST (api.github.com, OAuth bearer or PAT)
  rest_get_issue:
    transport: oauth_api
    auth: oauth_token
    method: GET
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/issues/{issue_number}"
    inputs:
      owner:        { type: text, required: true }
      repo:         { type: text, required: true }
      issue_number: { type: integer, required: true }
    response_shape:
      type: object
      properties:
        id:         { type: integer }
        number:     { type: integer }
        title:      { type: string }
        body:       { type: string }
        state:      { type: string }
        assignees:  { type: array }
        labels:     { type: array }
        html_url:   { type: string }
    confidence: low
    verified_at: null
    notes: |
      Returns either an issue OR a PR (PRs are issues server-side).
      PR-only fields appear under `pull_request` when this is a PR.

  rest_list_issues:
    transport: oauth_api
    auth: oauth_token
    method: GET
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/issues?state={state}&per_page={per_page}&page={page}"
    inputs:
      owner:    { type: text, required: true }
      repo:     { type: text, required: true }
      state:    { type: text, required: false, default: open }
      per_page: { type: integer, required: false, default: 30 }
      page:     { type: integer, required: false, default: 1 }
    response_shape:
      type: array
      items: { type: object }
    pagination:
      style: link_header
      next_path: "Link header; rel=next"
    confidence: low
    verified_at: null
    notes: |
      Returns issues + PRs (PRs are issues with a pull_request key).
      Filter client-side or use search_issues for PR-only.

  rest_create_issue:
    transport: oauth_api
    auth: oauth_token
    method: POST
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/issues"
    inputs:
      owner:     { type: text, required: true }
      repo:      { type: text, required: true }
      body:
        type: object
        required: true
        description: "{ title, body, assignees, labels, milestone }"
    response_shape:
      type: object
      properties:
        id:       { type: integer }
        number:   { type: integer }
        html_url: { type: string }
    confidence: low
    verified_at: null
    notes: |
      Requires `issues:write` scope on classic PATs; fine-grained PATs
      need explicit repo-level access. Created issue's `number` is
      assigned server-side and returned in the response.

  rest_update_issue:
    transport: oauth_api
    auth: oauth_token
    method: PATCH
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/issues/{issue_number}"
    inputs:
      owner:        { type: text, required: true }
      repo:         { type: text, required: true }
      issue_number: { type: integer, required: true }
      body:
        type: object
        required: true
        description: "{ title?, body?, state?, assignees?, labels? }"
    response_shape:
      type: object
    confidence: low
    verified_at: null
    notes: |
      Partial update; omitted fields are not changed. `state` accepts
      `open` | `closed`. `assignees` REPLACES the assignee list.

  rest_add_issue_comment:
    transport: oauth_api
    auth: oauth_token
    method: POST
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/issues/{issue_number}/comments"
    inputs:
      owner:        { type: text, required: true }
      repo:         { type: text, required: true }
      issue_number: { type: integer, required: true }
      body:         { type: object, required: true, description: "{ body }" }
    response_shape:
      type: object
      properties:
        id:       { type: integer }
        html_url: { type: string }
        body:     { type: string }
    confidence: low
    verified_at: null
    notes: |
      Comments support GitHub-flavored markdown. The response `id` is
      a numeric comment id (separate from the issue number).

  rest_search_issues:
    transport: oauth_api
    auth: oauth_token
    method: GET
    endpoint_pattern: "https://api.github.com/search/issues?q={q}&per_page={per_page}&page={page}"
    inputs:
      q:        { type: text, required: true, description: "GitHub search syntax e.g. 'repo:owner/repo is:open label:bug'" }
      per_page: { type: integer, required: false, default: 30 }
      page:     { type: integer, required: false, default: 1 }
    response_shape:
      type: object
      properties:
        total_count: { type: integer }
        items:       { type: array }
    confidence: low
    verified_at: null
    notes: |
      Lower rate limit than the regular REST endpoints (30 req/min for
      unauthenticated, higher with token). Use `is:pr` qualifier to
      filter to PRs only.

  rest_get_pull_request:
    transport: oauth_api
    auth: oauth_token
    method: GET
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/pulls/{pull_number}"
    inputs:
      owner:       { type: text, required: true }
      repo:        { type: text, required: true }
      pull_number: { type: integer, required: true }
    response_shape:
      type: object
      properties:
        id:         { type: integer }
        number:     { type: integer }
        title:      { type: string }
        body:       { type: string }
        state:      { type: string }
        head:       { type: object }
        base:       { type: object }
        merged:     { type: boolean }
        mergeable:  { type: boolean }
        html_url:   { type: string }
    confidence: low
    verified_at: null
    notes: |
      `mergeable` may be null while GitHub computes mergeability;
      retry after a short delay if it's null on first read.

  rest_list_pull_requests:
    transport: oauth_api
    auth: oauth_token
    method: GET
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/pulls?state={state}&per_page={per_page}&page={page}"
    inputs:
      owner:    { type: text, required: true }
      repo:     { type: text, required: true }
      state:    { type: text, required: false, default: open }
      per_page: { type: integer, required: false, default: 30 }
      page:     { type: integer, required: false, default: 1 }
    response_shape:
      type: array
      items: { type: object }
    confidence: low
    verified_at: null
    notes: |
      State values: open | closed | all. Use Link header for paging.

  rest_create_pull_request:
    transport: oauth_api
    auth: oauth_token
    method: POST
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/pulls"
    inputs:
      owner: { type: text, required: true }
      repo:  { type: text, required: true }
      body:
        type: object
        required: true
        description: "{ title, head, base, body?, draft? }"
    response_shape:
      type: object
      properties:
        id:       { type: integer }
        number:   { type: integer }
        html_url: { type: string }
    confidence: low
    verified_at: null
    notes: |
      `head` is the source branch (or `owner:branch` for cross-fork).
      `base` is the target. `draft: true` opens a draft PR.

  rest_merge_pull_request:
    transport: oauth_api
    auth: oauth_token
    method: PUT
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}/pulls/{pull_number}/merge"
    inputs:
      owner:       { type: text, required: true }
      repo:        { type: text, required: true }
      pull_number: { type: integer, required: true }
      body:
        type: object
        required: false
        description: "{ commit_title?, commit_message?, merge_method? = merge | squash | rebase }"
    response_shape:
      type: object
      properties:
        sha:    { type: string }
        merged: { type: boolean }
    confidence: low
    verified_at: null
    notes: |
      405 if branch protection or required checks block merge.
      `merge_method` must match the repo's allowed methods.

  rest_get_repository:
    transport: oauth_api
    auth: oauth_token
    method: GET
    endpoint_pattern: "https://api.github.com/repos/{owner}/{repo}"
    inputs:
      owner: { type: text, required: true }
      repo:  { type: text, required: true }
    response_shape:
      type: object
    confidence: low
    verified_at: null
    notes: |
      Returns the full repository metadata (size, license, default
      branch, visibility, parent for forks, etc.).

  # GraphQL v4 (api.github.com/graphql)
  graphql_v4:
    transport: oauth_api
    auth: oauth_token
    method: POST
    endpoint_pattern: "https://api.github.com/graphql"
    inputs:
      query:     { type: text, required: true }
      variables: { type: object, required: false }
    response_shape:
      type: object
      properties:
        data:   { type: object }
        errors: { type: array }
    confidence: low
    verified_at: null
    notes: |
      Use for nested queries (issue + reviews + checks in one call)
      or when REST is missing a field (projects v2 lives only here).
