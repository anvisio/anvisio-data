_meta:
  name: manifests/github/views/IssueList.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    Issue list view (github.com/{owner}/{repo}/issues). Lands the
    user on the open-issues table; supports search via the
    in-page search box.

name: IssueList

entry:
  url: "https://github.com/{owner}/{repo}/issues"
landmark_probe:
  selector: "[aria-label='Issues'], [data-testid='issue-list']"
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: "/issues(\\?|$)"
  - type: selector_appears
    selector: "[aria-label='Issues'], main"
    timeout_ms: 12000
placeholders:
  owner:
    type: text
    sample: anvisio-dev
  repo:
    type: text
    sample: sample-project
widgets:
  - github.global_search_input
  - github.new_button
