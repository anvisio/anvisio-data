_meta:
  name: manifests/github/views/RepositoryView.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    Repository home view (github.com/{owner}/{repo}). The default
    anchor for any repo-scoped action that needs the user to land
    somewhere first.

name: RepositoryView

entry:
  url: "https://github.com/{owner}/{repo}"
landmark_probe:
  selector: "[data-pjax-container='#js-repo-pjax-container'], main"
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: "^https://github\\.com/[^/]+/[^/]+/?$"
  - type: selector_appears
    selector: "main"
    timeout_ms: 12000
placeholders:
  owner:
    type: text
    sample: anvisio-dev
  repo:
    type: text
    sample: sample-project
widgets:
  - github.global_search_input
  - github.new_button
  - github.repo_card_link
