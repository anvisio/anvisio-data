document:
  dsl: '1.0.0'
  namespace: google-calendar
  name: update-event-tester
  version: '1.0.0'
  title: Google Calendar update_event tester (self-discover + nav-to-day, preview)
  summary: |
    Self-discovers events in a window via list_events (gapi), then for each
    drives update_event in PREVIEW (commit:false): the EventDetail entry
    navigates the grid to the event's day (occurrence_date) so its chip
    renders even if it's off the currently-shown range (gotcha #2), opens the
    editor via the edit pencil, fills a changed Title, and STOPS at Save for
    you to review. Reaches the event reliably regardless of which week is
    displayed.

    To exercise the RECURRING scope dialog (resolve_recurring_scope): point
    this at a recurring event, set `commit: true`, and add
    `recurring_scope: single|following|all` under `with:`. Preview mode skips
    Save, so the scope dialog never appears.

    NOTE: operates on EVERY event in the window (preview = non-destructive) —
    narrow time_min/time_max to limit it.
    Drive via: /run-blueprint google-calendar update_event_tester

    SPEC 72 DISCARD TEST (the regression guard — run BOTH paths):
      - HAPPY PATH: at the Save stop, click Save -> expect action=updated
        (the "Event saved" toaster fires the composite L4).
      - DISCARD PATH: at the Save stop, DISCARD instead (Escape / "Cancel";
        do NOT Save) -> expect action=discarded / not-committed (v71: `discarded`
        = when:[editor_closed] not:[saved]). The OLD bare selector_disappears
        title false-reported `updated` on discard (Trap 2).
do:
  - find:
      label: Find events in a window to update
      call: google-calendar.atom.list_events
      with:
        time_min: '2026-05-28T00:00:00-07:00'
        time_max: '2026-05-30T00:00:00-07:00'
  - update_each:
      for:
        each: ev
        in: '${ .find.events }'
        item_label: '${ $ev.summary }'
      do:
        - update:
            label: 'Nav to the day, open editor, fill (you click Save)'
            call: google-calendar.atom.update_event
            commit: false
            with:
              event_id: '${ $ev.id }'
              occurrence_date: '${ $ev.start.dateTime }'
              Title: 'Anvisio update smoke (edited)'
