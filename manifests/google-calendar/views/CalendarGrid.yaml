name: CalendarGrid
description: >
  The primary Google Calendar surface — the day/week/month grid at
  calendar.google.com/calendar/u/0/r. Launchpad for compose (the Create
  button) and search (the Search button), and the operating surface for
  list_events. Event chips on the grid open the EventDetail popup.
entry:
  url: https://calendar.google.com/calendar/u/0/r/week
url_patterns:
  - https://calendar\.google\.com/calendar/u/\d+/r/(day|week|month|year|agenda|schedule|customday|customweek)
  - https://calendar\.google\.com/calendar/u/\d+/r$
  - https://calendar\.google\.com/calendar/
identifying_selectors:
  - "[role='grid']"
  - "[role='main'] [role='grid']"
widgets:
  - google-calendar.create_button
  - google-calendar.search_button
  - google-calendar.search_input
  - google-calendar.event_chip
