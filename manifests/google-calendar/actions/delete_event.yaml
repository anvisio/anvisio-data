_meta:
  name: manifests/google-calendar/actions/delete_event.yaml
  version: 0.7.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-28
  description: |
    delete_event atom: delete an event. The browser flavor reaches the
    event via EventDetail and, on commit, clicks the trash button; the
    oauth_api + mcp flavors delete the event directly. commits_changes:true,
    so transport priority is browser > oauth_api > mcp per spec 70 §7: the
    user sees the event removed from their own calendar.
  changelog:
    - "0.7.0 (2026-05-29): spec 72 R1 — add browser `abandon_signal` (selector_disappears [role='dialog']) so closing the EventDetail popup without the 'Event deleted' toast resolves as cancelled via the runner's grace-arbitrated race (same selector as the deleted-composite rung 2; grace disambiguates)."
    - "0.6.0 (2026-05-28): spec 72 — browser `deleted` L4 is now the consequence ladder, replacing the bare `selector_disappears [role='dialog']` (Trap 2: the popup closes on Escape/click-away too). LIVE-PROBED the toast: 'Event deleted' in a goog-lr-* [aria-live='polite'] announcer. New signal: all:[transient_appears 'Event deleted', selector_disappears dialog]. Closing the popup without deleting now correctly reports not-committed."
    - "0.5.0 (2026-05-28): add occurrence_date input — the EventDetail entry navigates the grid to that day before clicking the chip, so delete reaches an event off the currently-shown range (gotcha #2). For a recurring event pass the instance's date."
    - "0.4.0 (2026-05-28): browser scope-dialog handling — a commit-only resolve_recurring_scope step after trash drives the 'Delete recurring event' radio (single → This event, all → All events; first instance has no 'following'), no-op on single events. In preview mode the user picks the scope. MCP/oauth still resolve scope by the event_id passed."
    - "0.3.0 (2026-05-28): add recurring_scope input (single/following/all) for the browser 'Delete recurring event' scope dialog. MCP/oauth delete-event have no scope param — they delete whatever event_id is passed (instance vs master), so scope is resolved by id upstream there. Browser scope-dialog handling is a follow-up."
    - "0.2.0 (2026-05-24): add schema-typed result.event per v70 signature parity rule. All flavors echo event.Id from the event_id input."
    - "0.1.0 (2026-05-22): initial hand-authored manifest (spec 70). mcp_tool google-calendar.delete-event."

description: >
  Delete a calendar event. The browser flavor opens the event detail popup
  and, on commit, clicks the trash button; preview mode reaches the popup
  and stops so the user can confirm the deletion themselves. The oauth_api
  and mcp flavors delete the event in one call.
object: Event
commits_changes: true
depends_on_view: EventDetail
mcp_tool: google-calendar.delete-event
inputs:
  event_id:
    type: text
    required: true
    description: Google Calendar event id to delete.
  calendar_id:
    type: text
    description: Calendar id the event belongs to. Defaults to the primary calendar.
  occurrence_date:
    type: text
    description: |
      Optional ISO date (e.g. "2026-06-15") of the event's occurrence. When
      set, the browser flavor first navigates the grid to that day so the
      event's chip renders even if it's off the currently-shown range
      (gotcha #2). For a RECURRING event pass the INSTANCE's date. Omit when
      the event is already on the visible grid; ignored by oauth_api / mcp.
  recurring_scope:
    type: text
    description: |
      For a RECURRING event only: `single` (this instance, default),
      `following` (this + later), or `all` (the whole series). The browser
      flavor maps it to the "Delete recurring event" scope-dialog radio
      (single → "This event", all → "All events"; the first instance has no
      "following" option). The MCP/oauth flavors have no scope param — they
      delete whatever event_id you pass (an instance id vs the master id),
      so resolve scope by id upstream for those flavors. Ignored for
      non-recurring events.
result:
  deleted: boolean
  event:
    schema: Event
flavors:
  browser:
    requires_auth: session_cookie
    label: Click the trash button in the event popup when commit:true
    # Spec 72 R1: delete operates on the EventDetail [role='dialog'] popup
    # (no URL nav), so a discard = the user closing that popup (Escape /
    # click-away) without the "Event deleted" toast. Same selector as the
    # `deleted` composite's rung 2 — the grace window disambiguates: toast in
    # grace -> deleted, else -> cancelled.
    abandon_signal:
      type: selector_disappears
      selector: "[role='dialog']"
    recipe:
      - id: delete
        type: use_widget
        commit: true
        args:
          widget: google-calendar.event_delete_button
          op: invoke
      # Recurring instances pop a "Delete recurring event" scope dialog on
      # trash (commit mode only). Best-effort: no-ops on single events. In
      # preview mode (trash skipped) the user picks the scope themselves.
      - id: scope
        type: resolve_recurring_scope
        commit: true
        args:
          scope: "{{inputs.recurring_scope}}"
          dialog: "[role='dialog']"
          option_target:
            - "[role='dialog'] label"
            - "[role='dialog'] [role='radio']"
          option_label:
            single: "This event"
            following: "This and following"
            all: "All events"
          confirm_button: "[role='dialog'] button"
          confirm_label: "OK"
    outcomes:
      - action: ready_to_delete
        signal:
          type: selector_appears
          selector: "[role='dialog'] button[aria-label*='Delete']"
      # Spec 72 L4 consequence ladder. Rung 1 (positive): the success
      # toaster — live-probed 2026-05-28 as "Event deleted" in a goog-lr-*
      # [aria-live='polite'] announcer (NOT [role='alert']). Rung 2
      # (corroborating): the EventDetail [role='dialog'] popup disappears.
      # all: so closing the popup WITHOUT deleting (Escape / click-away —
      # the discard path) reports NOT committed (no toaster), where the bare
      # dialog-disappears was a Trap 2 fake-success.
      # No per-rung timeout_ms — inherit the caller budget (30s commit /
      # 10min HITL). An explicit timeout_ms caps the HITL wait (caught live
      # 2026-05-29 on create_event).
      - action: deleted
        signal:
          all:
            - type: transient_appears
              selector: "[aria-live='polite']"
              must_contain_text: "Event deleted"
            - type: selector_disappears
              selector: "[role='dialog']"
        extract:
          deleted:
            literal: true
          event:
            Id:
              from_input: event_id
  oauth_api:
    requires_auth: oauth_token
    label: Delete the event via the Calendar API (events.delete)
    request:
      provider: google
      method: DELETE
      url: https://www.googleapis.com/calendar/v3/calendars/{{inputs.calendar_id}}/events/{{inputs.event_id}}
    outcomes:
      - action: deleted
        extract:
          deleted:
            literal: true
          event:
            Id:
              from_input: event_id
  mcp:
    requires_auth: mcp_server
    label: Delete the event via the google-calendar delete-event MCP tool
    server: google-calendar
    tool: delete-event
    inputs_map:
      eventId: "{{inputs.event_id}}"
      calendarId: "{{inputs.calendar_id}}"
    outcomes:
      - action: deleted
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          deleted:
            literal: true
          event:
            Id:
              from_input: event_id
