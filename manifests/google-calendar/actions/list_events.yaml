_meta:
  name: manifests/google-calendar/actions/list_events.yaml
  version: 0.4.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-22
  description: |
    list_events atom: list events on a calendar within a time window.
    Read-only. The session_api flavor calls `gapi.client.calendar.events.list`
    from the Calendar tab's MAIN world (session-based, no OAuth: see
    reference_google_workspace_api_paths). The browser flavor navigates to
    the grid as a slow visible fallback; the mcp flavor uses the
    google-calendar MCP server. Reads prefer session_api > mcp > browser
    per spec 70 §7.
  changelog:
    - "0.4.0 (2026-06-08): CANONICAL ACTION FORM v71 (live-hardened with cd2k). result.outcome (auto from the winning action, 'listed') replaces the `listed` boolean; every flavor's `listed: literal:true` extract is dropped (the runtime injects outcome from the winning action via withOutcomeField). The browser flavor resolves via a named signals: map + when:[listed] (selector_appears [role='grid'] — live-confirmed 2 grid roles render). session_api + mcp KEEP their inline signal: a gapi/MCP call completes inside the recipe, so the outcome still needs a signal to gate 'extract ready' (a session_api flavor with no signal times out — verified 2026-06-08). calendar_id default-to-primary is handled at the runtime (platform-api.ts: empty calendarId → 'primary' for events.* methods), so the recipe needs no default. Behaviour-preserving."
    - "0.3.0 (2026-05-24): add schema-typed result.events list<Event> per v70 signature parity rule. session_api and mcp populate from the API response; browser nullable (grid DOM rows are visual, not structured). Drop result.count which no flavor populated (callers can use events.length)."
    - "0.2.0 (2026-05-22): oauth_api to session_api with call_platform_api kind:gapi."
    - "0.1.0 (2026-05-22): initial hand-authored manifest (spec 70). mcp_tool google-calendar.list-events."

description: >
  List the events on a calendar between time_min and time_max. The browser
  flavor lands the tab on the calendar grid (event data is then read per
  chip via get_event); the oauth_api and mcp flavors return the full event
  list as structured data.
object: Event
commits_changes: false
depends_on_view: CalendarGrid
mcp_tool: google-calendar.list-events
inputs:
  time_min:
    type: text
    required: true
    description: Window start, ISO 8601 (e.g. 2026-06-01T00:00:00-07:00).
  time_max:
    type: text
    required: true
    description: Window end, ISO 8601.
  calendar_id:
    type: text
    description: Calendar id. Defaults to the primary calendar (the runtime substitutes an empty calendarId with 'primary'). The browser flavor ignores it (it shows the default grid).
result:
  # v71: outcome = the winning action ("listed"), auto-populated by the runtime.
  outcome: text
  events:
    schema: Event
    cardinality: list
    nullable: true
flavors:
  browser:
    requires_auth: session_cookie
    label: Navigate to the calendar grid
    # v71 signals model: `listed` = the calendar grid rendered.
    signals:
      listed:
        type: selector_appears
        selector: "[role='grid']"
    recipe:
      - id: goto_grid
        type: navigate
        args:
          url: https://calendar.google.com/calendar/u/0/r/week
      - id: wait_grid
        type: wait_for_element
        args:
          selector: "[role='grid']"
          timeout_ms: 10000
    outcomes:
      - action: listed
        when: [listed]
        extract:
          events:
            literal: null
  session_api:
    requires_auth: session_cookie
    label: List events via gapi.client.calendar.events.list (MAIN-world session)
    recipe:
      - id: gapi_list
        type: call_platform_api
        args:
          api_def:
            kind: gapi
            library: calendar
            version: v3
            method_path: events.list
            # platform-api wraps the gapi response as { status, result };
            # navigate into result to pull the items array directly so the
            # step value is the array (the blueprint iterates it).
            extract_path: result.items
          args:
            calendarId: "{{inputs.calendar_id}}"
            timeMin: "{{inputs.time_min}}"
            timeMax: "{{inputs.time_max}}"
            singleEvents: true
            orderBy: startTime
    outcomes:
      - action: listed
        # The gapi call runs entirely inside the recipe's call_platform_api
        # step: no post-recipe DOM/URL transition, so network_response would
        # start watching after the fetch completed and time out. url_matches
        # on calendar.google.com resolves on the first poll; `extract` then
        # reads the step result (already extracted to the items array via
        # api_def.extract_path). The signal is REQUIRED — a session_api
        # outcome with no signal never resolves (v71 live-verified 2026-06-08).
        signal:
          type: url_matches
          pattern: "calendar\\.google\\.com"
          timeout_ms: 10000
        extract:
          events:
            from_step: gapi_list
  mcp:
    requires_auth: mcp_server
    label: List events via the google-calendar list-events MCP tool
    server: google-calendar
    tool: list-events
    inputs_map:
      calendars: ["{{inputs.calendar_id}}"]
      timeMin: "{{inputs.time_min}}"
      timeMax: "{{inputs.time_max}}"
    outcomes:
      - action: listed
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          events:
            from_api_response: ".events"
