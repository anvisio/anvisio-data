_meta:
  name: manifests/gmail/workflows/send_smoke.yaml
  version: 0.1.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    Single-step smoke: open the ComposePanel and FILL To/Subject/Body
    with throwaway values, then verify the Subject input reflects the
    typed value (ready_to_send outcome). DOES NOT click Send — uses the
    `dom_no_submit` flavor of send_email so the user retains control
    over whether to actually transmit. Validates the full
    EXECUTE_V60_VERB → enterView → fill_fields → outcome-watch path
    without any irreversible side effect.

name: send_smoke
description: |
  End-to-end smoke for the gmail send_email action (dom_no_submit flavor).
  Run via /demo-workflow gmail send_smoke. Mirrors a real compose
  flow up to the Send click, then stops. The user can click Send
  themselves to actually transmit, or close the compose dialog to discard.
steps:
  - id: fill_compose
    action: send_email
    flavor: dom_no_submit
    inputs:
      fields:
        To:
          - test@anvisio.com
        Subject: "Anvisio Smoke Test (do not send)"
        Body: |
          This compose dialog was filled by the gmail send_smoke
          workflow. You can click Send if you want, but the smoke
          test stops here — no side effects committed.
    expected_outcome: ready_to_send
