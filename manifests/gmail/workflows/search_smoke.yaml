_meta:
  name: manifests/gmail/workflows/search_smoke.yaml
  version: 0.1.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    Single-step smoke: search for 'anvisio' via Gmail's global search bar
    and verify the URL transitions to #search/anvisio. Non-destructive
    (commits_changes: false on search_email). Validates the EXECUTE_V60_VERB
    handler + workflow runner against live Gmail without mutating state.

name: search_smoke
description: |
  End-to-end smoke for the gmail search_email action. Run via
  /demo-workflow gmail search_smoke. depends_on_view: any, so works from
  Inbox / Sent / Drafts / wherever the user happens to land. Mirrors the
  outlook search_smoke pattern.
steps:
  - id: search_for_anvisio
    action: search_email
    flavor: dom_submit
    inputs:
      query: anvisio
    expected_outcome: searched
