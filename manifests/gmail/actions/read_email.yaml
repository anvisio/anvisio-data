_meta:
  name: manifests/gmail/actions/read_email.yaml
  version: 0.1.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-10
  description: |
    read_email action — return Subject/From/Body of the open thread.
    Read-only; both dom_no_submit and dom_submit flavors are
    end-to-end-safe to validate. Phase 6 validated dom_no_submit.
  changelog:
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest"

description: >
  Read the currently open thread, returning subject, from, and body of the
  latest message. Assumes the wizard has already opened the thread (clicked the
  row from Inbox/SearchResults/LabelView). Read is non-committing — there's no
  submit step — so dom_submit is the only meaningful flavor; dom_no_submit emits
  ready_to_read once the thread renders, then read once content is captured.
object: Thread
commits_changes: false
depends_on_view: ThreadView
inputs: {}
result:
  Subject: text
  From: email
  Body: rich_text
flavors:
  dom_no_submit:
    requires_auth: session_cookie
    label: Read open thread (review then confirm)
    recipe:
      - id: read_thread
        type: read_fields
        args:
          object: Thread
          only:
            - Subject
            - From
            - Body
    outcomes:
      - action: ready_to_read
        signal:
          type: selector_appears
          selector: h2.hP
      - action: read
        signal:
          type: selector_appears
          selector: div[role='main'] div.a3s
        extract:
          Subject:
            from_step: read_thread
            path: fields.Subject
          From:
            from_step: read_thread
            path: fields.From
          Body:
            from_step: read_thread
            path: fields.Body
  dom_submit:
    requires_auth: session_cookie
    label: Read open thread
    recipe:
      - id: read_thread
        type: read_fields
        args:
          object: Thread
          only:
            - Subject
            - From
            - Body
    outcomes:
      - action: read
        signal:
          type: selector_appears
          selector: h2.hP
        extract:
          Subject:
            from_step: read_thread
            path: fields.Subject
          From:
            from_step: read_thread
            path: fields.From
          Body:
            from_step: read_thread
            path: fields.Body
