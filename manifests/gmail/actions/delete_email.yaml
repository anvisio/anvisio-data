_meta:
  name: manifests/gmail/actions/delete_email.yaml
  version: 0.1.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-10
  description: |
    delete_email action — move a specific thread to Trash from a list
    view. Recipe: select row → click toolbar Delete. Irreversible side
    effect (recoverable from Trash within 30 days).
  changelog:
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest"

description: >
  Move a specific thread to Trash from a list view. Selects the row by thread_id
  and clicks the toolbar Delete button.
object: Thread
commits_changes: true
depends_on_view: Inbox
inputs:
  thread_id:
    type: text
    required: true
    description: data-legacy-thread-id of the row to delete
result:
  deleted: boolean
flavors:
  dom_submit:
    requires_auth: session_cookie
    label: Select row + click Delete
    recipe:
      - id: select_row
        type: use_widget
        args:
          widget: gmail.row_checkbox
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
      - id: click_delete
        type: use_widget
        args:
          widget: gmail.toolbar_delete_button
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
    outcomes:
      - action: deleted
        signal:
          type: selector_disappears
          selector: tr.zA:has(span[data-legacy-thread-id='{{inputs.thread_id}}'])
        extract:
          deleted:
            literal: true
