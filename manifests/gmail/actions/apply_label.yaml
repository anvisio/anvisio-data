_meta:
  name: manifests/gmail/actions/apply_label.yaml
  version: 0.1.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-10
  description: |
    apply_label action — apply a Gmail label to a specific thread from a
    list view. Recipe: select row → open Labels menu → type label →
    pick match. Requires thread_id + label inputs (state-dependent;
    Phase 8 will wire fixture-driven testing).
  changelog:
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest. toolbar_labels_button widget reverted to atomic click after heal-overreach incident (see project_phase5_slice1_shipped.md)"

description: >
  Apply a Gmail label to a specific thread from a list view. Selects the row,
  opens the Labels menu, types the label name into the menu's typeahead, and
  picks the matching item.
object: Thread
commits_changes: true
depends_on_view: Inbox
inputs:
  thread_id:
    type: text
    required: true
  label:
    type: text
    required: true
result:
  applied: boolean
flavors:
  dom_submit:
    requires_auth: session_cookie
    label: Select row + Labels menu + pick label
    recipe:
      - id: select_row
        type: use_widget
        args:
          widget: gmail.row_checkbox
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
      - id: open_labels_menu
        type: use_widget
        args:
          widget: gmail.toolbar_labels_button
          op: invoke
      - id: pick_label
        type: use_widget
        args:
          widget: gmail.label_menu_search
          op: fill
          inputs:
            value: "{{inputs.label}}"
    outcomes:
      - action: applied
        signal:
          type: selector_appears
          selector: div.b8.UC div.vh
        extract:
          applied:
            literal: true
