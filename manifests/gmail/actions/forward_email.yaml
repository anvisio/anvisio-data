_meta:
  name: manifests/gmail/actions/forward_email.yaml
  version: 0.14.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-26
  description: |
    forward_email atom: forward the currently open thread. Spec 70:
    `browser` flavor fills the inline forward composer (To + Body)
    and clicks Send; `mcp` flavor calls gmail.send_email with the
    quoted-body text in the body field.

    Composer-trigger ownership note (2026-05-26): same fix shape as
    reply_email 0.8.0 / reply_all_email 0.8.0. Previously this atom
    chained through ReplyComposer.yaml's entry recipe which
    hardcoded Reply (`.ams.bkH`); the atom then tried to fill
    forward-specific fields (To) into a Reply composer where To is
    already pre-populated and read-only. Silently broken. The atom
    now depends_on_view: ThreadView + opens the forward composer via
    `gmail.thread_forward_button` (`.ams.bkG` text-link at message
    bottom).

    Browser-flavor message-id limitation (2026-05-26): unlike
    reply / reply_all (which land in the same thread), a forward
    creates a NEW thread for the recipient. Gmail keeps the user on
    the SOURCE thread after the forward; the snackbar shows ONLY
    "Undo" (no "View message" link), and the visible h2.hP[data-
    legacy-thread-id] still points at the SOURCE thread — NOT at the
    forwarded message's destination thread. The browser flavor
    therefore cannot read the destination thread's id from the DOM
    and stubs `result.message = null`. Callers needing the
    destination's message_id / thread_id should dispatch via the
    `mcp` or `oauth_api` flavor (both return the id from the API
    response).
  changelog:
    - "0.14.0 (2026-06-08): CANONICAL ACTION FORM v71 (mirrors send_email + reply_email 0.15.0). (1) tab_mode: current replaces runs_in_home_tab: true (resolveTabPlan maps current to wantsOwnTab:false, exactly what the boolean gave). (2) flat typed inputs (To/Cc/Subject/Body; To+Body required) replace the fields:{type:object} bag; the recipe's fill_fields has NO `from`, mcp/oauth map the scalars. (3) result.outcome (auto from the winning action: sent | discarded | drafted) replaces the three booleans; the per-terminal literal extracts are dropped across all flavors. The browser still returns null destination ids (a forward creates a NEW thread; Gmail keeps the user on the SOURCE thread) so the browser `sent` outcome has no extract; mcp/oauth populate message.{Id,ThreadId}. (4) the ready_to_forward pseudo-outcome is dropped. No live-behavior change vs 0.13.0 (same signals/selectors/grace)."
    - "0.13.0 (2026-06-07): slim outcome extracts to only the values the outcome produces — drop the cross-terminal literal:false + irrelevant literal:null. The result: schema still declares the full type contract; summarizeTaskOutput reads only truthy flags so the feed display is unchanged, and no consumer does a strict ===false (verified). cd2k's contract-is-what-is-returned principle."
    - "0.12.0 (2026-06-07): FIX the `closed` signal (selector_disappears) — was `input[name='subjectbox']`, which fired immediately because the inline composer's subjectbox is collapsed to 0px → `drafted` resolved instantly + the HITL wait vanished before the user could act. Now the composer REGION `div[role='main'] div[role='region'][data-compose-id]`. Same root cause + fix as reply_email 0.12.0 (caught on the 2026-06-07 re-drive)."
    - "0.11.0 (2026-06-07): add `runs_in_home_tab: true` — same regression fix as reply_email 0.11.0 (caught on the 2026-06-07 re-drive). As a write with no runs_in_home_tab, forward hit the wantsOwnTab gate and opened a BLANK own edit tab; ThreadView's 0.7.0 current-view row-click (no nav, pairing with read_email's cloned fresh tab) found no list there → await_row 15s timeout. Now runs in the home tab, which holds the thread's list. NOTE: forward also needs a To recipient (forward_email_tester supplies it); unlike reply, forward does NOT auto-populate To. See reply_email 0.11.0 + gmail.md `runs_in_home_tab` matrix."
    - "0.10.0 (2026-06-07): SPEC 70 SIGNALS MODEL — three terminals (sent / discarded / drafted) as `when:` / `not:` predicates over a named `signals:` map (sent / discarded / closed), matching send_email 0.13.0 + reply_email 0.10.0. Forward shares the inline composer (verified live 2026-06-07: the `.ams.bkG` Forward trigger opens the same `div[role='region'][data-compose-id]` with a visible `subjectbox` = `Fwd: …`), so the same signals + drafted/discarded terminals apply. Forward-specific: a forward creates a NEW thread and Gmail keeps the user on the SOURCE thread, so the browser flavor still cannot read the destination ids — `sent` keeps message.{Id,ThreadId} null (mcp/oauth return them); NO `then:` hook (no #link_vsm). NO `autosave` signal (no ?compose= flip → drafted draft_id:null). Fixes the discarded/closed-forward HITL hang. Adds discarded / drafted / draft_id for parity."
    - "0.9.7 (2026-05-30): `sent` outcome signal upgraded from `selector_appears` to `transient_appears` on the snackbar — MutationObserver latch survives auto-dismiss + is pre-armed for spec-72 commit-delta detection. See reply_email 0.9.8 / send_email 0.9.0."
    - "0.9.6 (2026-05-26): move snackbar wait into the `sent` outcome's signal — same HITL probe-mask fix as reply_email 0.9.6."
    - "0.9.5 (2026-05-26): drop click_view_message + wait_thread_view steps. Gmail's forward snackbar has no link_vsm (live-verified). Browser flavor cannot read the destination thread's id from the source-thread DOM, so result.message is now stubbed null at the outcome level (was set to source-thread id by 0.9.4, which was WRONG). Callers needing the message id should use the mcp or oauth_api flavor. Other browser-flavor result fields (sent: true) remain accurate."
    - "0.9.4 (2026-05-26): recover message.{Id,ThreadId} via auto-click View message + ThreadView extract — see send_email 0.8.4. (Superseded by 0.9.5: forward's snackbar has no link_vsm AND the source-thread h2.hP is not the forward's destination.)"
    - "0.9.3 (2026-05-26): switch sent outcome to DOM signal on the 'Message sent' snackbar — see send_email 0.8.3."
    - "0.9.2 (2026-05-26): fix url_pattern + method split — see send_email 0.8.2."
    - "0.9.1 (2026-05-26): fix browser-flavor `sent` outcome — `pattern:` renamed to `url_pattern:`. See send_email 0.8.1 for the discovery + scope."
    - "0.9.0 (2026-05-26): populate result.message.{Id, ThreadId} from sync response via from_api_response_recursive (closes the A4 follow-up). Pattern matches send_email 0.8.0."
    - "0.8.0 (2026-05-26): own the composer trigger. depends_on_view changed from ReplyComposer to ThreadView; recipe gains `open_composer` (use_widget gmail.thread_forward_button) + `wait_composer` at the front. Fixes the broken cross-atom interference where ReplyComposer's entry recipe forced Reply. See [[project-gmail-browser-flavor-audit-2026-05-25]] Finding 2."
    - "0.7.0 (2026-05-25): add oauth_api flavor — same shape as send_email 0.7.0 (no threadId since forward creates a new thread). Caller supplies the new To + Subject (often 'Fwd: <original>') + quoted body."
    - "0.6.0 (2026-05-25): mcp flavor: add inputs_map (same A1 fix as send_email + reply_email + reply_all_email 0.6.0). For forward, caller supplies new To list + Subject (often 'Fwd: <original>') + the quoted body."
    - "0.5.0 (2026-05-25): fix DEAD `sent` outcome network signal — modern Gmail uses `POST /mail/.*sync/u/\\d+/i/s`, not the legacy `/mail/u/0/.*sendmail`. Same fix as send_email + reply_email + reply_all_email 0.5.0."
    - "0.4.0 (2026-05-24): add schema-typed result.message (nullable) per v70 signature parity rule. mcp extracts message.Id + message.ThreadId from send_email response; browser stubs literal:null (sendmail XHR response parsing deferred)."
    - "0.3.0 (2026-05-19): spec 70 shape: `dom` to `browser`, drop emits_when, add mcp_tool + mcp flavor."
    - "0.2.0 (2026-05-16): collapse dom_no_submit + dom_submit into single `dom` flavor."
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest."

description: >
  Forward the currently open thread to new recipients. Browser flavor fills the
  inline forward composer + clicks Send. MCP flavor calls gmail.send_email —
  caller supplies the new To list and the body (typically by reading the
  original via read_email first and prepending a forward header).
object: Reply
commits_changes: true
# v71 tab_mode (was runs_in_home_tab: true). current = act in place: the
# in-thread inline composer runs in the HOME tab (which holds the thread's list)
# so ThreadView's current-view row-click (0.7.0+, no nav) can open the thread.
# resolveTabPlan maps current to wantsOwnTab:false, exactly what the boolean
# gave. See reply_email 0.11.0.
tab_mode: current
depends_on_view: ThreadView
mcp_tool: gmail.send_email
inputs:
  # v71 flat typed scalars (was fields: {type: object}). fill_fields assembles the
  # Reply with NO `from`; mcp/oauth map the scalars. Unlike reply, forward needs an
  # explicit To (Gmail does NOT auto-fill it); Subject typically "Fwd: <original>".
  To: { type: text, required: true }
  Cc: { type: text, required: false }
  Subject: { type: text, required: false }
  Body: { type: rich_text, required: true }
result:
  # v71: outcome = the winning terminal's action (sent | discarded | drafted),
  # auto-populated by the runtime (replaces the three booleans). draft_id always
  # null on browser (the inline forward composer exposes no reopenable ?compose=
  # handle). NO flat message_id/thread_id: a forward creates a NEW thread and
  # Gmail keeps the user on the SOURCE thread, so the browser flavor cannot read
  # the destination ids; only mcp/oauth populate message.{Id,ThreadId}.
  outcome: text
  draft_id: text
  message:
    schema: Message
    nullable: true
flavors:
  browser:
    requires_auth: session_cookie
    label: Open Forward composer; fill To+Body; click Send when commit:true
    # Spec 70 SIGNALS MODEL (see reply_email 0.10.0) — same inline composer
    # (verified live: the Forward trigger opens the same surface with a visible
    # `Fwd: …` subjectbox). NO `autosave` (no ?compose= flip). `drafted` =
    # when:[closed] not:[sent,discarded]. Fixes the discarded/closed-forward
    # HITL hang.
    signals:
      sent:
        type: transient_appears
        selector: "div[role='alert']"
        must_contain_text: "Message sent"
      discarded:
        type: transient_appears
        selector: "div[role='alert']"
        must_contain_text: "Draft discarded"
      closed:
        type: selector_disappears
        # Inline composer subjectbox is collapsed to 0px → selector_disappears
        # fired immediately on open. Use the composer REGION instead. See
        # reply_email 0.12.0. (Forward's subjectbox shows "Fwd: …" but is in
        # the same inline region; the region is the reliable closed-signal.)
        selector: "div[role='main'] div[role='region'][data-compose-id]"
    recipe:
      # Open the inline Forward composer. Widget primary is the
      # `.ams.bkG` text-link at message bottom (no icon-button
      # equivalent for Forward — unlike Reply which has both).
      - id: open_composer
        type: use_widget
        args:
          widget: gmail.thread_forward_button
          op: invoke
      - id: wait_composer
        type: wait_for_element
        args:
          selector: "div[role='region'][data-compose-id] div[role='textbox'][aria-label*='Message Body']"
          timeout_ms: 6000
      - id: fill
        type: fill_fields
        args:
          # v71: no `from` → fill the Reply from the action's flat inputs.
          object: Reply
      - id: send
        type: use_widget
        commit: true
        args:
          widget: gmail.reply_send_button
          op: invoke
      # Post-send moved INTO the `sent` outcome's signal (0.9.6 fix).
      # See reply_email 0.9.6 for the HITL probe-mask rationale.
    outcomes:
      # v71: the ready_to_forward pseudo-outcome is DROPPED — outcomes are the
      # terminals the LLM consumes; the filled-and-ready state is the recipe + the
      # HITL pause (the runtime needs no inline ready signal to mask).
      - action: sent
        # Resolves when the `sent` toast fires (BOTH modes — pre-armed latch).
        # No then: hook (no #link_vsm). A forward lands in a NEW thread and Gmail
        # keeps the user on the SOURCE thread, so the browser flavor cannot read
        # the destination ids — message.{Id,ThreadId} stay null (mcp/oauth return
        # them).
        # v71: no extract — the browser flavor returns null destination ids
        # (result.outcome names the terminal; mcp/oauth carry the message ids).
        when: [sent]
      - action: discarded
        # The `discarded` toast ("Draft discarded.") fired — a POSITIVE terminal.
        # v71: no literal extract.
        when: [discarded]
      - action: drafted
        # The forward composer CLOSED with neither toast — the autosaved draft
        # persists. The `not:` guard holds a grace window so a real send/discard
        # wins. HITL-only. draft_id null (no reopenable handle). v71: no literal.
        when: [closed]
        not: [sent, discarded]
  mcp:
    requires_auth: mcp_server
    label: Forward via gmail.send_email MCP tool
    server: gmail
    tool: send_email
    inputs_map:
      to: "{{inputs.To}}"
      subject: "{{inputs.Subject}}"
      body: "{{inputs.Body}}"
      mimeType: "text/html"
    outcomes:
      - action: sent
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          message:
            Id:
              from_api_response: ".message_id"
            ThreadId:
              from_api_response: ".thread_id"
  oauth_api:
    requires_auth: oauth_token
    label: Forward via Gmail REST users.messages.send (new thread; no threadId)
    request:
      provider: google
      method: POST
      url: https://gmail.googleapis.com/gmail/v1/users/me/messages/send
      body:
        raw:
          rfc822:
            to: "{{inputs.To}}"
            cc: "{{inputs.Cc}}"
            subject: "{{inputs.Subject}}"
            htmlBody: "{{inputs.Body}}"
    outcomes:
      - action: sent
        extract:
          message:
            Id:
              from_api_response: true
              path: id
            ThreadId:
              from_api_response: true
              path: threadId
