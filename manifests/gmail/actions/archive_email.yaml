_meta:
  name: manifests/gmail/actions/archive_email.yaml
  version: 0.1.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-10
  description: |
    archive_email action — archive a specific thread from a list view.
    Recipe: select row → click toolbar Archive button. Irreversible
    side effect.
  changelog:
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest"

description: >
  Archive a specific thread from a list view (Inbox / SearchResults /
  LabelView). The action selects the row by thread_id and clicks the toolbar
  Archive button. Wizard ensures we're on a list view; thread_id identifies the
  row to act on.
object: Thread
commits_changes: true
depends_on_view: Inbox
inputs:
  thread_id:
    type: text
    required: true
    description: data-legacy-thread-id of the row to archive
result:
  archived: boolean
flavors:
  dom_submit:
    requires_auth: session_cookie
    label: Select row + click Archive
    recipe:
      - id: select_row
        type: use_widget
        args:
          widget: gmail.row_checkbox
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
      - id: click_archive
        type: use_widget
        args:
          widget: gmail.toolbar_archive_button
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
    outcomes:
      - action: archived
        signal:
          type: selector_disappears
          selector: tr.zA:has(span[data-legacy-thread-id='{{inputs.thread_id}}'])
        extract:
          archived:
            literal: true
