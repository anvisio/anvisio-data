_meta:
  name: manifests/gmail/actions/archive_email.yaml
  version: 0.3.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    archive_email atom — remove a thread from the inbox. Spec 70:
    `browser` flavor for the toolbar UI + `mcp` flavor backed by
    gmail.modify_email (removeLabelIds: [INBOX]). Writes prefer
    browser > mcp per spec 70 §7 — the user sees the row disappear.
  changelog:
    - "0.3.0 (2026-05-19): spec 70 shape — `dom` → `browser`, drop emits_when, add mcp_tool + mcp flavor."
    - "0.2.0 (2026-05-16): migrate to single `dom` flavor with commit marker (Phase 3 four-cleanup refactor)."
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest."

description: >
  Archive a thread (remove from Inbox, keep on All Mail). Browser flavor
  selects the row + clicks the toolbar Archive button. MCP flavor calls
  gmail.modify_email with removeLabelIds: ["INBOX"].
object: Thread
commits_changes: true
depends_on_view: Inbox
mcp_tool: gmail.modify_email
inputs:
  thread_id:
    type: text
    required: true
    description: data-legacy-thread-id of the row to archive
result:
  archived: boolean
flavors:
  browser:
    requires_auth: session_cookie
    label: Select row; click Archive when commit:true
    recipe:
      - id: select_row
        type: use_widget
        args:
          widget: gmail.row_checkbox
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
      - id: click_archive
        type: use_widget
        commit: true
        args:
          widget: gmail.toolbar_archive_button
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
    outcomes:
      - action: ready_to_archive
        signal:
          type: selector_appears
          selector: div[role='button'][aria-label='Archive'][data-tooltip='Archive']
      - action: archived
        signal:
          type: selector_disappears
          selector: tr.zA:has(span[data-legacy-thread-id='{{inputs.thread_id}}'])
        extract:
          archived:
            literal: true
  mcp:
    requires_auth: mcp_server
    label: Archive via gmail.modify_email MCP tool
    server: gmail
    tool: modify_email
    inputs_map:
      messageId: "{{inputs.thread_id}}"
      removeLabelIds: ["INBOX"]
    outcomes:
      - action: archived
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          archived:
            literal: true
