_meta:
  name: manifests/gmail/actions/search_email.yaml
  version: 0.4.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    search_email atom — find messages via Gmail's search-query syntax
    (from:, subject:, has:attachment, label:...). Read-only; a `browser`
    flavor (DOM search bar) + an `oauth_api` flavor (Gmail REST
    users.messages.list). Reads prefer oauth_api > browser per spec 70 §7.
  changelog:
    - "0.4.0 (2026-05-19): replace the unbuildable `mcp` flavor with an `oauth_api` flavor (inline Gmail REST request); the runtime oauth_api transport executes it and returns the matching message ids."
    - "0.3.0 (2026-05-19): spec 70 shape — rename `dom` → `browser`, drop emits_when, add mcp_tool + mcp flavor."
    - "0.2.0 (2026-05-16): rename dom_submit → dom."
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest."

description: >
  Search the mailbox using Gmail's search query syntax (from:, subject:,
  has:attachment, label:...). The browser flavor types the query into the
  global search bar and waits for the URL to transition to #search/<query>.
  The oauth_api flavor calls the Gmail REST users.messages.list endpoint for
  an invisible API search that returns the matching message ids.
object: Thread
commits_changes: false
depends_on_view: any
mcp_tool: gmail.search_emails
inputs:
  query:
    type: text
    required: true
  maxResults:
    type: integer
    required: false
    description: |
      Caps the result list size. Consulted by the oauth_api flavor —
      passed through as the Gmail API maxResults query param.
result:
  searched: boolean
  message_ids: list<id>
flavors:
  browser:
    requires_auth: session_cookie
    label: Type query into search bar; wait for URL transition
    recipe:
      - id: run_search
        type: use_widget
        args:
          widget: gmail.search_input
          op: fill
          inputs:
            value: "{{inputs.query}}"
    outcomes:
      - action: searched
        signal:
          type: url_matches
          pattern: "#search/.*"
        extract:
          searched:
            literal: true
  oauth_api:
    requires_auth: oauth_token
    label: Search via the Gmail REST API (users.messages.list)
    request:
      provider: google
      method: GET
      url: https://gmail.googleapis.com/gmail/v1/users/me/messages
      query:
        q: "{{inputs.query}}"
        maxResults: "{{inputs.maxResults}}"
    outcomes:
      - action: searched
        extract:
          message_ids:
            from_api_response: true
            path: messages[*].id
          searched:
            literal: true
