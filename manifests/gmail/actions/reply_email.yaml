_meta:
  name: manifests/gmail/actions/reply_email.yaml
  version: 0.1.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-10
  description: |
    reply_email action — reply to the currently open thread with a body
    message. Wizard chains gmail.thread_reply_button before this
    action. To field auto-fills on reply.
  changelog:
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest"

description: >
  Reply to the currently open thread with a body message. Assumes the user has
  already opened the thread (ThreadView) and clicked the Reply control so the
  inline ReplyComposer is visible. The wizard chains gmail.thread_reply_button
  before this action.
object: Reply
commits_changes: true
depends_on_view: ReplyComposer
inputs:
  fields:
    type: object
    required: true
    description: >
      Subset of Reply fields. Required: Body. (To is implicit — Gmail auto-fills
      it on reply.)
result:
  sent: boolean
flavors:
  dom_no_submit:
    requires_auth: session_cookie
    label: Fill reply body; you click Send
    recipe:
      - id: fill
        type: fill_fields
        args:
          object: Reply
          from: "{{inputs.fields}}"
    outcomes:
      - action: ready_to_reply
        signal:
          type: selector_appears
          selector: div[role='main'] div[role='button'][aria-label^='Send
            '][aria-label*='Ctrl-Enter']
      - action: sent
        signal:
          type: click_observed
          widget: gmail.reply_send_button
        extract:
          sent:
            literal: true
  dom_submit:
    requires_auth: session_cookie
    label: Fill reply body + click Send
    recipe:
      - id: fill
        type: fill_fields
        args:
          object: Reply
          from: "{{inputs.fields}}"
      - id: send
        type: use_widget
        args:
          widget: gmail.reply_send_button
          op: invoke
    outcomes:
      - action: sent
        signal:
          type: network_response
          pattern: POST .*/mail/u/0/.*sendmail
        extract:
          sent:
            literal: true
