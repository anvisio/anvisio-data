_meta:
  name: manifests/gmail/actions/reply_email.yaml
  version: 0.15.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-26
  description: |
    reply_email atom: reply to the currently open thread. Spec 70:
    `browser` flavor fills the inline reply composer + clicks Send;
    `mcp` flavor calls gmail.send_email with threadId + inReplyTo so
    the reply lands in the right thread.

    Composer-trigger ownership note (2026-05-26): previously this
    atom relied on ReplyComposer.yaml's entry recipe to open the
    inline composer (the entry hardcoded the Reply trigger
    `.ams.bkH`). That worked for reply_email but broke
    reply_all_email + forward_email which need different triggers.
    Per the 2026-05-25 audit (Finding 2), each atom now OWNS its
    trigger click: this atom depends_on_view: ThreadView + opens the
    composer itself via `gmail.thread_reply_button` (the post-3.5.0
    widget that targets `.ams.bkH` primary + icon-button fallback).
    ReplyComposer view's entry recipe stays for /validate-views
    purposes.

    Post-send navigation note (2026-05-26): unlike send_email 0.8.4,
    the reply recipe does NOT auto-click "View message" — Gmail
    omits the link_vsm element from the reply snackbar (live-verified
    via synthetic probe 2026-05-26: snackbar contains ONLY #link_undo,
    no #link_vsm). The reply always lands in the current thread, so
    the existing h2.hP[data-legacy-thread-id] (still visible in
    ThreadView the whole time) IS the canonical thread_id. Extract
    directly.
  changelog:
    - "0.15.0 (2026-06-08): CANONICAL ACTION FORM v71 (mirrors send_email 0.15.0). (1) tab_mode: current replaces runs_in_home_tab: true (the in-thread inline composer acts in the home tab; resolveTabPlan maps current to wantsOwnTab:false, exactly what the boolean gave). (2) flat typed inputs (To/Subject/Body/ThreadId/InReplyTo) replace the fields:{type:object} bag; the recipe's fill_fields has NO `from` (fills the Reply from the flat inputs, the writable-field filter drops InReplyTo), mcp/oauth map the scalars. (3) result.outcome (auto from the winning action: sent | discarded | drafted) replaces the three booleans; the per-terminal literal extracts are dropped across all three flavors (extract carries only payload: message_id / thread_id / message / draft_id). (4) the ready_to_reply pseudo-outcome is dropped: outcomes are the terminals the LLM consumes, the filled-and-ready state is the recipe + the HITL pause. No live-behavior change vs 0.14.0 (same signals/selectors/grace)."
    - "0.14.0 (2026-06-07): MCP parity — return flat top-level message_id + thread_id on `sent`, matching gmail.send_email's output_schema ({message_id, thread_id}, which reply maps to via mcp_tool) + send_email's own result. Previously reply nested the ids only as message.{Id,ThreadId}, so result.thread_id was undefined for downstream chaining + the feed line showed just 'sent' (summarizeTaskOutput ignores the nested object). All three flavors now populate the flat pair: mcp/oauth from the API response; browser thread_id from h2.hP + message_id (and the now-un-nulled message.Id) from the NEW `from_selector_last` extract — the just-sent reply is the LAST div.adn.ads[data-legacy-message-id] (from_selector took the oldest = wrong; from_selector_last is the extract twin of the click step's pick_last). Result schema adds message_id/thread_id: text."
    - "0.13.0 (2026-06-07): slim outcome extracts to only the values the outcome produces — drop the cross-terminal literal:false + irrelevant literal:null. The result: schema still declares the full type contract; summarizeTaskOutput reads only truthy flags so the feed display is unchanged, and no consumer does a strict ===false (verified). cd2k's contract-is-what-is-returned principle."
    - "0.12.0 (2026-06-07): FIX the `closed` signal — was `selector_disappears input[name='subjectbox']`, which fired the INSTANT the inline reply composer opened because that composer's subjectbox is COLLAPSED to 0px (present in DOM but w:0/h:0 → selector_disappears' visibility check reads it as gone). So `drafted` (when:[closed] not:[sent,discarded]) resolved immediately, the commit:false HITL wait vanished before the user could Send/discard, and NO terminal was tracked (caught on the 2026-06-07 reply re-drive — the user saw the 'review & Send' card disappear without waiting + no sent/discarded). reply 0.10.0's 'subjectbox is present' probe missed the 0px collapse (present ≠ visible). Now `selector_disappears div[role='main'] div[role='region'][data-compose-id]` — the inline composer REGION, visible (h~234) while open + removed on close (live-verified 1→0 on discard). send_email keeps subjectbox (its DOCKED compose has a visible one). Same fix in reply_all_email / forward_email 0.12.0."
    - "0.11.0 (2026-06-07): add `runs_in_home_tab: true` — FIX a latent regression caught on the 2026-06-07 reply re-drive. reply is an IN-THREAD write (inline composer inside the open thread), but as commits_changes:true with NO runs_in_home_tab it hit the wantsOwnTab gate (commits_changes && browser && !runs_in_home_tab) and opened a BLANK own edit tab. ThreadView's entry was redesigned in 0.7.0 (2026-05-29) to row-click the thread in the CURRENT tab's list with NO nav — pairing with read_email's `reads_in_fresh_tab`, which CLONES the home tab's list into the read tab so the row is present. A blank edit tab has no list, so the entry's `await_row` polled an empty list and timed out at 15s (`runtime(gmail/reply_email) failed: current-view entry.recipe failed: step await_row … 15000ms`). reply/reply_all/forward weren't re-driven after the 0.7.0 change, so the break stayed latent. runs_in_home_tab:true flips wantsOwnTab off → reply runs in the home tab, which already holds the search/inbox list → the row-click opens the thread. cd2k chose this (matches reply's in-thread nature) over a clone-list-for-writes runtime mode. send_email unaffected (new compose, no ThreadView dep). See gmail.md `runs_in_home_tab` matrix."
    - "0.10.0 (2026-06-07): SPEC 70 SIGNALS MODEL — three terminals (sent / discarded / drafted) as `when:` / `not:` predicates over a named `signals:` map (sent / discarded / closed), matching send_email 0.13.0; live-probed 2026-06-07 with cd2k via the observe-act loop (watch URL + DOM mutations). Fixes the HITL hang: previously a discarded or closed reply in commit:false had NO terminal but `sent`, so the wait hung the full 600s (or until manual Skip). FOUR reply-specific findings vs send_email's compose model. (1) The inline reply composer does NOT flip the URL to `?compose=` even with content (waited 1.8s past the autosave debounce) — so reply has NO `autosave_signal`; the draft handle lives in `input[name='draft']` as a Gmail-internal `#msg-a:r…` ref that is NOT URL-reopenable, so the `drafted` terminal returns a null `draft_id`. (2) `input[name='subjectbox']` IS present in the reply DOM (collapsed, value `Re: …`) and disappears when the composer closes — so the `closed` signal uses the same selector send_email does. (3) Discard fires `Draft discarded.` in the SAME `[role='alert']` snackbar host as send (`.b8.UC` / inner `.bAq`) — a POSITIVE `discarded` outcome. (4) The send snackbar has NO `#link_vsm` (`View message`) — only `#link_undo` (live-reconfirmed) — so NO `then:` hook; the reply lands in the current thread and `h2.hP[data-legacy-thread-id]` (live-confirmed == `input[name='lts']` == 19e90fdef97cb9f1) IS the canonical thread_id throughout. message.Id stays null on multi-message threads (though `div.adn.ads[data-legacy-message-id]` returned only the newest this once — candidate for a future expanded-only/last-match extract). reply_all_email / forward_email share this exact surface (different trigger) — ported alongside."
    - "0.9.8 (2026-05-30): `sent` outcome signal upgraded from `selector_appears` to `transient_appears` on the `[role='alert'] 'Message sent'` snackbar. The MutationObserver latch survives the snackbar's ~3s auto-dismiss (a polling selector_appears at 200ms can race past it) AND is pre-armed for spec-72 commit-delta detection so it works in BOTH commit:true (latch armed pre-Send → catches snackbar) and commit:false (latch armed post-fill → catches the user's manual Send). Same upgrade in reply_all_email + forward_email 0.9.8, matching send_email 0.9.0."
    - "0.9.6 (2026-05-26): drop the wait_for_send_completion recipe step; move the snackbar wait INSIDE the `sent` outcome's signal (selector_appears with must_contain_text + 600s timeout_ms). Fix for the HITL probe-mask bug in commit:false mode — previously the wait step ran inside the recipe, so by the time HITL began, the send had already happened; probe found the sent outcome matching (h2.hP is visible the whole time), masked it, and left the 'Review & Save' modal stuck for the full 10-min timeout window after the user had already clicked Send. Same fix applied to reply_all_email + forward_email 0.9.6."
    - "0.9.7 (2026-05-28): honest message.Id. Browser flavor was setting message.Id from h2.hP[data-legacy-thread-id] = the THREAD id, not a message id (mcp/oauth return a distinct one). A reply lands on a MULTI-message thread; the real per-message selector div.adn.ads[data-legacy-message-id] matches oldest-first, so from_selector would grab the wrong message. Return honest null until the extract DSL gains last-match. message.ThreadId stays correct. Single-message sends CAN extract the real id — see send_email 0.8.5. Same fix in reply_all_email 0.9.7. Surfaced during the atoms-as-LLM-tools return-shape audit."
    - "0.9.5 (2026-05-26): drop click_view_message + wait_thread_view steps. Gmail's reply snackbar shows ONLY 'Undo' — no 'View message' link to click (live-verified via synthetic chrome-devtools probe). Extract thread_id from the existing h2.hP[data-legacy-thread-id] in ThreadView (we never leave; the reply lands in the same thread). Same fix applied to reply_all_email 0.9.5. forward_email 0.9.5 also drops the navigation but stubs result.message=null (browser flavor cannot read the destination thread's id — caller must use mcp/oauth_api flavor for forward's message id)."
    - "0.9.4 (2026-05-26): recover message.{Id,ThreadId} via auto-click View message + read h2.hP[data-legacy-thread-id] on ThreadView — see send_email 0.8.4 for the full rationale. (Live-test 2026-05-26 evening showed the click_view_message step fails for reply because the snackbar has no link_vsm; superseded by 0.9.5.)"
    - "0.9.3 (2026-05-26): switch sent outcome to DOM signal on the 'Message sent' snackbar — see send_email 0.8.3 for the network-vs-DOM rationale + the id-form gap."
    - "0.9.2 (2026-05-26): fix url_pattern + method split — see send_email 0.8.2."
    - "0.9.1 (2026-05-26): fix browser-flavor `sent` outcome — `pattern:` renamed to `url_pattern:` (signal-watcher.ts expects url_pattern; was silently matched:false). See send_email 0.8.1 for the discovery + scope."
    - "0.9.0 (2026-05-26): populate result.message.{Id, ThreadId} from sync response via from_api_response_recursive (closes the A4 follow-up). Pattern matches send_email 0.8.0."
    - "0.8.0 (2026-05-26): own the composer trigger. depends_on_view changed from ReplyComposer to ThreadView; recipe gains `open_composer` (use_widget gmail.thread_reply_button) + `wait_composer` (wait_for_element on the body) at the front. Fixes the cross-atom interference where ReplyComposer's entry recipe forced Reply for reply_all/forward. See [[project-gmail-browser-flavor-audit-2026-05-25]] Finding 2 + bundled-manifests/gmail/app_model.yaml ThreadView.inline_actions_at_message_bottom."
    - "0.7.0 (2026-05-25): add oauth_api flavor — same shape as send_email 0.7.0 but threading via In-Reply-To + References headers + top-level threadId. Caller passes inputs.fields.{ThreadId, InReplyTo} (typically from a prior read_email)."
    - "0.6.0 (2026-05-25): mcp flavor: add inputs_map (same A1 fix as send_email 0.6.0). For replies the caller supplies threadId + inReplyTo via inputs.fields.{ThreadId, InReplyTo} (typically from a prior read_email)."
    - "0.5.0 (2026-05-25): fix DEAD `sent` outcome network signal. Same fix as send_email 0.5.0 — modern Gmail reply hits `POST /mail/.*sync/u/\\d+/i/s`, not the legacy `/mail/u/0/.*sendmail`. Live-test 2026-05-25 captured the sync XHR for a real reply (5 sync calls fire post-Send; the first contains the new message). result.message stays literal:null pending from_api_response_regex (see send_email 0.5.0)."
    - "0.4.0 (2026-05-24): add schema-typed result.message (nullable) per v70 signature parity rule. mcp extracts message.Id + message.ThreadId; browser stubs literal:null."
    - "0.3.0 (2026-05-19): spec 70 shape: `dom` to `browser`, drop emits_when, add mcp_tool + mcp flavor."
    - "0.2.0 (2026-05-16): collapse dom_no_submit + dom_submit into single `dom` flavor."
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest."

description: >
  Reply to the currently open thread. Browser flavor fills the inline
  ReplyComposer + clicks Send. MCP flavor calls gmail.send_email with
  threadId + inReplyTo (caller supplies them — typically from a prior
  read_email call).
object: Reply
commits_changes: true
# v71 tab_mode (was runs_in_home_tab: true). current = act in place: the
# in-thread inline composer runs in the HOME tab (which holds the thread's list)
# so ThreadView's current-view row-click (0.7.0+, no nav) can open the thread.
# resolveTabPlan maps current to wantsOwnTab:false, exactly what runs_in_home_tab
# gave; a fresh own edit tab has no list, so await_row times out (regression
# since ThreadView 0.7.0; caught 2026-06-07). See the 0.11.0 changelog.
tab_mode: current
depends_on_view: ThreadView
mcp_tool: gmail.send_email
inputs:
  # v71 flat typed scalars (was fields: {type: object}). The recipe assembles a
  # Reply via fill_fields `object: Reply` with NO `from` (fills from these flat
  # inputs, keeping only writable Reply fields); mcp/oauth map the scalars. To is
  # implicit on a browser reply (Gmail auto-fills the sender) but mcp/oauth need
  # it, plus Subject/ThreadId/InReplyTo for threading.
  To: { type: text, required: false }
  Subject: { type: text, required: false }
  Body: { type: rich_text, required: true }
  ThreadId: { type: text, required: false, description: "The thread to reply in." }
  InReplyTo: { type: text, required: false }
result:
  # v71: outcome = the winning terminal's action (sent | discarded | drafted),
  # auto-populated by the runtime (replaces the three booleans). discarded = the
  # user threw the reply draft away ("Draft discarded."); drafted = the user
  # closed / navigated away and the autosaved reply draft persists. Unlike
  # send_email the browser draft_id is always null: the inline reply composer
  # never exposes a URL-reopenable ?compose= handle (the in-DOM input[name='draft']
  # is a Gmail-internal #msg-a:r... ref, not reopenable). mcp/oauth flavors have
  # no compose surface to abandon, so they only ever return sent.
  outcome: text
  draft_id: text
  # MCP parity: gmail.send_email output_schema returns flat {message_id,
  # thread_id} (reply maps to send_email via mcp_tool). Match it + send_email
  # across all flavors. message_id = the just-sent reply (browser: the last
  # message via from_selector_last; mcp/oauth: the API response).
  message_id: text
  thread_id: text
  message:
    schema: Message
    nullable: true
flavors:
  browser:
    requires_auth: session_cookie
    label: Open Reply composer; fill body; click Send when commit:true
    # Spec 70 SIGNALS MODEL. Named events watched across the L4 wait; the
    # outcomes resolve by a when:/not: predicate over them. The inline reply
    # composer closing is SHARED by send, discard, AND close/navigate-away:
    # `sent` / `discarded` are positive toasts; `closed` on its own (no toast
    # within grace) = the `drafted` close (the autosaved reply draft persists).
    # NO `autosave` signal (unlike send_email): live-probed 2026-06-07, the
    # inline reply composer does NOT flip the URL to ?compose=, so there's no
    # reopenable handle — `drafted` returns draft_id:null. subjectbox IS present
    # in the reply DOM (collapsed) and disappears on close, so `closed` uses the
    # same selector send_email does. Without the drafted/discarded terminals, a
    # discarded/closed reply in commit:false (HITL) hung the wait the full 600s.
    signals:
      sent:
        type: transient_appears
        selector: "div[role='alert']"
        must_contain_text: "Message sent"
      discarded:
        type: transient_appears
        selector: "div[role='alert']"
        must_contain_text: "Draft discarded"
      closed:
        type: selector_disappears
        # The INLINE reply composer's subjectbox is COLLAPSED to 0px (present
        # in the DOM but w:0/h:0), so selector_disappears on it fired the
        # INSTANT the composer opened → `drafted` resolved immediately + the
        # commit:false HITL wait vanished before the user could act (caught
        # live 2026-06-07). The composer REGION is the honest closed-signal:
        # visible (h~234) while open, removed on close (verified 1→0 live).
        selector: "div[role='main'] div[role='region'][data-compose-id]"
    recipe:
      # Open the inline Reply composer. Widget primary is the
      # `.ams.bkH` text-link at message bottom (post 3.5.0); the icon
      # button at top is the fallback. Both open the same composer.
      - id: open_composer
        type: use_widget
        args:
          widget: gmail.thread_reply_button
          op: invoke
      # Belt-and-suspenders: wait for the body editor to render. The
      # widget's verify already gates on the body, but keeping this
      # explicit means heal can patch JUST this step if Gmail mutates
      # the body editor's selector.
      - id: wait_composer
        type: wait_for_element
        args:
          selector: "div[role='region'][data-compose-id] div[role='textbox'][aria-label*='Message Body']"
          timeout_ms: 6000
      - id: fill
        type: fill_fields
        args:
          # v71: no `from` → fill the Reply from the action's flat inputs
          # (the writable-field filter drops non-Reply keys like InReplyTo).
          object: Reply
      - id: send
        type: use_widget
        commit: true
        args:
          widget: gmail.reply_send_button
          op: invoke
      # Post-send work lives in the `sent` outcome's signal/extract, NOT as a
      # recipe step (0.9.6 fix). A commit-marked post-send step is SKIPPED in
      # commit:false HITL, so a previewed reply would never reach the extract; in
      # the outcome it runs in BOTH modes, during the L4 wait after the commit is
      # detected (so no probe-mask hang). See the 0.9.6 changelog.
    outcomes:
      # v71: the ready_to_reply pseudo-outcome is DROPPED — outcomes are the
      # terminals the LLM consumes; the filled-and-ready state is the recipe + the
      # HITL pause (the runtime needs no inline ready signal to mask).
      - action: sent
        # Resolves when the `sent` toast fires (BOTH modes — pre-armed latch).
        # NO then: hook (unlike send_email): the reply snackbar has NO #link_vsm
        # "View message" link — only #link_undo (live-reconfirmed 2026-06-07) —
        # and the reply lands in the current thread, so h2.hP[data-legacy-thread-id]
        # is present the whole time and IS the canonical thread_id (live-confirmed
        # == input[name='lts']).
        when: [sent]
        extract:
          # v71: no `sent: {literal:true}` — result.outcome names the terminal.
          # MCP parity: gmail.send_email output_schema = {message_id, thread_id}
          # (reply maps to send_email via mcp_tool). Return the SAME flat
          # top-level shape the mcp/oauth flavors + send_email do.
          message_id:
            # The just-sent reply is the LAST div.adn.ads[data-legacy-message-id]
            # on the thread. from_selector_last (added 2026-06-07 — the extract
            # twin of the click step's pick_last) grabs it. from_selector took the
            # OLDEST (wrong), which is why this was stubbed null pre-0.14.0.
            from_selector_last: "div.adn.ads[data-legacy-message-id]"
            attr: "data-legacy-message-id"
          thread_id:
            from_selector: "h2.hP[data-legacy-thread-id]"
            attr: "data-legacy-thread-id"
          # Nested schema-typed Message (v70 canonical) — same ids, Id no longer
          # null now that from_selector_last resolves the just-sent message.
          message:
            Id:
              from_selector_last: "div.adn.ads[data-legacy-message-id]"
              attr: "data-legacy-message-id"
            ThreadId:
              from_selector: "h2.hP[data-legacy-thread-id]"
              attr: "data-legacy-thread-id"
      - action: discarded
        # The `discarded` toast ("Draft discarded.") fired — a POSITIVE terminal
        # (live-probed 2026-06-07: fires in the SAME [role='alert'] host as
        # "Message sent", only the text differs). v71: no literal extract.
        when: [discarded]
      - action: drafted
        # The reply composer CLOSED with neither toast (close / navigate-away) —
        # the autosaved reply draft persists. The `not:` guard holds a grace
        # window so a real send/discard wins. HITL-only. draft_id is null (the
        # inline composer exposes no reopenable ?compose= handle). v71: no literal.
        when: [closed]
        not: [sent, discarded]
  mcp:
    requires_auth: mcp_server
    label: Reply via gmail.send_email with threadId + inReplyTo
    server: gmail
    tool: send_email
    inputs_map:
      to: "{{inputs.To}}"
      body: "{{inputs.Body}}"
      threadId: "{{inputs.ThreadId}}"
      inReplyTo: "{{inputs.InReplyTo}}"
      mimeType: "text/html"
    outcomes:
      - action: sent
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          message_id:
            from_api_response: ".message_id"
          thread_id:
            from_api_response: ".thread_id"
          message:
            Id:
              from_api_response: ".message_id"
            ThreadId:
              from_api_response: ".thread_id"
  oauth_api:
    requires_auth: oauth_token
    label: Reply via Gmail REST users.messages.send (threading via headers + threadId)
    request:
      provider: google
      method: POST
      url: https://gmail.googleapis.com/gmail/v1/users/me/messages/send
      body:
        raw:
          rfc822:
            to: "{{inputs.To}}"
            subject: "{{inputs.Subject}}"
            htmlBody: "{{inputs.Body}}"
            inReplyTo: "{{inputs.InReplyTo}}"
            references: "{{inputs.InReplyTo}}"
        threadId: "{{inputs.ThreadId}}"
    outcomes:
      - action: sent
        extract:
          message_id:
            from_api_response: true
            path: id
          thread_id:
            from_api_response: true
            path: threadId
          message:
            Id:
              from_api_response: true
              path: id
            ThreadId:
              from_api_response: true
              path: threadId
