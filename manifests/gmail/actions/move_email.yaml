_meta:
  name: manifests/gmail/actions/move_email.yaml
  version: 0.3.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-19
  description: |
    move_email atom — relocate a thread to a different label/folder.
    Spec 70: `browser` flavor uses the Move-to menu typeahead; `mcp`
    flavor calls gmail.modify_email — remove INBOX + add the
    destination label id.
  changelog:
    - "0.3.0 (2026-05-19): spec 70 shape — `dom` → `browser`, drop emits_when, add mcp_tool + mcp flavor."
    - "0.2.0 (2026-05-16): migrate to single `dom` flavor with commit marker (Phase 3)."
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest."

description: >
  Move a thread to a different label/folder (e.g., Spam, custom label). Browser
  flavor selects the row + opens the Move-to menu + picks the destination. MCP
  flavor calls gmail.modify_email — removes INBOX and adds the destination
  label id (caller resolves the human name → id via list_email_labels first).
object: Thread
commits_changes: true
depends_on_view: Inbox
mcp_tool: gmail.modify_email
inputs:
  thread_id:
    type: text
    required: true
  destination:
    type: text
    required: true
    description: Label or folder name (e.g., 'Spam', 'Trash', or a custom label)
result:
  moved: boolean
flavors:
  browser:
    requires_auth: session_cookie
    label: Select row + Move-to menu; pick destination when commit:true
    recipe:
      - id: select_row
        type: use_widget
        args:
          widget: gmail.row_checkbox
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
      - id: open_move_menu
        type: use_widget
        args:
          widget: gmail.toolbar_move_button
          op: invoke
      - id: pick_destination
        type: use_widget
        commit: true
        args:
          widget: gmail.move_menu_search
          op: fill
          inputs:
            value: "{{inputs.destination}}"
    outcomes:
      - action: ready_to_move
        signal:
          type: selector_appears
          selector: div[role='menu'] input[placeholder='Move to:']
      - action: moved
        signal:
          type: selector_disappears
          selector: tr.zA:has(span[data-legacy-thread-id='{{inputs.thread_id}}'])
        extract:
          moved:
            literal: true
  mcp:
    requires_auth: mcp_server
    label: Move via gmail.modify_email MCP tool
    server: gmail
    tool: modify_email
    inputs_map:
      messageId: "{{inputs.thread_id}}"
      addLabelIds: ["{{inputs.destination}}"]
      removeLabelIds: ["INBOX"]
    outcomes:
      - action: moved
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          moved:
            literal: true
