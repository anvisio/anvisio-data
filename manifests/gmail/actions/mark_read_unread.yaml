_meta:
  name: manifests/gmail/actions/mark_read_unread.yaml
  version: 0.1.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-10
  description: |
    mark_read_unread action — toggle read/unread on a specific row.
    Uses ux_decision with on:input.mode to dispatch between
    toolbar_mark_read_button and toolbar_mark_unread_button. Outcome
    signal is loose (just checks row presence) — Phase 7 candidate for
    tightening (check tr.zA.zE class for read state).
  changelog:
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest"

description: >
  Mark the selected row as read or unread. The wizard must pass mode=read|unread
  to choose the correct toolbar widget. Uses ux_decision so each branch
  references a static widget (no template interpolation in widget names).
object: Thread
commits_changes: true
depends_on_view: Inbox
inputs:
  thread_id:
    type: text
    required: true
  mode:
    type: text
    required: true
    description: "'read' or 'unread'"
result:
  toggled: boolean
flavors:
  dom_submit:
    requires_auth: session_cookie
    label: Select row + mark read/unread
    recipe:
      - id: select_row
        type: use_widget
        args:
          widget: gmail.row_checkbox
          op: invoke
          inputs:
            thread_id: "{{inputs.thread_id}}"
      - id: choose_mode
        type: ux_decision
        args:
          kind: pick_one
          on: "{{inputs.mode}}"
          branches:
            read:
              - id: click_mark_read
                type: use_widget
                args:
                  widget: gmail.toolbar_mark_read_button
                  op: invoke
                  inputs:
                    thread_id: "{{inputs.thread_id}}"
            unread:
              - id: click_mark_unread
                type: use_widget
                args:
                  widget: gmail.toolbar_mark_unread_button
                  op: invoke
                  inputs:
                    thread_id: "{{inputs.thread_id}}"
    outcomes:
      - action: toggled
        signal:
          type: selector_appears
          selector: tr.zA:has(span[data-legacy-thread-id='{{inputs.thread_id}}'])
        extract:
          toggled:
            literal: true
