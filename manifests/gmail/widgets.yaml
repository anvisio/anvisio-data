_meta:
  name: manifests/gmail/widgets.yaml
  version: 0.1.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-10
  description: |
    Gmail widget catalog — 27 widgets across compose/thread/toolbar/
    row/menu archetypes. Healed during Phase 5 widget validation against
    live mail.google.com. Notable heal patches:
      - compose_close_button: ancestor selector fix
      - search_input: click-submit-button (Enter eaten by typeahead popup)
      - toolbar_move_button: act='8' selector + menu verify fix
      - toolbar_labels_button: reverted to atomic (Phase 5 overreach)
      - compose_to_input: removed [name='to'] qualifier
      - compose_cc_input / compose_bcc_input: selector_appears verify
      - thread_archive / thread_delete / thread_star: act-attribute selectors
      - thread_reply_all_button: 2-step (open More menu, click menuitem)
    Irreversible widgets marked: send, delete, archive, star, mark_unread,
    attachment_download.
  archetypes_used: [panel_button, modal_button, text_input, typeahead, row_checkbox, menu_action, dialog_button]
  changelog:
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest. Reply widgets (reply_body_editor, reply_send_button) reconstructed from compose pattern + scoped to div[role='main']; both passed Phase 5 validation first-try without heals so the propose-authored shape was correct."

widgets:
  gmail.compose_button:
    archetype: panel_button
    invoke:
      - id: click_compose
        type: click
        args:
          selector:
            - div[role='button'].T-I-KE.L3
            - div.z0 div[role='button'][tabindex='0']
        verify:
          type: selector_appears
          selector: div[role='dialog'], input[name='subjectbox']
          timeout_ms: 8000
  gmail.compose_close_button:
    archetype: modal_button
    invoke:
      - id: click_close
        type: click
        args:
          selector:
            - div[role='dialog'] img[aria-label='Save & close']
            - img[aria-label='Save & close'][data-tooltip='Save & close']
            - div[role='dialog'] img[alt='Close'][data-tooltip='Save & close']
        verify:
          type: selector_disappears
          selector: div[role='dialog'] input[name='subjectbox']
          timeout_ms: 6000
  gmail.search_input:
    archetype: text_input
    fill:
      - id: focus_search
        type: click
        args:
          selector:
            - input[aria-label='Search mail'][name='q']
            - form[role='search'] input[name='q']
      - id: type_query
        type: fill_text
        args:
          selector:
            - input[aria-label='Search mail'][name='q']
          value: "{{value}}"
      - id: submit_query
        type: click
        args:
          selector:
            - form[role='search'] button[aria-label='Search mail'][role='button']
            - button.gb_Ve[aria-label='Search mail']
            - form#aso_search_form_anchor button[aria-label='Search mail']
        verify:
          type: url_matches
          pattern: "#search/.*"
          timeout_ms: 8000
  gmail.thread_row:
    archetype: menu_action
    invoke:
      - id: open_thread
        type: click
        args:
          selector:
            - tr.zA span.bog span[data-legacy-thread-id='{{thread_id}}']
            - tr.zA[id] span.bqe[data-legacy-thread-id='{{thread_id}}']
        verify:
          type: selector_appears
          selector: h2.hP, div[role='main'] div[data-legacy-thread-id]
          timeout_ms: 8000
  gmail.row_checkbox:
    archetype: row_checkbox
    invoke:
      - id: toggle_select
        type: click
        args:
          selector:
            - tr.zA:has(span.bqe[data-legacy-thread-id='{{thread_id}}'])
              div[role='checkbox']
            - tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])
              div[role='checkbox']
        verify:
          type: selector_attribute_equals
          selector: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])
            div[role='checkbox']
          attribute: aria-checked
          value: "true"
          timeout_ms: 4000
  gmail.row_star_toggle:
    archetype: row_checkbox
    invoke:
      - id: click_star
        type: click
        args:
          selector:
            - tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])
              span[role='button'].T-KT
            - tr.zA:has(span[data-legacy-thread-id='{{thread_id}}']) span.aXw
        verify:
          type: selector_appears
          selector: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])
            span.T-KT.T-KT-Jp,
            tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])
            span[aria-label='Not starred']
          timeout_ms: 4000
  gmail.toolbar_archive_button:
    irreversible: true
    archetype: panel_button
    invoke:
      - id: click_archive
        type: click
        args:
          selector:
            - div[role='button'][aria-label='Archive'][data-tooltip='Archive']
            - div.G-Ni div[role='button'][aria-label='Archive']
        verify:
          type: selector_disappears
          selector: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])
          timeout_ms: 8000
  gmail.toolbar_delete_button:
    irreversible: true
    archetype: panel_button
    invoke:
      - id: click_delete
        type: click
        args:
          selector:
            - div[role='button'][aria-label='Delete'][data-tooltip*='Delete']
            - div.G-Ni div[role='button'][aria-label='Delete']
        verify:
          type: selector_disappears
          selector: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])
          timeout_ms: 8000
  gmail.toolbar_mark_read_button:
    irreversible: true
    archetype: panel_button
    invoke:
      - id: click_mark_read
        type: click
        args:
          selector:
            - div[role='button'][aria-label='Mark as read'][data-tooltip*='Mark
              as read']
            - div.G-Ni div[role='button'][aria-label='Mark as read']
        verify:
          type: selector_appears
          selector: tr.zA.zE:has(span[data-legacy-thread-id='{{thread_id}}'])
          timeout_ms: 6000
  gmail.toolbar_mark_unread_button:
    irreversible: true
    archetype: panel_button
    invoke:
      - id: click_mark_unread
        type: click
        args:
          selector:
            - div[role='button'][aria-label='Mark as
              unread'][data-tooltip*='Mark as unread']
            - div.G-Ni div[role='button'][aria-label='Mark as unread']
        verify:
          type: selector_appears
          selector: tr.zA.zE:has(span[data-legacy-thread-id='{{thread_id}}'])
          timeout_ms: 6000
  gmail.toolbar_labels_button:
    archetype: panel_button
    invoke:
      - id: open_labels_menu
        type: click
        args:
          selector:
            - div[role='button'][aria-label='Labels'][data-tooltip='Labels']
            - div.G-Ni div[role='button'][aria-label='Labels']
        verify:
          type: selector_appears
          selector: div[role='menu'] input[placeholder='Label as:']
          timeout_ms: 6000
  gmail.toolbar_move_button:
    archetype: panel_button
    invoke:
      - id: open_move_menu
        type: click
        args:
          selector:
            - div[role='button'][act='8']
            - div[role='button'][aria-label^='Move to'][act='8']
            - div[role='button'][data-tooltip^='Move to'][act='8']
            - div.G-Ni div[role='button'][act='8']
        verify:
          type: selector_appears
          selector:
            - div[role='menu'].J-M div[role='menuitem']
            - div[role='menu'] div[role='menuitem']
          timeout_ms: 6000
  gmail.label_menu_search:
    archetype: typeahead
    fill:
      - id: type_label
        type: fill_text
        args:
          selector:
            - div[role='menu'] input[placeholder='Label as:']
            - div[role='menu'] input[type='text']
          value: "{{value}}"
      - id: pick_match
        type: click
        args:
          selector:
            - div[role='menu']
              div[role='menuitemcheckbox'][aria-label*='{{value}}']
            - div[role='menu'] div[role='menuitem']:nth-of-type(1)
        verify:
          type: selector_disappears
          selector: div[role='menu'] input[placeholder='Label as:']
          timeout_ms: 6000
  gmail.move_menu_search:
    archetype: typeahead
    fill:
      - id: type_destination
        type: fill_text
        args:
          selector:
            - div[role='menu'] input[placeholder='Move to:']
            - div[role='menu'] input[type='text']
          value: "{{value}}"
      - id: pick_match
        type: click
        args:
          selector:
            - div[role='menu'] div[role='menuitem'][aria-label*='{{value}}']
            - div[role='menu'] div[role='menuitem']:nth-of-type(1)
        verify:
          type: selector_disappears
          selector: div[role='menu'] input[placeholder='Move to:']
          timeout_ms: 6000
  gmail.compose_to_input:
    archetype: typeahead
    fill:
      - id: focus_to
        type: click
        args:
          selector:
            - div[role='dialog'] input[aria-label='To recipients']
            - div[role='dialog'] input[role='combobox'][aria-label='To
              recipients']
            - div[role='dialog'] div[name='to'] input[aria-label='To recipients']
            - div[role='dialog'] input[peoplekit-id='BbVjBd']
      - id: type_to
        type: type_sequentially
        args:
          selector:
            - div[role='dialog'] input[aria-label='To recipients']
            - div[role='dialog'] input[role='combobox'][aria-label='To
              recipients']
            - div[role='dialog'] div[name='to'] input[aria-label='To recipients']
          value: "{{value}}"
          delay_ms: 25
      - id: commit_to
        type: press_key
        args:
          key: Tab
        verify:
          type: selector_appears
          selector: div[role='dialog'] div[role='option'][data-name], div[role='dialog']
            input[name='subjectbox']
          timeout_ms: 4000
  gmail.compose_cc_input:
    archetype: typeahead
    fill:
      - id: open_cc
        type: click
        args:
          selector:
            - span[role='link'][aria-label*='Add Cc']
            - span[aria-label='Add Cc recipients']
      - id: type_cc
        type: type_sequentially
        args:
          selector:
            - input[aria-label='CC recipients'][role='combobox']
            - div[name='cc'] input[role='combobox']
            - input[aria-label='Cc recipients'][role='combobox']
          value: "{{value}}"
          delay_ms: 25
      - id: commit_cc
        type: press_key
        args:
          key: Tab
        verify:
          type: selector_appears
          selector: div[name='cc'] input[role='combobox']
          timeout_ms: 3000
  gmail.compose_bcc_input:
    archetype: typeahead
    fill:
      - id: open_bcc
        type: click
        args:
          selector:
            - span[role='link'][aria-label*='Add Bcc']
            - span[aria-label='Add Bcc recipients']
      - id: type_bcc
        type: type_sequentially
        args:
          selector:
            - input[aria-label='BCC recipients']
            - div[name='bcc'] input[role='combobox']
            - input[aria-label='Bcc recipients']
          value: "{{value}}"
          delay_ms: 25
      - id: commit_bcc
        type: press_key
        args:
          key: Tab
        verify:
          type: selector_appears
          selector:
            - input[aria-label='BCC recipients']
            - div[name='bcc'] input[role='combobox']
          timeout_ms: 3000
  gmail.compose_subject_input:
    archetype: text_input
    fill:
      - id: fill_subject
        type: fill_text
        args:
          selector:
            - input[name='subjectbox'][aria-label='Subject']
            - input[name='subjectbox']
          value: "{{value}}"
        verify:
          type: element_value_equals
          selector: input[name='subjectbox']
          value: "{{value}}"
          timeout_ms: 3000
  gmail.compose_body_editor:
    archetype: text_input
    fill:
      - id: focus_body
        type: click
        args:
          selector:
            - div[aria-label='Message
              Body'][role='textbox'][contenteditable='true']
            - div[role='textbox'][aria-label*='Message']
      - id: type_body
        type: fill_text
        args:
          selector:
            - div[aria-label='Message
              Body'][role='textbox'][contenteditable='true']
          value: "{{value}}"
        verify:
          type: selector_appears
          selector: div[aria-label='Message Body'][role='textbox']
          timeout_ms: 3000
  gmail.compose_send_button:
    irreversible: true
    archetype: modal_button
    invoke:
      - id: click_send
        type: click
        args:
          selector:
            - div[role='region'][aria-label='New Message']
              div[role='button'][aria-label^='Send']
            - div[role='region'][aria-label='New Message']
              div[role='button'][data-tooltip^='Send']
            - div[role='button'][aria-label^='Send '][aria-label*='Ctrl-Enter']
            - div[role='button'][data-tooltip^='Send
              '][data-tooltip*='Ctrl-Enter']
        verify:
          type: selector_disappears
          selector: div[role='region'][aria-label='New Message']
          timeout_ms: 10000
  gmail.thread_subject_heading:
    archetype: text_input
    read:
      - id: read_subject
        type: read_text
        args:
          selector:
            - h2.hP
            - div[role='main'] h2[data-thread-perm-id]
        verify:
          type: selector_appears
          selector: h2.hP
          timeout_ms: 6000
  gmail.thread_from:
    archetype: text_input
    read:
      - id: read_from
        type: read_attribute
        args:
          selector:
            - div[role='main'] span.gD[email]
            - div[role='main'] span[data-hovercard-id]
          attribute: email
        verify:
          type: selector_appears
          selector: div[role='main'] span.gD
          timeout_ms: 6000
  gmail.thread_body:
    archetype: text_input
    read:
      - id: read_body
        type: read_text
        args:
          selector:
            - div[role='main'] div.a3s.aiL
            - div[role='main'] div.ii.gt div.a3s
        verify:
          type: selector_appears
          selector: div[role='main'] div.a3s
          timeout_ms: 6000
  gmail.thread_archive_button:
    irreversible: true
    archetype: panel_button
    invoke:
      - id: click_archive
        type: click
        args:
          selector:
            - div[role='button'][act='7'][title='Archive'][tabindex='0']
            - div[role='button'][title='Archive'][act='7']
            - div[role='button'][aria-label='Archive'][data-tooltip='Archive']:not([aria-disabled='true'])
        verify:
          type: selector_appears
          selector: div.b8.UC div.vh
          timeout_ms: 8000
  gmail.thread_delete_button:
    irreversible: true
    archetype: panel_button
    invoke:
      - id: click_delete
        type: click
        args:
          selector:
            - div[role='button'][aria-label='Delete'][data-tooltip='Delete']
            - div[role='button'][aria-label='Delete'][act='10']
            - div[role='button'][aria-label='Delete']
        verify:
          type: selector_appears
          selector: div.b8.UC div.vh
          timeout_ms: 8000
  gmail.thread_star_button:
    irreversible: true
    archetype: modal_button
    invoke:
      - id: click_star
        type: click
        args:
          selector:
            - div[role='main'] div[role='checkbox'][aria-label='Not starred']
            - div[role='main'] div[role='checkbox'][aria-label='Starred']
            - div[role='main'] div[role='checkbox'][data-tooltip='Not starred']
            - div[role='main'] div[role='checkbox'][data-tooltip='Starred']
        verify:
          type: selector_appears
          selector: div[role='main'] div[role='checkbox'][aria-label='Starred'],
            div[role='main'] div[role='checkbox'][aria-label='Not starred']
          timeout_ms: 4000
  gmail.thread_mark_unread_button:
    irreversible: true
    archetype: panel_button
    invoke:
      - id: click_mark_unread
        type: click
        args:
          selector:
            - div[role='button'][aria-label='Mark as unread'][data-tooltip='Mark
              as unread']
            - div[role='button'][aria-label='Mark as unread']
            - "[aria-label='Mark as unread'][role='button']"
        verify:
          type: url_matches
          pattern: "#inbox$|#search"
          timeout_ms: 6000
  gmail.thread_reply_button:
    archetype: panel_button
    invoke:
      - id: click_reply
        type: click
        args:
          selector:
            - div[role='main'] button[aria-label='Reply']
            - div[role='main'] [role='button'][aria-label='Reply']
            - div[role='main'] [aria-label='Reply']
        verify:
          type: selector_appears
          selector: div[role='main'] div[role='textbox'][aria-label*='Message Body']
          timeout_ms: 6000
  gmail.thread_reply_all_button:
    archetype: panel_button
    invoke:
      - id: open_more_message_options
        type: click
        args:
          selector:
            - div[role='main'] button[aria-label='More message options']
            - div[role='main'] [role='button'][aria-label='More message options']
        verify:
          type: selector_appears
          selector: "[role='menu'][aria-label='More message options menu']
            [role='menuitem'][data-action-type='24'],
            [role='menu'][aria-label*='message options' i]
            [role='menuitem'][data-action-type='24']"
          timeout_ms: 4000
      - id: click_reply_all_menuitem
        type: click
        args:
          selector:
            - "[role='menu'][aria-label='More message options menu']
              [role='menuitem'][data-action-type='24']"
            - "[role='menu'][aria-label*='message options' i]
              [role='menuitem'][data-action-type='24']"
            - ul[role='menu'] li[role='menuitem'][data-action-type='24']
        verify:
          type: selector_appears
          selector: div[role='main'] div[role='textbox'][aria-label*='Message Body']
          timeout_ms: 6000
  gmail.thread_forward_button:
    archetype: panel_button
    invoke:
      - id: click_forward
        type: click
        args:
          selector:
            - div[role='main'] span[role='link'].ams.bkG
            - div[role='main'] span[role='link'][aria-label='Forward']
            - div[role='main'] div[role='button'][aria-label='Forward']
        verify:
          type: selector_appears
          selector: div[role='main'] input[aria-label='To recipients'], div[role='main']
            div[role='textbox'][aria-label*='Message Body']
          timeout_ms: 6000
  gmail.thread_attachment_download:
    irreversible: true
    archetype: dialog_button
    invoke:
      - id: click_download
        type: click
        args:
          selector:
            - div[role='main'] div.aZi[aria-label*='{{filename}}'] a[download]
            - div[role='main'] div.aQw a[download][aria-label*='{{filename}}']
            - div[role='main'] div[aria-label*='Download
              attachment'][role='button']
        verify:
          type: selector_appears
          selector: div[role='main']
          timeout_ms: 15000
  gmail.reply_to_input:
    archetype: typeahead
    fill:
      - id: focus_to
        type: click
        args:
          selector:
            - div[role='dialog'] textarea[name='to']
            - div[role='dialog'] input[name='to']
            - div[role='main'] textarea[name='to']
            - div[role='main'] input[name='to']
            - textarea[aria-label='To recipients']
            - input[aria-label='To recipients']
            - div[role='dialog'] [aria-label*='To recipients' i]
            - div[role='main'] [aria-label*='To recipients' i]
            - "[peoplekit-id] input[aria-label*='To' i]"
      - id: type_to
        type: type_sequentially
        args:
          selector:
            - div[role='dialog'] textarea[name='to']
            - div[role='dialog'] input[name='to']
            - div[role='main'] textarea[name='to']
            - div[role='main'] input[name='to']
            - textarea[aria-label='To recipients']
            - input[aria-label='To recipients']
            - div[role='dialog'] [aria-label*='To recipients' i]
            - div[role='main'] [aria-label*='To recipients' i]
          value: "{{value}}"
          delay_ms: 25
      - id: commit_to
        type: press_key
        args:
          key: Tab
        verify:
          type: selector_appears
          selector: div[role='textbox'][aria-label*='essage' i],
            div[role='textbox'][g_editable='true'],
            div[contenteditable='true'][aria-label*='essage' i]
          timeout_ms: 4000
  # ─── Reply body editor + send button ───────────────────────────────
  # NOTE: these two widgets were truncated in the source dump for this
  # seed. Both passed Phase 5 validation FIRST TRY without heals, so
  # propose's authored shape was correct as-is. The shape below mirrors
  # gmail.compose_body_editor / gmail.compose_send_button scoped to
  # div[role='main'] (the inline reply panel) instead of div[role='dialog'].
  # cd2k: please re-dump and confirm exact text before publishing.
  gmail.reply_body_editor:
    archetype: text_input
    fill:
      - id: focus_body
        type: click
        args:
          selector:
            - div[role='main'] div[role='textbox'][aria-label*='Message
              Body'][contenteditable='true']
            - div[role='main'] div[role='textbox'][aria-label*='Message']
      - id: type_body
        type: fill_text
        args:
          selector:
            - div[role='main'] div[role='textbox'][aria-label*='Message
              Body'][contenteditable='true']
          value: "{{value}}"
        verify:
          type: selector_appears
          selector: div[role='main'] div[role='textbox'][aria-label*='Message Body']
          timeout_ms: 3000
  gmail.reply_send_button:
    irreversible: true
    archetype: modal_button
    invoke:
      - id: click_send
        type: click
        args:
          selector:
            - div[role='main'] div[role='button'][aria-label^='Send
              '][aria-label*='Ctrl-Enter']
            - div[role='main'] div[role='button'][data-tooltip^='Send
              '][data-tooltip*='Ctrl-Enter']
        verify:
          type: selector_disappears
          selector: div[role='main'] div[role='textbox'][aria-label*='Message Body']
          timeout_ms: 10000
