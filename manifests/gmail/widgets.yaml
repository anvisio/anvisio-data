_meta:
  name: manifests/gmail/widgets.yaml
  version: 1.0.1
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    Per-app widgets stub for gmail. Inherits the full 27-widget set from
    widget-libraries/gmail.widgets.yaml via the `extends:` field. Per-org
    overrides would live under a `widgets:` map below; currently empty
    (the library is sufficient for the canonical Google Mail UI).

    Phase 1 of the four-cleanup refactor (2026-05-16) collapsed the
    previous v0.1.0 manifest, which duplicated the library body line for
    line, into this extends-stub. The manifest-loader resolves
    `extends:` at runtime via the CDN-backed WidgetLibraryFetcher; the
    propose prompt teaches library-first authoring via the new
    list_library_widgets tool.
  changelog:
    - "1.0.0 (2026-05-16): MAJOR rewrite. Replaces the 27-widget inline duplicate of widget-libraries/gmail.widgets.yaml v0.2.0 with a 2-line `extends:` stub. No per-app overrides. Demonstrates the library-first pattern; future per-org overlays (e.g. a customer with a non-standard Workspace add-on) would add a widgets: map below."
    - "0.1.0 (2026-05-10): initial seed from cd2k's healed gmail manifest (27 widgets inline — duplicated widget-libraries/gmail.widgets.yaml verbatim)."

extends: widget-libraries/gmail.widgets.yaml

# Per-app overrides go here. Empty = use extends: library as-is.
widgets: {}
