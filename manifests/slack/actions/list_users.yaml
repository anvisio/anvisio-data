_meta:
  name: manifests/slack/actions/list_users.yaml
  version: 0.2.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    list_users atom: fetch workspace members. Read; session_api >
    mcp > oauth_api.
  changelog:
    - "0.2.0 (2026-05-24): adopt schema-typed result.members: list<User> per v70 signature parity rule. mcp + oauth_api now also populate next_cursor from response_metadata.next_cursor (which Slack returns on users.list)."
    - "0.1.0 (2026-05-23): initial seed."

description: List members of a Slack workspace.
object: users
object_types: [User]
commits_changes: false
depends_on_view: any
mcp_tool: slack.list_users
inputs:
  workspace: { type: text, required: true, sample: anvisio }
  limit:     { type: integer, required: false, default: 100, maximum: 200 }
  cursor:    { type: text, required: false, default: "" }
result:
  members:
    schema: User
    cardinality: list
  next_cursor:
    type: text
    nullable: true

flavors:
  session_api:
    requires_auth: session_cookie
    label: Workspace /api/users.list (xoxc cookie)
    recipe:
      - id: api_call
        type: call_platform_api
        args:
          api_def:
            kind: slack_session_api
            endpoint: "https://{{inputs.workspace}}.slack.com/api/users.list?limit={{inputs.limit}}&cursor={{inputs.cursor}}"
            method: GET
            extract_path: ""
    outcomes:
      - action: listed
        signal:
          type: url_matches
          pattern: "slack\\.com"
          timeout_ms: 10000
        extract:
          members:
            from_step: api_call
            path: members
          next_cursor:
            from_step: api_call
            path: response_metadata.next_cursor

  mcp:
    requires_auth: mcp_server
    label: Official Slack MCP list_users
    server: slack
    tool: list_users
    outcomes:
      - action: listed
        signal:
          type: network_response
          url_pattern: "*/mcp/*"
          status: 200
        extract:
          members:
            from_api_response: true
            path: members
          next_cursor:
            from_api_response: true
            path: response_metadata.next_cursor

  oauth_api:
    requires_auth: oauth_token
    label: Public Web API /users.list
    request:
      method: GET
      url: "https://slack.com/api/users.list"
      query:
        limit:  "{{inputs.limit}}"
        cursor: "{{inputs.cursor}}"
    outcomes:
      - action: listed
        signal:
          type: network_response
          url_pattern: "slack.com/api/users.list"
          status: 200
        extract:
          members:
            from_api_response: true
            path: members
          next_cursor:
            from_api_response: true
            path: response_metadata.next_cursor
