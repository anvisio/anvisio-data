_meta:
  name: manifests/outlook/actions/search_email.yaml
  version: 0.1.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-17
  description: |
    Outlook search is IN-PLACE. URL stays at /mail/; verify signal is
    the 'Exit search' button appearing. outlook.search inherits from
    typeahead_search but overrides the fill op so its press_key step
    verify is selector_appears instead of url_matches.

description: Type a query into the global search box and submit (Enter).
object: Message
commits_changes: false
depends_on_view: Inbox
inputs:
  query:
    type: text
    required: true
    sample: invoice
result:
  searched: boolean
flavors:
  dom:
    requires_auth: session_cookie
    label: Type query, press Enter, verify search mode entered.
    recipe:
      - id: run_search
        type: use_widget
        args:
          widget: outlook.search
          op: fill
          inputs:
            value: "{{inputs.query}}"
    outcomes:
      - action: searched
        signal:
          type: selector_appears
          selector: "button[aria-label='Exit search']"
          timeout_ms: 8000
        extract:
          searched:
            literal: true
