_meta:
  name: manifests/coffee/actions/search_objects.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude (propose-observe)
  authored_at: 2026-07-09
  description: |
    search_objects - object-generic search. Browser: fill the list search box -> live typeahead results (div.z-50). Live-observed on People 2026-07-09.

description: Search records of any coffee object type.
object: "{{inputs.object}}"
object_types: [Person, Company, Deal, Task, Note]
commits_changes: false
depends_on_view: ObjectList
inputs:
  object: { type: text, required: true, sample: Person }
  query: { type: text, required: true, sample: Sarah }
  limit: { type: number, required: false, sample: 20 }
result:
  outcome: text
  records: { schema_list_union: [Person, Company, Deal, Task, Note] }
flavors:
  browser:
    requires_auth: session_cookie
    label: Search the object list via its search box
    signals:
      results_shown: { type: selector_appears, selector: "div.z-50" }
    recipe:
      - { id: desc, type: resolve_object, args: { object: "{{inputs.object}}", verb: search } }
      - { id: goto, type: navigate, args: { url: "{instance.origin}/{{steps.desc.url_segment}}" } }
      - { id: search, type: use_widget, args: { widget: coffee.search_input, op: fill, value: "{{inputs.query}}" } }
    outcomes:
      - { action: searched, when: [results_shown] }
