_meta:
  name: manifests/asana/views/ProjectBoard.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-05-23
  description: |
    Project board view (app.asana.com/0/{projectId}/board). Kanban
    columns by section; cards are draggable.

name: ProjectBoard

entry:
  url: "https://app.asana.com/0/{project_id}/board"
landmark_probe:
  selector: "[class*='BoardColumn'], [data-testid='board-column']"
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: "/0/[0-9]+/board"
  - type: selector_appears
    selector: "[class*='BoardColumn'], [data-testid='board-column']"
    timeout_ms: 12000
placeholders:
  project_id:
    type: text
    sample: "1213754599092608"
widgets:
  - asana.global_search
  - asana.quick_add
  - asana.add_task_button
  - asana.task_row_link
