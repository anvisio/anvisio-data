_meta:
  name: manifests/jobber/views/ClientsList.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    The Clients index (/clients) — the browser search_clients landmark + the
    entry point to the New Client form. Carries the clients table + a search box.
  changelog:
    - "0.1.0 (2026-07-08): initial. entry /clients; landmark = the clients table
       (selector best-guess; confirm on a live list-render pass)."

name: ClientsList

entry:
  url: "{instance.origin}/clients"
landmark_probe:
  selector: "[data-testid='clients-table'], table, h1"
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: "/clients(?:$|[/?])"
  - type: selector_appears
    selector: "[data-testid='clients-table'], table, h1"
    timeout_ms: 12000
widgets: []
