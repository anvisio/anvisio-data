_meta:
  name: manifests/jobber/views/ClientRecord.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    A single Client's detail page (/clients/{id}). The landing after a create,
    and the browser get_client landmark. Header is the client name (h1).
  changelog:
    - "0.1.0 (2026-07-08): initial. entry /clients/{client_id}; landmark = h1."

name: ClientRecord

entry:
  url: "{instance.origin}/clients/{client_id}"
landmark_probe:
  selector: "h1"
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: "/clients/[0-9]+"
  - type: selector_appears
    selector: "h1"
    timeout_ms: 12000
placeholders:
  client_id:
    type: text
    sample: "12345678"
