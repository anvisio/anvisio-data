_meta:
  name: manifests/jobber/views/NewJobForm.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    The New Job form (/jobs/new — best-guess URL, FLAGGED). create_job's browser
    launch surface: Atlantis label-XPath text inputs (title/instructions), a
    type-to-search property picker, and a Save button. Needs a live create to
    confirm the URL, field labels, the picker, and the Save affordance.
  changelog:
    - "0.1.0 (2026-07-08): initial (FLAGGED). entry /jobs/new; landmark = Save."

name: NewJobForm

entry:
  url: "{instance.origin}/jobs/new"
landmark_probe:
  selector: "xpath=//button[contains(normalize-space(),\"Save\")]"
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: "/jobs/new"
  - type: selector_appears
    selector: "xpath=//button[contains(normalize-space(),\"Save\")]"
    timeout_ms: 12000
widgets:
  - jobber.text_input
  - jobber.job_property_picker
  - jobber.save_job
  - jobber.cancel_button
