_meta:
  name: manifests/jobber/views/ClientEditForm.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    The client edit form (/clients/{id}/edit — best-guess URL, FLAGGED). The
    launch-contract surface for update_client's browser flavor: the same
    label-XPath text inputs as the New Client form, pre-filled, with a Save
    button. Reached by a direct URL nav. Needs a live edit to confirm the URL
    + the Save affordance (the create form uses "Save client"; the edit form
    may differ).
  changelog:
    - "0.1.0 (2026-07-08): initial (FLAGGED). entry /clients/{client_id}/edit;
       landmark = the Save button. URL + affordance unconfirmed."

name: ClientEditForm

entry:
  url: "{instance.origin}/clients/{client_id}/edit"
landmark_probe:
  selector: "xpath=//button[normalize-space()=\"Save client\"]"
  timeout_ms: 15000
verify:
  - type: url_matches
    pattern: "/clients/[0-9]+/edit"
  - type: selector_appears
    selector: "xpath=//button[normalize-space()=\"Save client\"]"
    timeout_ms: 12000
placeholders:
  client_id:
    type: text
    sample: "12345678"
widgets:
  - jobber.text_input
  - jobber.save_client
  - jobber.cancel_button
