_meta:
  name: manifests/jobber/actions/get_client.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    get_client atom — fetch one Jobber Client by id. Read-only. Two doors:
    session_api (kind: graphql, cookie-authed, the internal api.getjobber.com
    endpoint) and browser (open the client's page). oauth_api is deliberately
    NOT authored (see jobber.md — the Developer Center is a separate account
    and session_api reaches the same schema).
  changelog:
    - "0.1.0 (2026-07-08): initial. session_api inline GraphQL query grounded in
       live introspection (client(id: EncodedId!)); browser navigates jobberWebUri."

description: >
  Fetch a single Jobber Client by id, returning its core fields.
object: Client
commits_changes: false
depends_on_view: any
inputs:
  client_id:
    type: text
    required: true
    description: The Client's opaque EncodedId.
    sample: "Z2lkOi8vSm9iYmVyL0NsaWVudC8x"
result:
  client:
    schema: Client

flavors:
  session_api:
    requires_auth: session_cookie
    label: GraphQL client(id) via the session cookie (api.getjobber.com)
    recipe:
      - id: gql_get
        type: call_platform_api
        args:
          api_def:
            kind: graphql
            endpoint: "https://api.getjobber.com/api/graphql"
            operation_name: AnvisioGetClient
            extract_path: data.client
            headers:
              x-jobber-graphql-version: "2026-05-12"
            query: >
              query AnvisioGetClient($id: EncodedId!) {
                client(id: $id) {
                  id name firstName lastName companyName isCompany title
                  email phone balance isArchived leadSource createdAt jobberWebUri
                }
              }
          args:
            id: "{{inputs.client_id}}"
    outcomes:
      - action: fetched
        signal:
          type: url_matches
          pattern: "getjobber\\.com"
          timeout_ms: 10000
        extract:
          client:
            from_step: gql_get
            path: ""

  browser:
    requires_auth: session_cookie
    label: Open the client's record page + landmark the header
    recipe:
      - id: nav_client
        type: navigate
        args:
          url: "{instance.origin}/clients/{{inputs.client_id}}"
      - id: wait_header
        type: wait_for_element
        args:
          selector: "h1"
          timeout_ms: 10000
    outcomes:
      - action: fetched
        signal:
          type: selector_appears
          selector: "h1"
        extract:
          client:
            id:
              from_input: client_id
