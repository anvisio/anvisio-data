_meta:
  name: manifests/jobber/actions/search_properties.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    search_properties atom — find Properties by term. Read-only. session_api
    (kind: graphql, `properties(searchTerm, first)` Relay connection) + browser.
    Grounded in live introspection (properties query args: searchTerm:String,
    first:Int → nodes{}). NOTE: Jobber has no global properties LIST page (they
    live under clients), so the browser fallback lands on the clients index.
  changelog:
    - "0.1.0 (2026-07-08): initial. Relay connection, extract data.properties.nodes.
       browser fallback FLAGGED (no standalone properties UI)."

description: >
  Search Jobber Properties by a free-text term (e.g. an address), returning
  matching properties (id + address + owning client).
object: Property
commits_changes: false
depends_on_view: any
inputs:
  query:
    type: text
    required: true
    description: Address or free-text search term.
    sample: "Riverside"
  limit:
    type: number
    required: false
    default: 25
    description: Max results (Relay `first`).
result:
  properties:
    schema_list: Property

flavors:
  session_api:
    requires_auth: session_cookie
    label: GraphQL properties(searchTerm, first) via the session cookie
    recipe:
      - id: gql_search
        type: call_platform_api
        args:
          api_def:
            kind: graphql
            endpoint: "https://api.getjobber.com/api/graphql"
            operation_name: AnvisioSearchProperties
            extract_path: data.properties.nodes
            headers:
              x-jobber-graphql-version: "2026-05-12"
            query: >
              query AnvisioSearchProperties($searchTerm: String, $first: Int) {
                properties(searchTerm: $searchTerm, first: $first) {
                  nodes {
                    id name jobberWebUri
                    address { street1 city province postalCode }
                    client { id name }
                  }
                }
              }
          args:
            searchTerm: "{{inputs.query}}"
            first: "{{inputs.limit}}"
    outcomes:
      - action: searched
        signal:
          type: url_matches
          pattern: "getjobber\\.com"
          timeout_ms: 10000
        extract:
          properties:
            from_step: gql_search
            path: ""

  browser:
    requires_auth: session_cookie
    label: Open the clients index (properties have no standalone list page)
    # FLAGGED: Jobber has no global properties list; the fallback lands on the
    # clients index. session_api is the real path.
    recipe:
      - id: nav_clients
        type: navigate
        args:
          url: "{instance.origin}/clients?search={{inputs.query}}"
      - id: wait_list
        type: wait_for_element
        args:
          selector: "[data-testid='clients-table'], table, h1"
          timeout_ms: 10000
    outcomes:
      - action: searched
        signal:
          type: selector_appears
          selector: "[data-testid='clients-table'], table, h1"
        extract:
          properties:
            from_input: query
