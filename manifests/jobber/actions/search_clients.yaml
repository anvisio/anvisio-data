_meta:
  name: manifests/jobber/actions/search_clients.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    search_clients atom — find Clients by name/term. Read-only. session_api
    (kind: graphql, `clients(searchTerm, first)` Relay connection) + browser
    (the clients list with the search box). Grounded in live introspection
    (clients query args: searchTerm:String, first:Int → nodes{}).
  changelog:
    - "0.1.0 (2026-07-08): initial. Relay connection, extract data.clients.nodes."

description: >
  Search Jobber Clients by a name or free-text term, returning matching
  clients (id + name + core fields).
object: Client
commits_changes: false
depends_on_view: any
inputs:
  query:
    type: text
    required: true
    description: Name or free-text search term.
    sample: "Acme"
  limit:
    type: number
    required: false
    default: 25
    description: Max results (Relay `first`).
result:
  clients:
    schema_list: Client

flavors:
  session_api:
    requires_auth: session_cookie
    label: GraphQL clients(searchTerm, first) via the session cookie
    recipe:
      - id: gql_search
        type: call_platform_api
        args:
          api_def:
            kind: graphql
            endpoint: "https://api.getjobber.com/api/graphql"
            operation_name: AnvisioSearchClients
            extract_path: data.clients.nodes
            headers:
              x-jobber-graphql-version: "2026-05-12"
            query: >
              query AnvisioSearchClients($searchTerm: String, $first: Int) {
                clients(searchTerm: $searchTerm, first: $first) {
                  nodes { id name firstName lastName companyName isCompany email phone }
                }
              }
          args:
            searchTerm: "{{inputs.query}}"
            first: "{{inputs.limit}}"
    outcomes:
      - action: searched
        signal:
          type: url_matches
          pattern: "getjobber\\.com"
          timeout_ms: 10000
        extract:
          clients:
            from_step: gql_search
            path: ""

  browser:
    requires_auth: session_cookie
    label: Open the clients list filtered by the search term
    recipe:
      - id: nav_clients
        type: navigate
        args:
          url: "{instance.origin}/clients?search={{inputs.query}}"
      - id: wait_list
        type: wait_for_element
        args:
          selector: "[data-testid='clients-table'], table, h1"
          timeout_ms: 10000
    outcomes:
      - action: searched
        signal:
          type: selector_appears
          selector: "[data-testid='clients-table'], table, h1"
        extract:
          clients:
            from_input: query
