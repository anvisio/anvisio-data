_meta:
  name: manifests/jobber/actions/delete_object.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    delete_object — the OBJECT-GENERIC delete atom (Rule Q). ONE atom deletes any
    Jobber object; the per-object GraphQL (<object>Delete + id arg) lives in each
    schema's `graphql.delete` descriptor. Writes prefer browser > session_api so
    the user sees the confirm. NOTE: some Jobber deletes are ASYNC (clientDelete
    cascades over a few seconds) — the outcome fires on mutation success.
  changelog:
    - "0.1.0 (2026-07-08): initial. Replaces delete_client. session_api =
       resolve_object → call_platform_api; browser = record-page action menu →
       Delete → confirm (FLAGGED generic widgets)."

description: Delete any Jobber object (Client, Property, Job, Quote, Invoice, Request, Visit).
object: "{{inputs.object}}"
object_types: [Client, Property, Job, Quote, Invoice, Request, Visit]
commits_changes: true
depends_on_view: any
inputs:
  object:
    type: text
    required: true
    sample: Client
  record_id:
    type: text
    required: true
    sample: "MTQ1NjU3MTMx"
result:
  outcome: text
  record_id: text
  record:
    schema_union: [Client, Property, Job, Quote, Invoice, Request, Visit]

flavors:
  browser:
    requires_auth: session_cookie
    label: Open the object's action menu; Delete; confirm when commit:true
    # FLAGGED: the record-page action menu + Delete/Archive item + confirm dialog
    # + deleted toast are best-guess per object. session_api is the proven path.
    signals:
      deleted_toast:
        type: transient_appears
        selector: "[role=alert], .toast, [data-testid='toast']"
        must_contain_text: "deleted"
      dialog_closed:
        type: selector_disappears
        selector: "[role=dialog], .modal"
    recipe:
      - id: desc
        type: resolve_object
        args:
          object: "{{inputs.object}}"
          verb: delete
      - id: nav
        type: navigate
        args:
          url: "{instance.origin}/{{steps.desc.url_segment}}/{{inputs.record_id}}"
      - id: open_menu
        type: use_widget
        args:
          widget: jobber.object_actions_menu
          op: invoke
      - id: click_delete
        type: use_widget
        args:
          widget: jobber.delete_menu_item
          op: invoke
      - id: confirm
        type: use_widget
        commit: true
        args:
          widget: jobber.delete_confirm
          op: invoke
    outcomes:
      - action: deleted
        when: [deleted_toast]
        extract:
          record_id:
            from_input: record_id
          record:
            id:
              from_input: record_id
      - action: cancelled
        when: [dialog_closed]
        not: [deleted_toast]

  session_api:
    requires_auth: session_cookie
    label: GraphQL <object>Delete via the session cookie (resolve_object dispatch)
    recipe:
      - id: desc
        type: resolve_object
        args:
          object: "{{inputs.object}}"
          verb: delete
      - id: gql
        type: call_platform_api
        args:
          api_def:
            kind: graphql
            endpoint: "https://api.getjobber.com/api/graphql"
            query: "{{steps.desc.query}}"
            extract_path: "{{steps.desc.extract_path}}"
            reject_path: "{{steps.desc.reject_path}}"
            headers:
              x-jobber-graphql-version: "2026-05-12"
          args: "{{steps.desc.variables}}"
    outcomes:
      - action: deleted
        signal:
          type: url_matches
          pattern: "getjobber\\.com"
          timeout_ms: 10000
        extract:
          record_id:
            from_input: record_id
          record:
            id:
              from_input: record_id
