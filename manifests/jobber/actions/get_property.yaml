_meta:
  name: manifests/jobber/actions/get_property.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    get_property atom — fetch one Jobber Property by id. Read-only. session_api
    (kind: graphql, property(id: EncodedId!)) + browser (open the property page).
    The read exposes the owning `client { id }` (the up-ref) + the nested address.
  changelog:
    - "0.1.0 (2026-07-08): initial. session_api property(id) grounded in live
       introspection; browser deeplink FLAGGED (properties live at the nested
       /clients/{clientId}/properties/{id}; the flat /properties/{id} deeplink
       may redirect — confirm live)."

description: >
  Fetch a single Jobber Property by id, returning its address, owning client, and
  core fields.
object: Property
commits_changes: false
depends_on_view: any
inputs:
  property_id:
    type: text
    required: true
    description: The Property's opaque EncodedId.
    sample: "MTUyMTU2OTU1"
result:
  property:
    schema: Property

flavors:
  session_api:
    requires_auth: session_cookie
    label: GraphQL property(id) via the session cookie
    recipe:
      - id: gql_get
        type: call_platform_api
        args:
          api_def:
            kind: graphql
            endpoint: "https://api.getjobber.com/api/graphql"
            operation_name: AnvisioGetProperty
            extract_path: data.property
            headers:
              x-jobber-graphql-version: "2026-05-12"
            query: >
              query AnvisioGetProperty($id: EncodedId!) {
                property(id: $id) {
                  id name routingOrder isBillingAddress createdAt jobberWebUri
                  address { street1 street2 city province postalCode country }
                  client { id name }
                }
              }
          args:
            id: "{{inputs.property_id}}"
    outcomes:
      - action: fetched
        signal:
          type: url_matches
          pattern: "getjobber\\.com"
          timeout_ms: 10000
        extract:
          property:
            from_step: gql_get
            path: ""

  browser:
    requires_auth: session_cookie
    label: Open the property's record page + landmark the header
    # FLAGGED: properties live at /clients/{clientId}/properties/{id}; the flat
    # deeplink may redirect. Fallback only — session_api is the path.
    recipe:
      - id: nav_property
        type: navigate
        args:
          url: "{instance.origin}/properties/{{inputs.property_id}}"
      - id: wait_header
        type: wait_for_element
        args:
          selector: "h1, h2"
          timeout_ms: 10000
    outcomes:
      - action: fetched
        signal:
          type: selector_appears
          selector: "h1, h2"
        extract:
          property:
            id:
              from_input: property_id
