_meta:
  name: manifests/jobber/actions/create_property.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    create_property atom — add a Property (service location) to a Client. The
    Property → Client reference: propertyCreate takes a top-level `clientId` arg
    (PropertyCreateInput wraps `properties: [PropertyAttributes!]`, each with a
    required `address`). Writes prefer browser > session_api. session_api posts
    propertyCreate; browser fills the client's "Add Property" form + Save.
    First slice = the address + optional name; contacts/customFields/taxRate
    are deferred.
  changelog:
    - "0.1.0 (2026-07-08): initial. session_api propertyCreate(clientId, input:
       {properties:[{address, name}]}) grounded in live introspection
       (PropertyCreatePayload{client, properties, userErrors}); reject_path
       data.propertyCreate.userErrors → invalid_input. browser new-property form
       FLAGGED (the URL + field labels + Save affordance need a live create)."

description: Create a Property (service location) under an existing Client.
object: Property
commits_changes: true
depends_on_view: NewPropertyForm
inputs:
  client_id:
    type: text
    required: true
    ref: Client.id
    description: The owning Client's opaque EncodedId (propertyCreate `clientId`).
    sample: "MTQ1NjU3MTMx"
  street1:
    type: text
    required: false
    sample: "123 Main St"
  street2:
    type: text
    required: false
  city:
    type: text
    required: false
    sample: "Austin"
  province:
    type: text
    required: false
    sample: "TX"
  postal_code:
    type: text
    required: false
    sample: "78701"
  country:
    type: text
    required: false
    sample: "United States"
  name:
    type: text
    required: false
    description: Optional label for the property.
result:
  outcome: text
  record_id: text
  property:
    schema: Property

flavors:
  browser:
    requires_auth: session_cookie
    label: Fill the client's Add Property form; Save when commit:true
    # FLAGGED: the new-property URL (/clients/{client_id}/properties/new best-guess),
    # the address field labels, and the Save affordance need a live create.
    signals:
      created_nav:
        type: url_matches
        pattern: "/properties/(?<record_id>[0-9]+)(?:$|[/?])"
        extract:
          record_id:
            from_url_match: record_id
      abandon:
        type: selector_disappears
        selector: "xpath=//button[contains(normalize-space(),\"Save\")]"
    recipe:
      - id: fill_fields
        type: fill_fields
        args:
          object: Property
          from:
            street1: "{{inputs.street1}}"
            city: "{{inputs.city}}"
            province: "{{inputs.province}}"
            postalCode: "{{inputs.postal_code}}"
      - id: click_save
        type: use_widget
        commit: true
        args:
          widget: jobber.save_property
          op: invoke
    outcomes:
      - action: created
        when: [created_nav]
        extract:
          record_id:
            from_signal: created_nav.record_id
          property:
            id:
              from_signal: created_nav.record_id
            clientId:
              from_input: client_id
      - action: cancelled
        when: [abandon]
        not: [created_nav]

  session_api:
    requires_auth: session_cookie
    label: GraphQL propertyCreate(clientId, input) via the session cookie
    recipe:
      - id: gql_create
        type: call_platform_api
        args:
          api_def:
            kind: graphql
            endpoint: "https://api.getjobber.com/api/graphql"
            operation_name: AnvisioCreateProperty
            extract_path: data.propertyCreate
            # A non-empty userErrors array on the 200 → invalid_input. Rule S.
            reject_path: data.propertyCreate.userErrors
            headers:
              x-jobber-graphql-version: "2026-05-12"
            query: >
              mutation AnvisioCreateProperty($clientId: EncodedId!, $input: PropertyCreateInput!) {
                propertyCreate(clientId: $clientId, input: $input) {
                  client { id }
                  properties {
                    id name
                    address { street1 street2 city province postalCode country }
                  }
                  userErrors { message path }
                }
              }
          args:
            clientId: "{{inputs.client_id}}"
            input:
              properties:
                - name: "{{inputs.name}}"
                  address:
                    street1: "{{inputs.street1}}"
                    street2: "{{inputs.street2}}"
                    city: "{{inputs.city}}"
                    province: "{{inputs.province}}"
                    postalCode: "{{inputs.postal_code}}"
                    country: "{{inputs.country}}"
    outcomes:
      - action: created
        signal:
          type: url_matches
          pattern: "getjobber\\.com"
          timeout_ms: 10000
        extract:
          record_id:
            from_step: gql_create
            path: properties[0].id
          property:
            from_step: gql_create
            path: properties[0]
