_meta:
  name: manifests/jobber/actions/get_job.yaml
  version: 0.1.0
  cdn_schema_version: 70.0.0
  authored_by: cd2k + claude
  authored_at: 2026-07-08
  description: |
    get_job atom — fetch one Jobber Job by id. Read-only. session_api (kind:
    graphql, job(id: EncodedId!)) + browser (open the job page). The read exposes
    BOTH `client { id }` and `property { id }` — the two hops of the reference
    chain, used by the CRUDS run-chain link assertion.
  changelog:
    - "0.1.0 (2026-07-08): initial. session_api job(id) grounded in live
       introspection; browser deeplink FLAGGED (job URL is /jobs/{id} best-guess;
       Jobber's internal term is 'work order' — the created job's jobberWebUri
       confirms the real path)."

description: >
  Fetch a single Jobber Job by id, returning its title/status/schedule plus the
  owning client and property (both ids — the reference chain).
object: Job
commits_changes: false
depends_on_view: any
inputs:
  job_id:
    type: text
    required: true
    description: The Job's opaque EncodedId.
    sample: "Z2lkOi8vSm9iYmVyL0pvYi8x"
result:
  job:
    schema: Job
  # The reference chain surfaced FLAT (from the nested job.client.id /
  # job.property.id) — lets a caller resolve Job → Client / Job → Property
  # without walking the nested object. Populated by session_api; the browser
  # fallback lands on the page only (no flat ids).
  client_id: text
  property_id: text

flavors:
  session_api:
    requires_auth: session_cookie
    label: GraphQL job(id) via the session cookie
    recipe:
      - id: gql_get
        type: call_platform_api
        args:
          api_def:
            kind: graphql
            endpoint: "https://api.getjobber.com/api/graphql"
            operation_name: AnvisioGetJob
            extract_path: data.job
            headers:
              x-jobber-graphql-version: "2026-05-12"
            query: >
              query AnvisioGetJob($id: EncodedId!) {
                job(id: $id) {
                  id jobNumber title jobStatus jobType instructions
                  startAt endAt total createdAt jobberWebUri
                  client { id name }
                  property { id name address { street1 city province } }
                }
              }
          args:
            id: "{{inputs.job_id}}"
    outcomes:
      - action: fetched
        signal:
          type: url_matches
          pattern: "getjobber\\.com"
          timeout_ms: 10000
        extract:
          job:
            from_step: gql_get
            path: ""
          client_id:
            from_step: gql_get
            path: client.id
          property_id:
            from_step: gql_get
            path: property.id

  browser:
    requires_auth: session_cookie
    label: Open the job's record page + landmark the header
    # Job web URL is /work_orders/{NUMERIC id} — LIVE-CONFIRMED 2026-07-08 from a
    # created job's jobberWebUri (https://secure.getjobber.com/work_orders/150333161).
    # ID-GRAIN SEAM (FLAGGED): job_id is the API EncodedId (e.g. MTUwMzMzMTYx) but the
    # URL needs the base64-DECODED numeric (150333161). This nav interpolates the
    # EncodedId → wrong URL; the robust fix (decode, or navigate a prior read's
    # jobberWebUri) is the browser-hardening follow-on. session_api job(id) is the path.
    recipe:
      - id: nav_job
        type: navigate
        args:
          url: "{instance.origin}/work_orders/{{inputs.job_id}}"
      - id: wait_header
        type: wait_for_element
        args:
          selector: "h1, h2"
          timeout_ms: 10000
    outcomes:
      - action: fetched
        signal:
          type: selector_appears
          selector: "h1, h2"
        extract:
          job:
            id:
              from_input: job_id
