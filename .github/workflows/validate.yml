# Validates every PR against CI gates 1-4, 6-8 from spec 60.3 §13.6.
# Gate 5 (manifest test catalog replay) lives in live-test.yml.
#
# Runs in `pull_request` mode (sandboxed) so first-time contributor PRs
# cannot exfiltrate secrets via malicious workflow edits.
#
# All gates must pass for merge. Override labels (gate-override: size,
# gate-override: license) require maintainer approval.

name: Validate

on:
  pull_request:
    branches: [main, beta, release]
    paths:
      - 'prompts/**'
      - 'widget-libraries/**'
      - 'schemas/**'
      - 'tools/**'
      - 'manifests/**'

# The "Comment gate digest on PR" step calls github.rest.issues.createComment,
# which requires pull-requests:write. Default GITHUB_TOKEN scope on forked PRs
# is read-only and 403s without this block.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for version-bump diff

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CI helpers (pinned via tools-build/package.json)
        run: cd tools-build && npm install --no-audit --no-fund

      # Pass PR labels to CI scripts so gate-override:* labels can bypass
      # specific gates (size, pii). Format: comma-separated list.
      - name: Resolve PR labels
        id: labels
        run: |
          labels=$(jq -r '[.labels[].name] | join(",")' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
          echo "PR_LABELS=$labels" >> $GITHUB_ENV

      # ───────── Gate 1 — Frontmatter ──────────
      - name: Gate 1 - Frontmatter
        run: node tools-build/ci/check-frontmatter.mjs

      # ───────── Gate 2 — Schema ──────────
      - name: Gate 2 - Schema
        run: node tools-build/ci/check-schema.mjs

      # ───────── Gate 3 — Version bump ──────────
      - name: Gate 3 - Version bump rule
        run: node tools-build/ci/check-version-bump.mjs

      # ───────── Gate 4 — Cross-ref integrity ──────────
      - name: Gate 4 - Cross-ref integrity
        run: node tools-build/ci/check-cross-refs.mjs

      # ───────── Gate 6 — License ──────────
      # Currently a no-op stub (license deferred during bootstrap phase).
      - name: Gate 6 - License
        run: node tools-build/ci/check-license.mjs

      # ───────── Gate 7 — PII scrub ──────────
      - name: Gate 7 - PII scrub
        run: node tools-build/ci/check-pii.mjs

      # ───────── Gate 8 — Size ──────────
      - name: Gate 8 - Size
        run: node tools-build/ci/check-size.mjs

      # ───────── Summary ──────────
      # Comment a digest on the PR with each gate's status.
      - name: Comment gate digest on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('ci-summary.md')
              ? fs.readFileSync('ci-summary.md', 'utf8')
              : '(no summary written)';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CI gate summary\n\n${summary}`,
            });
