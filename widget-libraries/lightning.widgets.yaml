_meta:
  name: widget-libraries/lightning.widgets.yaml
  version: 1.0.0
  cdn_schema_version: 60.3.0
  authored_by: cd2k + claude
  authored_at: 2026-05-04
  description: Salesforce Lightning widget seed library (9 widgets, all SF orgs reuse via `extends:`)
  archetypes_used: [text_input, combobox, typeahead, modal_button, menu_action]
  changelog:
    - 1.0.0 (2026-05-04): initial seed (9 widgets, archetype-tagged)

# ─── Salesforce Lightning widget seed library ─────────────────────────
# Drop-in widget definitions for ANY Salesforce Lightning org. Per-org
# `manifests/<sf-org>/widgets.yaml` files reference this file via
# `extends: _widget_libraries/lightning.widgets.yaml` and inherit all
# definitions below. Per-org files can add custom widgets / override
# defaults_by_type for custom field types (rare).
#
# The seed library serves the iterate-saas-v2 onboarding flow: a fresh
# SF org points at this file and gets the proven 9-widget set without
# re-deriving them via heal cycles. Future Outlook / Gmail / HubSpot
# libraries will live alongside (`outlook.widgets.yaml`, etc.).
#
# ─── Widget archetype convention (added 2026-05-05) ───────────────────
# Each widget below carries an `archetype:` tag declaring which generic
# UI archetype it implements. Pure metadata today (no runtime behavior);
# the propose/heal prompts in Phase 5/6 use it as a vocabulary anchor.
#
# Taxonomy (lock when N >= 3):
#   text_input   — single primitive fill + value-equals verify.
#                  Covers any single-line text/url/phone/email/number
#                  control.
#   combobox     — closed-set selection. Click trigger → wait listbox →
#                  click option → verify list closes + label matches.
#   typeahead    — open-set / async lookup. Focus → type → wait results
#                  → click result → verify dropdown closes.
#   modal_button — click button inside a dialog → verify dialog
#                  disappears. Covers Save / Cancel / Confirm / Discard
#                  / X close. Op name (`submit:` / `dismiss:` /
#                  `confirm:`) communicates intent.
#   menu_action  — open menu → click menu item → verify next-state
#                  element appears. Covers row-action menus, kebab
#                  menus, button-menu reveals.
#
# Revisit plan: after Gmail + Calendar (Phase 7) and Outlook + HubSpot
# (Phase 8) widgets are authored, audit whether the archetypes are
# stable across N >= 3 apps. If yes, extract into a shared archetype
# library (`manifest-redesign/manifests/_archetypes/`) with per-app
# selector overlays. If no, drop the tag and keep widgets per-app.
# See manifest-redesign/README.md for the full revisit checklist.
defaults_by_type:
  text: lightning.text
  url: lightning.text
  phone: lightning.text
  email: lightning.text
  textarea: lightning.text
  number: lightning.text
  picklist: lightning.picklist
  id: lightning.lookup
widgets:
  lightning.text:
    archetype: text_input
    fill:
      - id: type_value
        type: fill_text
        args:
          selector:
            - input[name='{{field_name}}']
            - lightning-input input[name='{{field_name}}']
            - "[data-fieldname='{{field_name}}'] input"
          value: "{{value}}"
        verify:
          type: element_value_equals
          selector: input[name='{{field_name}}']
          value: "{{value}}"
          timeout_ms: 2000
    read:
      - id: extract_value
        type: read_text
        args:
          selector:
            - "[data-output-element-id='output-field-{{field_name}}']"
            - lightning-formatted-text[data-output-element-id='output-field-{{field_name}}']
  lightning.picklist:
    archetype: combobox
    fill:
      - id: open_dropdown
        type: click
        args:
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              button[role='combobox']"
            - button[role='combobox'][name='{{field_name}}']
            - lightning-combobox[name='{{field_name}}'] button[role='combobox']
        verify:
          type: selector_attribute_equals
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              button[role='combobox']"
            - button[role='combobox'][name='{{field_name}}']
          attribute: aria-expanded
          value: "true"
          timeout_ms: 5000
      - id: wait_for_options
        type: wait_for_element
        args:
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              lightning-base-combobox-item[data-value='{{value}}']"
            - lightning-base-combobox-item[data-value='{{value}}']
            - "[role='listbox'] [role='option']:has-text('{{value}}')"
          timeout_ms: 5000
      - id: select_option
        type: click
        args:
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              lightning-base-combobox-item[data-value='{{value}}']"
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              [role='option'][data-value='{{value}}']"
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              [role='option']:has-text('{{value}}')"
        verify:
          all:
            - type: selector_disappears
              selector: "[role='listbox']"
              timeout_ms: 2000
            - type: selector_text_equals
              selector:
                - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_nam\
                  e}}'] button[role='combobox']"
                - button[role='combobox'][name='{{field_name}}']
              contains: "{{value}}"
              timeout_ms: 2000
    read:
      - id: extract_picklist_value
        type: read_text
        args:
          selector:
            - "[data-output-element-id='output-field-{{field_name}}']"
            - button[role='combobox'][name='{{field_name}}']
  lightning.lookup:
    archetype: typeahead
    fill:
      - id: focus
        type: click
        args:
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              input[role='combobox']"
            - input[role='combobox'][name='{{field_name}}']
            - lightning-input-field[field-name='{{field_name}}'] input[role='combobox']
        verify:
          type: selector_attribute_equals
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              input[role='combobox']"
            - input[role='combobox'][name='{{field_name}}']
          attribute: aria-expanded
          value: "true"
          timeout_ms: 8000
      - id: type_query
        type: type_sequentially
        args:
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              input[role='combobox']"
            - input[role='combobox'][name='{{field_name}}']
          value: "{{value}}"
          delay_ms: 50
        verify:
          type: element_value_equals
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              input[role='combobox']"
            - input[role='combobox'][name='{{field_name}}']
          value: "{{value}}"
          timeout_ms: 2000
      - id: wait_results
        type: wait_for_element
        args:
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              lightning-base-combobox-item[data-value]:not([data-value^='action'])"
            - lightning-base-combobox-item[data-value]:not([data-value^='action'])
          timeout_ms: 10000
      - id: pick_result
        type: click
        args:
          selector:
            - lightning-base-combobox-item[data-value]:not([data-value^='action']):has-text('{{value}}')
            - lightning-base-combobox-item[data-value]:not([data-value^='action'])
        verify:
          type: selector_attribute_equals
          selector:
            - "[data-target-selection-name='sfdc:RecordField.{{inputs.object_type}}.{{field_name}}']
              input[role='combobox']"
            - input[role='combobox'][name='{{field_name}}']
          attribute: aria-expanded
          value: "false"
          timeout_ms: 5000
    read:
      - id: extract_lookup_id
        type: read_attribute
        args:
          selector: "[data-output-element-id='output-field-{{field_name}}'] a"
          attribute: data-recordid
  lightning.modal_save:
    archetype: modal_button
    submit:
      - id: click_save
        type: click
        args:
          selector:
            - "[role='dialog'] button[name='SaveEdit']"
            - section[role='dialog'] button[name='SaveEdit']
        verify:
          type: selector_disappears
          selector: "[role='dialog']"
          timeout_ms: 10000
  lightning.modal_cancel:
    archetype: modal_button
    # Matches BOTH the explicit Cancel button AND the X close icon —
    # both dismiss the create/edit modal without saving. SF's SLDS
    # standardizes the X icon as `button.slds-modal__close` across all
    # modal types (edit, new-record, delete confirm, etc.).
    dismiss:
      - id: click_cancel
        type: click
        args:
          selector:
            - "[role='dialog'] button[name='CancelEdit']"
            - "section[role='dialog'] button[name='CancelEdit']"
            - "[role='dialog'] button.slds-modal__close"
            - "section[role='dialog'] button.slds-modal__close"
        verify:
          type: selector_disappears
          selector: "[role='dialog']"
          timeout_ms: 5000
  lightning.modal_close:
    archetype: modal_button
    # Explicit X-close-icon widget for use_widget invocation. SLDS
    # standardizes button.slds-modal__close as the X icon across edit,
    # new-record, delete confirm, and other modal types — so this widget
    # works against whichever SLDS modal is currently open. modal_cancel
    # is the POLYMORPHIC dismiss form (matches Cancel button + X);
    # modal_close is the EXPLICIT-X form so auto-driven tests can
    # validate the X path independently of the Cancel-button path.
    dismiss:
      - id: click_x
        type: click
        args:
          selector:
            - "[role='dialog'].slds-modal button.slds-modal__close"
            - "[role='dialog'] button.slds-modal__close"
            - "section[role='dialog'] button.slds-modal__close"
        verify:
          type: selector_disappears
          selector: "[role='dialog']"
          timeout_ms: 5000
  lightning.delete_button:
    archetype: menu_action
    invoke:
      - id: open_action_menu
        type: click
        args:
          selector:
            - lightning-button-menu[data-target-reveals*='Delete'] button[aria-haspopup='true']
            - lightning-button-menu button[aria-haspopup='true']
        verify:
          # Verify the Delete menuitem APPEARS rather than checking
          # aria-expanded — survives SF's animation/blur quirks where the
          # button briefly toggles aria-expanded during menu open.
          type: selector_appears
          selector:
            - "lightning-button-menu[data-target-reveals*='Delete'] [title='Delete']"
            - "[role='menuitem'][title='Delete']"
          timeout_ms: 5000
      - id: click_delete_menuitem
        type: click
        args:
          selector:
            - lightning-button-menu[data-target-reveals*='Delete'] [title='Delete']
            - "[role='menuitem'][title='Delete']"
            - lightning-button-menu a:has-text('Delete')
        verify:
          # Wait for the delete confirm modal to appear. SF uses role='dialog'
          # with slds-modal class and contains a button[title='Delete'] action.
          type: selector_appears
          selector: "[role='dialog'].slds-modal:has(button[title='Delete'])"
          timeout_ms: 5000
  lightning.delete_confirm_modal:
    archetype: modal_button
    confirm:
      - id: click_confirm_delete
        type: click
        args:
          # Live SF inspection (2026-05-04): the delete confirm modal is
          # role='dialog' (NOT alertdialog), uses class slds-modal, and its
          # action buttons use title='Delete' / title='Cancel' (NOT name=).
          # The dialog has aria-labelledby pointing to a 'Delete <Object>'
          # heading rather than aria-label.
          selector:
            - "[role='dialog'].slds-modal button[title='Delete']"
            - "[role='dialog'] button.forceActionButton[title='Delete']"
            - "[role='dialog'] button[title='Delete']"
            - "[role='alertdialog'] button[title='Delete']"
        verify:
          type: selector_disappears
          selector: "[role='dialog'].slds-modal:has(button[title='Delete'])"
          timeout_ms: 10000
  lightning.delete_confirm_cancel:
    archetype: modal_button
    # Matches BOTH the explicit Cancel button AND the X close icon —
    # both dismiss the delete confirm modal without deleting. SF's
    # delete confirm modal uses role='dialog' + slds-modal class +
    # title='Cancel' on the action-bar Cancel button. The X is
    # button.slds-modal__close in the modal header.
    dismiss:
      - id: click_cancel_delete
        type: click
        args:
          selector:
            - "[role='dialog'].slds-modal button.forceActionButton[title='Cancel']"
            - "[role='dialog'].slds-modal button[title='Cancel']:not(.slds-modal__close)"
            - "[role='dialog'] button.forceActionButton[title='Cancel']"
            - "[role='alertdialog'] button[title='Cancel']"
            - "[role='dialog'].slds-modal button.slds-modal__close"
            - "[role='dialog'] button.slds-modal__close"
        verify:
          type: selector_disappears
          selector: "[role='dialog'].slds-modal:has(button[title='Delete'])"
          timeout_ms: 5000
