_meta:
  name: widget-libraries/gmail.widgets.yaml
  version: 3.0.0
  cdn_schema_version: 60.4.2
  authored_by: cd2k + claude
  authored_at: 2026-05-16
  description: |
    Gmail widget library, archetype-driven shape (v60.4).

    Every widget declares only:
      - archetype (one of the catalog names in
        widget-libraries/archetype-templates.yaml)
      - selectors (named per the archetype's required_selectors)
      - overrides (optional knobs the archetype's recipe consumes)
      - irreversible (optional safety flag)

    The runtime widget-archetype-resolver expands these into executable
    recipes at manifest-load time. Authoring 30 archetype-mapped widgets
    at this layer requires far fewer lines than v0.2.0's per-widget
    recipes — and a fix to a recipe template propagates to every widget
    that uses that archetype.

    Per-Gmail-instance `manifests/gmail/widgets.yaml` declares
    `extends: widget-libraries/gmail.widgets.yaml` and inherits all
    definitions below. Custom overlays (e.g. Workspace customer with a
    non-standard add-on) add per-instance overrides there.

    Source selectors are the v0.2.0 live-tested set (gmail Phase 5
    widget validation, 2026-05-10).

    4 widgets remain in LEGACY shape pending additional archetypes:
      - gmail.search_input: typeahead_search_click variant (click
        submit button vs. press Enter; 1 user; not worth a new
        archetype yet)
      - gmail.label_menu_search: typeahead_menu variant (no focus,
        verify by menu disappearance; 2 users)
      - gmail.move_menu_search: same as above
      - gmail.thread_reply_all_button: 2-step composite (open menu +
        click menuitem); doesn't fit a single archetype

  archetypes_used: [text_input, contenteditable_input, typeahead_chip, click_reveals, click_dismisses, click_navigates, click_toggles, read_text, read_attribute]

  changelog:
    - "3.0.0 (2026-05-16): MAJOR rewrite to archetype-driven shape. 30 widgets converted from v0.2.0's per-widget recipes (~655 lines) to { archetype, selectors, overrides }. The recipe bodies were structurally identical modulo selectors — duplication eliminated. 4 outlier widgets (search_input, label_menu_search, move_menu_search, thread_reply_all_button) remain in legacy shape; promoting them needs typeahead_search_click + typeahead_menu archetypes or a 2-step composite primitive (deferred — single-user patterns)."
    - "0.2.0 (2026-05-10): MAJOR bump. Healed against live gmail in Phase 5 widget validation. Replaces propose-authored seed with the live-DOM-verified shape. 11 widgets healed across 3 drift classes."
    - "0.1.0 (2026-05-07): initial seed extracted from manifest-redesign/manifests/gmail/widgets.yaml."

defaults_by_type:
  text: gmail.compose_subject_input
  email: gmail.compose_to_input
  rich_text: gmail.compose_body_editor

widgets:

  # ─── Compose toolbar / dialog open + close ────────────────────────

  gmail.compose_button:
    archetype: click_reveals
    selectors:
      trigger:
        - div[role='button'].T-I-KE.L3
        - div.z0 div[role='button'][tabindex='0']
      verify_target: div[role='dialog'], input[name='subjectbox']

  gmail.compose_close_button:
    archetype: click_dismisses
    selectors:
      trigger:
        - div[role='dialog'] img[aria-label='Save & close']
        - img[aria-label='Save & close'][data-tooltip='Save & close']
        - div[role='dialog'] img[alt='Close'][data-tooltip='Save & close']
      verify_target: div[role='dialog'] input[name='subjectbox']
    overrides:
      verify_timeout_ms: 6000

  # ─── Search (LEGACY: typeahead_search_click variant) ──────────────
  # TODO Phase 1b: add `typeahead_search_click` archetype (focus + type
  # + click submit + verify URL) — sole user today; not worth its own
  # archetype until a second SaaS surfaces the pattern.

  gmail.search_input:
    archetype: text_input
    fill:
      - id: focus_search
        type: click
        args:
          selector:
            - input[aria-label='Search mail'][name='q']
            - form[role='search'] input[name='q']
      - id: type_query
        type: fill_text
        args:
          selector:
            - input[aria-label='Search mail'][name='q']
          value: "{{value}}"
      - id: submit_query
        type: click
        args:
          selector:
            - form[role='search'] button[aria-label='Search mail'][role='button']
            - button.gb_Ve[aria-label='Search mail']
            - form#aso_search_form_anchor button[aria-label='Search mail']
        verify:
          type: url_matches
          pattern: "#search/.*"
          timeout_ms: 8000

  # ─── Thread list row interactions ─────────────────────────────────

  gmail.thread_row:
    archetype: click_reveals
    selectors:
      trigger:
        - tr.zA span.bog span[data-legacy-thread-id='{{thread_id}}']
        - tr.zA[id] span.bqe[data-legacy-thread-id='{{thread_id}}']
      verify_target: h2.hP, div[role='main'] div[data-legacy-thread-id]

  gmail.row_checkbox:
    archetype: click_toggles
    selectors:
      trigger:
        - tr.zA:has(span.bqe[data-legacy-thread-id='{{thread_id}}']) div[role='checkbox']
        - tr.zA:has(span[data-legacy-thread-id='{{thread_id}}']) div[role='checkbox']
      verify_target: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}']) div[role='checkbox']
    overrides:
      verify_attribute: aria-checked
      verify_value: "true"

  gmail.row_star_toggle:
    archetype: click_reveals
    selectors:
      trigger:
        - tr.zA:has(span[data-legacy-thread-id='{{thread_id}}']) span[role='button'].T-KT
        - tr.zA:has(span[data-legacy-thread-id='{{thread_id}}']) span.aXw
      verify_target: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}']) span.T-KT.T-KT-Jp,
        tr.zA:has(span[data-legacy-thread-id='{{thread_id}}']) span[aria-label='Not starred']

  # ─── Inbox toolbar buttons (operate on selected/open thread) ──────

  gmail.toolbar_archive_button:
    archetype: click_dismisses
    irreversible: true
    selectors:
      trigger:
        - div[role='button'][aria-label='Archive'][data-tooltip='Archive']
        - div.G-Ni div[role='button'][aria-label='Archive']
      verify_target: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])

  gmail.toolbar_delete_button:
    archetype: click_dismisses
    irreversible: true
    selectors:
      trigger:
        - div[role='button'][aria-label='Delete'][data-tooltip*='Delete']
        - div.G-Ni div[role='button'][aria-label='Delete']
      verify_target: tr.zA:has(span[data-legacy-thread-id='{{thread_id}}'])

  gmail.toolbar_mark_read_button:
    archetype: click_reveals
    irreversible: true
    selectors:
      trigger:
        - div[role='button'][aria-label='Mark as read'][data-tooltip*='Mark as read']
        - div.G-Ni div[role='button'][aria-label='Mark as read']
      verify_target: tr.zA.zE:has(span[data-legacy-thread-id='{{thread_id}}'])
    overrides:
      verify_timeout_ms: 6000

  gmail.toolbar_mark_unread_button:
    archetype: click_reveals
    irreversible: true
    selectors:
      trigger:
        - div[role='button'][aria-label='Mark as unread'][data-tooltip*='Mark as unread']
        - div.G-Ni div[role='button'][aria-label='Mark as unread']
      verify_target: tr.zA.zE:has(span[data-legacy-thread-id='{{thread_id}}'])
    overrides:
      verify_timeout_ms: 6000

  gmail.toolbar_labels_button:
    archetype: click_reveals
    selectors:
      trigger:
        - div[role='button'][aria-label='Labels'][data-tooltip='Labels']
        - div.G-Ni div[role='button'][aria-label='Labels']
      verify_target: div[role='menu'] input[placeholder='Label as:']
    overrides:
      verify_timeout_ms: 6000

  gmail.toolbar_move_button:
    archetype: click_reveals
    selectors:
      trigger:
        - div[role='button'][act='8']
        - div[role='button'][aria-label^='Move to'][act='8']
        - div[role='button'][data-tooltip^='Move to'][act='8']
        - div.G-Ni div[role='button'][act='8']
      verify_target: div[role='menu'].J-M div[role='menuitem'],
        div[role='menu'] div[role='menuitem']
    overrides:
      verify_timeout_ms: 6000

  # ─── Menu typeaheads (LEGACY: typeahead_menu variant) ─────────────
  # TODO Phase 1b: add `typeahead_menu` archetype (type-into-menu +
  # click match + verify menu disappears). 2 users; worth adding when
  # a 3rd SaaS surfaces the same pattern.

  gmail.label_menu_search:
    archetype: typeahead
    fill:
      - id: type_label
        type: fill_text
        args:
          selector:
            - div[role='menu'] input[placeholder='Label as:']
            - div[role='menu'] input[type='text']
          value: "{{value}}"
      - id: pick_match
        type: click
        args:
          selector:
            - div[role='menu'] div[role='menuitemcheckbox'][aria-label*='{{value}}']
            - div[role='menu'] div[role='menuitem']:nth-of-type(1)
        verify:
          type: selector_disappears
          selector: div[role='menu'] input[placeholder='Label as:']
          timeout_ms: 6000

  gmail.move_menu_search:
    archetype: typeahead
    fill:
      - id: type_destination
        type: fill_text
        args:
          selector:
            - div[role='menu'] input[placeholder='Move to:']
            - div[role='menu'] input[type='text']
          value: "{{value}}"
      - id: pick_match
        type: click
        args:
          selector:
            - div[role='menu'] div[role='menuitem'][aria-label*='{{value}}']
            - div[role='menu'] div[role='menuitem']:nth-of-type(1)
        verify:
          type: selector_disappears
          selector: div[role='menu'] input[placeholder='Move to:']
          timeout_ms: 6000

  # ─── Compose form fields ──────────────────────────────────────────

  gmail.compose_to_input:
    archetype: typeahead_chip
    selectors:
      trigger:
        - div[role='dialog'] input[aria-label='To recipients']
        - div[role='dialog'] input[role='combobox'][aria-label='To recipients']
        - div[role='dialog'] div[name='to'] input[aria-label='To recipients']
        - div[role='dialog'] input[peoplekit-id='BbVjBd']
      input:
        - div[role='dialog'] input[aria-label='To recipients']
        - div[role='dialog'] input[role='combobox'][aria-label='To recipients']
        - div[role='dialog'] div[name='to'] input[aria-label='To recipients']
      verify_target: div[role='dialog'] div[role='option'][data-name], div[role='dialog']
        input[name='subjectbox']

  gmail.compose_cc_input:
    archetype: typeahead_chip
    selectors:
      trigger:
        - span[role='link'][aria-label*='Add Cc']
        - span[aria-label='Add Cc recipients']
      input:
        - input[aria-label='CC recipients'][role='combobox']
        - div[name='cc'] input[role='combobox']
        - input[aria-label='Cc recipients'][role='combobox']
      verify_target: div[name='cc'] input[role='combobox']
    overrides:
      verify_timeout_ms: 3000

  gmail.compose_bcc_input:
    archetype: typeahead_chip
    selectors:
      trigger:
        - span[role='link'][aria-label*='Add Bcc']
        - span[aria-label='Add Bcc recipients']
      input:
        - input[aria-label='BCC recipients']
        - div[name='bcc'] input[role='combobox']
        - input[aria-label='Bcc recipients']
      verify_target: input[aria-label='BCC recipients'],
        div[name='bcc'] input[role='combobox']
    overrides:
      verify_timeout_ms: 3000

  gmail.compose_subject_input:
    archetype: text_input
    selectors:
      fill_target:
        - input[name='subjectbox'][aria-label='Subject']
        - input[name='subjectbox']
      read_target:
        - input[name='subjectbox']

  gmail.compose_body_editor:
    archetype: contenteditable_input
    selectors:
      fill_target:
        - div[aria-label='Message Body'][role='textbox'][contenteditable='true']
        - div[role='textbox'][aria-label*='Message']
      read_target:
        - div[aria-label='Message Body'][role='textbox']

  gmail.compose_send_button:
    archetype: click_dismisses
    irreversible: true
    selectors:
      trigger:
        - div[role='region'][aria-label='New Message']
          div[role='button'][aria-label^='Send']
        - div[role='region'][aria-label='New Message']
          div[role='button'][data-tooltip^='Send']
        - div[role='button'][aria-label^='Send '][aria-label*='Ctrl-Enter']
        - div[role='button'][data-tooltip^='Send '][data-tooltip*='Ctrl-Enter']
      verify_target: div[role='region'][aria-label='New Message']

  # ─── Thread view reads ────────────────────────────────────────────

  gmail.thread_subject_heading:
    archetype: read_text
    selectors:
      read_target:
        - h2.hP
        - div[role='main'] h2[data-thread-perm-id]

  gmail.thread_from:
    archetype: read_attribute
    selectors:
      read_target:
        - div[role='main'] span.gD[email]
        - div[role='main'] span[data-hovercard-id]
    overrides:
      attribute: email

  gmail.thread_body:
    archetype: read_text
    selectors:
      read_target:
        - div[role='main'] div.a3s.aiL
        - div[role='main'] div.ii.gt div.a3s

  # ─── Thread action buttons (open thread state) ────────────────────

  gmail.thread_archive_button:
    archetype: click_reveals
    irreversible: true
    selectors:
      trigger:
        - div[role='button'][act='7'][title='Archive'][tabindex='0']
        - div[role='button'][title='Archive'][act='7']
        - div[role='button'][aria-label='Archive'][data-tooltip='Archive']:not([aria-disabled='true'])
      verify_target: div.b8.UC div.vh

  gmail.thread_delete_button:
    archetype: click_reveals
    irreversible: true
    selectors:
      trigger:
        - div[role='button'][aria-label='Delete'][data-tooltip='Delete']
        - div[role='button'][aria-label='Delete'][act='10']
        - div[role='button'][aria-label='Delete']
      verify_target: div.b8.UC div.vh

  gmail.thread_star_button:
    archetype: click_reveals
    irreversible: true
    selectors:
      trigger:
        - div[role='main'] div[role='checkbox'][aria-label='Not starred']
        - div[role='main'] div[role='checkbox'][aria-label='Starred']
        - div[role='main'] div[role='checkbox'][data-tooltip='Not starred']
        - div[role='main'] div[role='checkbox'][data-tooltip='Starred']
      verify_target: div[role='main'] div[role='checkbox'][aria-label='Starred'],
        div[role='main'] div[role='checkbox'][aria-label='Not starred']
    overrides:
      verify_timeout_ms: 4000

  gmail.thread_mark_unread_button:
    archetype: click_navigates
    irreversible: true
    selectors:
      trigger:
        - div[role='button'][aria-label='Mark as unread'][data-tooltip='Mark as unread']
        - div[role='button'][aria-label='Mark as unread']
        - "[aria-label='Mark as unread'][role='button']"
    overrides:
      url_pattern: "#inbox$|#search"
      verify_timeout_ms: 6000

  gmail.thread_reply_button:
    archetype: click_reveals
    selectors:
      trigger:
        - div[role='main'] button[aria-label='Reply']
        - div[role='main'] [role='button'][aria-label='Reply']
        - div[role='main'] [aria-label='Reply']
      verify_target: div[role='main'] div[role='textbox'][aria-label*='Message Body']
    overrides:
      verify_timeout_ms: 6000

  # ─── Reply-all (LEGACY: 2-step composite) ─────────────────────────
  # TODO Phase 1b: needs a "menu_item_pick" archetype OR a multi-step
  # composite primitive. Open the More-options menu, click the
  # Reply-all menuitem. 1 user today.

  gmail.thread_reply_all_button:
    archetype: panel_button
    invoke:
      - id: open_more_message_options
        type: click
        args:
          selector:
            - div[role='main'] button[aria-label='More message options']
            - div[role='main'] [role='button'][aria-label='More message options']
        verify:
          type: selector_appears
          selector: "[role='menu'][aria-label='More message options menu']
            [role='menuitem'][data-action-type='24'],
            [role='menu'][aria-label*='message options' i]
            [role='menuitem'][data-action-type='24']"
          timeout_ms: 4000
      - id: click_reply_all_menuitem
        type: click
        args:
          selector:
            - "[role='menu'][aria-label='More message options menu']
              [role='menuitem'][data-action-type='24']"
            - "[role='menu'][aria-label*='message options' i]
              [role='menuitem'][data-action-type='24']"
            - ul[role='menu'] li[role='menuitem'][data-action-type='24']
        verify:
          type: selector_appears
          selector: div[role='main'] div[role='textbox'][aria-label*='Message Body']
          timeout_ms: 6000

  gmail.thread_forward_button:
    archetype: click_reveals
    selectors:
      trigger:
        - div[role='main'] span[role='link'].ams.bkG
        - div[role='main'] span[role='link'][aria-label='Forward']
        - div[role='main'] div[role='button'][aria-label='Forward']
      verify_target: div[role='main'] input[aria-label='To recipients'], div[role='main']
        div[role='textbox'][aria-label*='Message Body']
    overrides:
      verify_timeout_ms: 6000

  gmail.thread_attachment_download:
    archetype: click_reveals
    irreversible: true
    # NOTE: verify_target is intentionally weak (div[role='main'] is
    # present on every thread view) because the actual download is a
    # browser dialog that no DOM selector can probe. Marked irreversible
    # so build-time validation skips it. Better verify pending Chrome's
    # downloads API exposure or a per-attachment status indicator.
    selectors:
      trigger:
        - div[role='main'] div.aZi[aria-label*='{{filename}}'] a[download]
        - div[role='main'] div.aQw a[download][aria-label*='{{filename}}']
        - div[role='main'] div[aria-label*='Download attachment'][role='button']
      verify_target: div[role='main']
    overrides:
      verify_timeout_ms: 15000

  # ─── Inline reply (reply panel inside the open thread) ────────────

  gmail.reply_to_input:
    archetype: typeahead_chip
    selectors:
      trigger:
        - div[role='dialog'] textarea[name='to']
        - div[role='dialog'] input[name='to']
        - div[role='main'] textarea[name='to']
        - div[role='main'] input[name='to']
        - textarea[aria-label='To recipients']
        - input[aria-label='To recipients']
        - div[role='dialog'] [aria-label*='To recipients' i]
        - div[role='main'] [aria-label*='To recipients' i]
        - "[peoplekit-id] input[aria-label*='To' i]"
      input:
        - div[role='dialog'] textarea[name='to']
        - div[role='dialog'] input[name='to']
        - div[role='main'] textarea[name='to']
        - div[role='main'] input[name='to']
        - textarea[aria-label='To recipients']
        - input[aria-label='To recipients']
        - div[role='dialog'] [aria-label*='To recipients' i]
        - div[role='main'] [aria-label*='To recipients' i]
      verify_target: div[role='textbox'][aria-label*='essage' i],
        div[role='textbox'][g_editable='true'],
        div[contenteditable='true'][aria-label*='essage' i]

  gmail.reply_body_editor:
    archetype: contenteditable_input
    selectors:
      fill_target:
        - div[role='main'] div[role='textbox'][aria-label*='Message Body'][contenteditable='true']
        - div[role='main'] div[role='textbox'][aria-label*='Message']
      read_target:
        - div[role='main'] div[role='textbox'][aria-label*='Message Body']

  gmail.reply_send_button:
    archetype: click_dismisses
    irreversible: true
    selectors:
      trigger:
        - div[role='main'] div[role='button'][aria-label^='Send '][aria-label*='Ctrl-Enter']
        - div[role='main'] div[role='button'][data-tooltip^='Send '][data-tooltip*='Ctrl-Enter']
      verify_target: div[role='main'] div[role='textbox'][aria-label*='Message Body']
